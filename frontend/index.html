<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>散户低频策略交易平台</title>
<!-- 使用系统字体，避免 Google Fonts 在国内慢/阻断导致 2.9 分钟加载 -->
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
<style>
:root{--bg:#f1f5f9;--bg2:#e2e8f0;--card:#fff;--card2:#f8fafc;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--primary:#2563eb;--primary-light:#3b82f6;--primary-bg:rgba(37,99,235,.08);--green:#10b981;--green-bg:rgba(16,185,129,.1);--red:#ef4444;--red-bg:rgba(239,68,68,.1);--orange:#f59e0b;--orange-bg:rgba(245,158,11,.1);--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.12);--radius:12px;--font:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;--font-num:'PingFang SC','Microsoft YaHei','Outfit',system-ui,sans-serif}
html.dark{--bg:#0f172a;--bg2:#1e293b;--card:#1e293b;--card2:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--primary:#3b82f6;--primary-light:#60a5fa;--primary-bg:rgba(59,130,246,.15);--green:#34d399;--green-bg:rgba(52,211,153,.15);--red:#f87171;--red-bg:rgba(248,113,113,.15);--orange:#fbbf24;--orange-bg:rgba(251,191,36,.15);--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 8px 30px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:var(--font);font-size:15px}
.page{display:none;animation:fadeIn .4s ease}.page.active{display:block}.page.active.login-page{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.stagger>*{opacity:0;animation:fadeIn .5s ease forwards}.stagger>*:nth-child(1){animation-delay:.05s}.stagger>*:nth-child(2){animation-delay:.1s}.stagger>*:nth-child(3){animation-delay:.15s}.stagger>*:nth-child(4){animation-delay:.2s}.stagger>*:nth-child(5){animation-delay:.25s}.stagger>*:nth-child(6){animation-delay:.3s}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:500;transition:all .2s;font-size:15px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.9}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{opacity:.9}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-ghost{background:transparent;color:var(--text2);padding:6px 12px}.btn-ghost:hover{background:var(--primary-bg);color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s}.card:hover{box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green)}.badge-red{background:var(--red-bg);color:var(--red)}.badge-blue{background:var(--primary-bg);color:var(--primary)}.badge-orange{background:var(--orange-bg);color:var(--orange)}.badge-gray{background:var(--bg2);color:var(--text3)}
.form-group{margin-bottom:16px}.form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
textarea.ws-logic-loading{animation:ws-logic-pulse 1.5s ease-in-out infinite}
@keyframes ws-logic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.2)}50%{box-shadow:0 0 0 6px rgba(37,99,235,0)}}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:6px;font-size:13px;background:var(--bg);color:var(--text2);border:1px solid var(--border);cursor:pointer;transition:all .2s}
.tag.active,.tag:hover{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}
.toggle{position:relative;width:48px;height:26px;background:var(--bg2);border-radius:13px;cursor:pointer;transition:background .3s;border:none}.toggle.on{background:var(--primary)}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.toggle.on::after{transform:translateX(22px)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:16px;padding:28px;max-width:520px;width:90%;max-height:85vh;overflow-y:auto;animation:scaleIn .3s ease}.modal h3{font-size:18px;margin-bottom:16px}
.st-template-detail-overlay{padding:20px}
.st-template-detail-modal{width:min(1100px,92vw);max-width:min(1100px,92vw);min-width:680px;min-height:520px;max-height:88vh;resize:both;overflow:auto;padding:24px 24px 18px}
.st-template-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.st-template-detail-title{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;line-height:1.35}
.st-template-detail-sub{font-size:13px;color:var(--text2);line-height:1.75;margin-bottom:16px}
.st-template-detail-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:16px;align-items:start}
.st-template-detail-main,.st-template-detail-side{display:flex;flex-direction:column;gap:14px}
.st-template-detail-section{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.st-template-detail-label{font-size:12px;font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.st-template-detail-label.primary{color:var(--primary)}
.st-template-detail-label.muted{color:var(--text2)}
.st-template-detail-desc{font-size:16px;line-height:1.85;color:var(--text);font-weight:600}
.st-template-detail-rich p{margin:0 0 10px;font-size:14px;line-height:1.9;color:var(--text2)}
.st-template-detail-rich p:last-child{margin-bottom:0}
.st-template-detail-code{margin:0;padding:12px;border-radius:10px;background:rgba(15,23,42,.04);font-size:12px;line-height:1.65;white-space:pre-wrap;font-family:var(--font-mono,monospace);color:var(--text);overflow:auto}
.st-template-detail-list{margin:0;padding-left:18px;font-size:13px;color:var(--text2);line-height:1.8}
.st-template-detail-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),var(--card) 18%)}
@media(max-width:900px){.st-template-detail-overlay{padding:12px}.st-template-detail-modal{width:100%;max-width:100%;min-width:0;min-height:auto;max-height:92vh;resize:none;padding:18px 16px 16px}.st-template-detail-grid{grid-template-columns:1fr}.st-template-detail-title{font-size:18px}}
table{width:100%;border-collapse:collapse}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
th{font-weight:500;color:var(--text2);background:var(--card2)}tr:hover{background:var(--primary-bg)}
.tooltip-icon{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bg2);color:var(--text3);font-size:11px;cursor:help;margin-left:4px;position:relative}
.tooltip-icon:hover .tt{display:block}.tt{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:12px;white-space:normal;max-width:260px;z-index:100;font-weight:400}
.slider-wrap{display:flex;align-items:center;gap:12px}.slider-wrap input[type=range]{flex:1;accent-color:var(--primary);height:6px}.slider-wrap .val{font-family:var(--font-num);font-weight:600;min-width:50px;text-align:right;color:var(--primary)}
.tab-bar{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px}.tab-bar .tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);transition:all .2s;border:none;background:transparent}.tab-bar .tab.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.indicator-card{text-align:center;padding:20px;border-radius:var(--radius);background:var(--card2);border:1px solid var(--border)}.indicator-card .val{font-family:var(--font-num);font-size:28px;font-weight:700;margin:8px 0 4px}.indicator-card .label{font-size:13px;color:var(--text2)}
/* Layout */
.page.active.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a,#1e3a5f);padding:20px}
.login-box{background:var(--card);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}.login-box h2{text-align:center;margin-bottom:6px;font-size:22px}
.sms-row{display:flex;gap:8px}.sms-row input{flex:1}.sms-row .btn{white-space:nowrap;flex-shrink:0}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .3s}
.sidebar .logo{padding:12px 20px 20px;font-size:18px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px}.sidebar .logo i{font-size:22px}
.sidebar-nav{flex:1;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;border-left:3px solid transparent;text-decoration:none}
.sidebar-nav a:hover{background:var(--primary-bg);color:var(--primary)}
.sidebar-nav a.active{color:var(--primary);background:var(--primary-bg);border-left-color:var(--primary)}
.sidebar-nav a i{width:20px;text-align:center}
.sidebar-nav a .lock{font-size:10px;color:var(--text3);margin-left:auto}
.main-area{flex:1;margin-left:240px}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}.topbar-right{display:flex;align-items:center;gap:12px}
/* === Env Segmented Control === */
.env-seg{display:flex;align-items:center;background:var(--bg);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--border)}
.env-seg .seg-item{padding:6px 16px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:5px;white-space:nowrap;user-select:none;position:relative}
.env-seg .seg-item.active-sim{background:var(--green-bg);color:var(--green);box-shadow:0 1px 3px rgba(16,185,129,.2)}
.env-seg .seg-item.active-real{background:var(--red-bg);color:var(--red);box-shadow:0 1px 3px rgba(239,68,68,.2)}
.env-seg .seg-item.inactive{color:var(--text3)}
.env-seg .seg-item.inactive:hover{color:var(--text2);background:var(--card)}
.env-seg .seg-item.locked{color:var(--text3);opacity:.5;cursor:not-allowed}
.env-seg .seg-item .seg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.env-seg .seg-item .seg-lock{font-size:9px;margin-left:2px}
/* tooltip on hover for segmented control */
.env-seg .seg-item[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:11px;font-weight:400;white-space:nowrap;z-index:100;pointer-events:none;animation:fadeIn .2s}
.env-seg .seg-item[data-tip]:hover::before{content:'';position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-bottom-color:var(--text);z-index:100;pointer-events:none;animation:fadeIn .2s}
.env-seg-hint{font-size:12px;font-weight:600;color:var(--primary);margin-left:8px;white-space:nowrap;display:flex;align-items:center;justify-content:center;padding:0 12px}
.role-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600}
.role-beginner{background:var(--green-bg);color:var(--green)}.role-advanced{background:var(--primary-bg);color:var(--primary)}.role-expert{background:var(--orange-bg);color:var(--orange)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;cursor:pointer}
.content{padding:24px}.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}.content-header h1{font-size:22px;font-weight:700}
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--text);cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.section-title{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}.section-title i{color:var(--primary)}
.ai-input-area{background:linear-gradient(135deg,var(--primary-bg),rgba(16,185,129,.05));border:1.5px solid var(--primary);border-radius:var(--radius);padding:20px;margin-bottom:24px}
.ai-input-area textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px;min-height:80px;resize:vertical;font-size:15px;background:var(--card);color:var(--text)}
.ai-result{background:var(--card2);border-radius:10px;padding:16px;margin-top:14px;border-left:3px solid var(--primary)}
.chart-container{position:relative;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden}.chart-container canvas{width:100%;display:block}
.mode-btn-group{display:flex;gap:8px;flex-wrap:wrap}
.mode-btn{padding:12px 24px;border-radius:10px;border:2px solid var(--border);background:var(--card);cursor:pointer;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:8px}
.mode-btn.active{border-color:var(--primary);background:var(--primary-bg);color:var(--primary)}
.mode-btn.locked{opacity:.5;cursor:not-allowed}
.env-sim .sidebar{border-left:3px solid var(--green)}.env-real .sidebar{border-left:3px solid var(--red)}
.toast{position:fixed;top:24px;right:24px;z-index:9999;padding:14px 24px;border-radius:10px;font-size:14px;font-weight:500;animation:fadeIn .3s;max-width:400px;box-shadow:var(--shadow-lg)}
.toast-success{background:var(--green);color:#fff}.toast-error{background:var(--red);color:#fff}.toast-info{background:var(--primary);color:#fff}.toast-warn{background:var(--orange);color:#fff}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}.empty-state i{font-size:48px;margin-bottom:16px;opacity:.5}
.perm-denied{padding:40px;text-align:center;color:var(--text3)}.perm-denied i{font-size:36px;margin-bottom:12px;display:block;opacity:.4}
/* === DASHBOARD ENHANCED === */
.dash-asset-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.dash-asset-item{background:var(--card);border-radius:var(--radius);padding:16px 20px;border:1px solid var(--border);transition:all .2s;position:relative;overflow:hidden}
.dash-asset-item:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.dash-asset-item .a-label{font-size:12px;color:var(--text3);margin-bottom:6px;display:flex;align-items:center;gap:4px}
.dash-asset-item .a-val{font-family:var(--font-num);font-size:22px;font-weight:700;line-height:1.2}
.dash-asset-item .a-sub{font-size:12px;margin-top:4px;font-family:var(--font-num);font-weight:500}
.dash-asset-item .a-icon{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:28px;opacity:.08}
.dash-section{margin-bottom:20px}
.dash-section .ds-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}.ds-title i{color:var(--primary);font-size:14px}
.dash-section .ds-more{margin-left:auto;font-size:12px;color:var(--primary);cursor:pointer;font-weight:500}
.dash-strategy-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);transition:all .2s;cursor:pointer}
.dash-strategy-card:hover{box-shadow:var(--shadow-lg);border-color:var(--primary)}
.dash-strategy-card .sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-strategy-card .sc-name{font-weight:600;font-size:15px}
.dash-strategy-card .sc-desc{font-size:13px;color:var(--text3);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dash-strategy-card .sc-stats{display:flex;gap:16px;font-size:12px;color:var(--text2)}
.dash-strategy-card .sc-stats span{display:flex;align-items:center;gap:4px}
.dash-ai-card{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);border-radius:var(--radius);padding:24px;color:#fff;position:relative;overflow:hidden}
html.dark .dash-ai-card{background:linear-gradient(135deg,#1e293b 0%,#3b82f6 100%)}
.dash-ai-card .ai-bg-icon{position:absolute;right:-10px;bottom:-10px;font-size:80px;opacity:.1}
.dash-ai-card h3{font-size:16px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.dash-ai-card p{font-size:13px;opacity:.85;margin-bottom:14px;line-height:1.5}
.dash-ai-card .ai-input-row{display:flex;gap:8px}
.dash-ai-card .ai-input-row input{flex:1;padding:10px 14px;border-radius:8px;border:none;font-size:14px;background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(4px)}
.dash-ai-card .ai-input-row input::placeholder{color:rgba(255,255,255,.5)}
.dash-ai-card .ai-input-row button{padding:10px 20px;border-radius:8px;border:none;background:#fff;color:var(--primary);font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap;transition:all .2s}
.dash-ai-card .ai-input-row button:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.dash-ai-card .ai-examples{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.dash-ai-card .ai-ex-tag{padding:4px 10px;border-radius:20px;font-size:11px;background:rgba(255,255,255,.15);cursor:pointer;transition:all .2s}
.dash-ai-card .ai-ex-tag:hover{background:rgba(255,255,255,.3)}
.dash-market-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.dash-market-item:last-child{border-bottom:none}
.dash-market-item .m-name{font-weight:500;font-size:14px}
.dash-market-item .m-code{font-size:11px;color:var(--text3);font-family:var(--font-num)}
.dash-market-item .m-price{font-family:var(--font-num);font-weight:600;font-size:14px}
.dash-market-item .m-change{font-family:var(--font-num);font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px;min-width:64px;text-align:center}
.dash-alert-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.dash-alert-item:last-child{border-bottom:none}
.dash-alert-item .al-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.dash-alert-item .al-text{font-size:13px;font-weight:500;line-height:1.4}
.dash-alert-item .al-time{font-size:11px;color:var(--text3);margin-top:2px}
.dash-community-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.dash-community-item:last-child{border-bottom:none}
.dash-community-item .cm-rank{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-num)}
.dash-community-item .cm-name{font-weight:500;font-size:14px;flex:1}
.dash-community-item .cm-val{font-family:var(--font-num);font-size:13px;font-weight:600}
.dash-guide-card{background:linear-gradient(135deg,var(--green-bg),rgba(16,185,129,.02));border:1.5px dashed var(--green);border-radius:var(--radius);padding:24px;text-align:center}
.dash-guide-card i{font-size:36px;color:var(--green);margin-bottom:10px}
.dash-guide-card h4{font-size:15px;margin-bottom:6px}.dash-guide-card p{font-size:13px;color:var(--text2);margin-bottom:14px}
@media(max-width:768px){.dash-asset-bar{grid-template-columns:repeat(2,1fr)}.dash-asset-bar>:last-child{grid-column:span 2}}
/* === STRATEGY PAGE === */
/* Layout: left card list + right drawer */
.st-layout{display:flex;gap:0;height:calc(100vh - 140px);overflow:hidden}
.st-left{width:360px;min-width:300px;max-width:400px;overflow-y:auto;padding-right:14px;border-right:1.5px solid var(--border);flex-shrink:0}
.st-right{flex:1;overflow-y:auto;padding-left:20px;padding-right:4px}
.st-right.empty{display:flex;align-items:center;justify-content:center}
/* AI Bar */
.st-ai-bar{display:flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:12px;transition:all .3s}
.st-ai-bar.expanded{flex-direction:column;align-items:stretch;padding:14px}
.st-ai-bar .ai-icon{color:var(--primary);font-size:14px;flex-shrink:0}
.st-ai-bar input{flex:1;border:none;background:transparent;font-size:13px;color:var(--text);outline:none;min-width:0}
.st-ai-bar input::placeholder{color:var(--text3)}
.st-ai-bar .ai-expand-result{margin-top:12px;padding:14px;background:var(--card);border-radius:8px;border-left:3px solid var(--primary);font-size:13px;line-height:1.8}
.st-ai-bar.ai-unavail{opacity:.65;background:var(--bg)}
.st-ai-bar.ai-unavail input{pointer-events:none}
/* Card list (left column) */
.st-card-list{display:flex;flex-direction:column;gap:10px}
.st-card{background:var(--card);border-radius:var(--radius);padding:14px;border:1.5px solid var(--border);cursor:pointer;transition:all .22s}
.st-card:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.st-card.selected{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);background:rgba(37,99,235,.03)}
.st-card .sc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.st-card .sc-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-card .sc-logic{font-size:12px;color:var(--text2);line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-card .sc-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.st-card .sc-metric{text-align:center;padding:5px 2px;background:var(--card2);border-radius:6px}
.st-card .sc-metric .mv{font-family:var(--font-num);font-size:13px;font-weight:700;line-height:1.2}
.st-card .sc-metric .ml{font-size:10px;color:var(--text3);margin-top:2px}
.st-card .sc-meta{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--text3);flex-wrap:wrap}
.st-status{font-size:11px;padding:2px 8px;border-radius:12px;font-weight:600}
.st-status.draft{background:var(--bg);color:var(--text3)}.st-status.backtested{background:var(--primary-bg);color:var(--primary)}
.st-status.published{background:var(--green-bg);color:var(--green)}.st-status.running{background:var(--green-bg);color:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
/* Guide card (always at bottom) */
.st-guide-card{background:linear-gradient(135deg,var(--primary-bg),rgba(37,99,235,.03));border:2px dashed var(--primary);border-radius:var(--radius);padding:16px;text-align:center;cursor:default;transition:all .25s}
.st-guide-card .gc-title{font-weight:600;font-size:14px;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;justify-content:center;gap:6px}
.st-guide-card .gc-entries{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.st-guide-card .gc-entry{padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:12px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:4px}
.st-guide-card .gc-entry:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px)}
.st-guide-card .gc-entry.rec{border-color:var(--primary);color:var(--primary);font-weight:600}
/* Drawer (right panel) */
.st-drawer-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1.5px solid var(--border);margin-bottom:14px}
.st-drawer-head .dh-name{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.st-drawer-head .dh-actions{margin-left:auto;display:flex;gap:6px}
.st-ws-tabs{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:14px;gap:2px;flex-wrap:wrap}
.st-ws-tabs .ws-tab{padding:7px 14px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:8px;transition:all .2s}
.st-ws-tabs .ws-tab.active{color:var(--primary);background:var(--card);box-shadow:var(--shadow)}
.st-ws-tabs .ws-tab:hover{color:var(--primary)}
.st-ws-body{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
/* Indicator Accordion */
.ind-accordion{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.ind-section{border:1px solid var(--border);border-radius:8px;overflow:hidden;transition:border-color .2s}
.ind-section.open{border-color:var(--primary)}
.ind-section-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:500;background:var(--card2);transition:background .2s;user-select:none}
.ind-section-head:hover{background:var(--bg)}
.ind-section.open .ind-section-head{background:var(--primary-bg);color:var(--primary)}
.ind-section-head .ind-arrow{transition:transform .2s;font-size:10px;color:var(--text3)}
.ind-section.open .ind-section-head .ind-arrow{transform:rotate(90deg);color:var(--primary)}
.ind-section-head .ind-cnt{margin-left:auto;font-size:11px;padding:1px 6px;border-radius:10px;background:var(--primary);color:#fff;font-weight:600;min-width:16px;text-align:center}
.ind-section-head .ind-cnt.zero{background:var(--bg);color:var(--text3)}
.ind-section-head .ind-lock{margin-left:auto;font-size:11px;color:var(--text3)}
.ind-section-body{padding:10px 12px;display:none;flex-wrap:wrap;gap:6px}
.ind-section.open .ind-section-body{display:flex}
.ind-chip{padding:4px 10px;border-radius:6px;font-size:12px;background:var(--bg);color:var(--text2);cursor:pointer;border:1px solid transparent;transition:all .15s;user-select:none}
.ind-chip:hover{border-color:var(--primary);color:var(--primary)}
.ind-chip.sel{background:var(--primary-bg);color:var(--primary);border-color:var(--primary);font-weight:600}
.ind-chip.locked{opacity:.4;cursor:not-allowed}
.ind-recommend{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ind-recommend .rec-btn{padding:4px 10px;border-radius:6px;font-size:11px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.ind-recommend .rec-btn:hover{border-color:var(--primary);color:var(--primary)}
/* Wizard */
.st-wizard{max-width:700px;margin:0 auto}
.st-wiz-steps{display:flex;justify-content:center;gap:4px;margin-bottom:32px}
.st-wiz-step{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;color:var(--text3);background:var(--bg);transition:all .2s}
.st-wiz-step.active{background:var(--primary-bg);color:var(--primary)}
.st-wiz-step.done{background:var(--green-bg);color:var(--green)}
.st-wiz-step .step-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--bg2);color:var(--text3)}
.st-wiz-step.active .step-num{background:var(--primary);color:#fff}
.st-wiz-step.done .step-num{background:var(--green);color:#fff}
.st-wiz-body{animation:fadeIn .4s ease}
.st-wiz-nav{display:flex;justify-content:space-between;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.st-entry-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}
.st-entry-card{background:var(--card);border-radius:var(--radius);padding:24px;text-align:center;border:2px solid var(--border);cursor:pointer;transition:all .25s}
.st-entry-card:hover{border-color:var(--primary);box-shadow:var(--shadow-lg);transform:translateY(-3px)}
.st-entry-card.recommended{border-color:var(--primary);position:relative}
.st-entry-card.recommended::after{content:'推荐';position:absolute;top:8px;right:8px;font-size:10px;background:var(--primary);color:#fff;padding:2px 8px;border-radius:10px;font-weight:600}
.st-entry-card .ec-icon{font-size:32px;margin-bottom:10px}
.st-entry-card h4{font-size:15px;margin-bottom:6px}.st-entry-card p{font-size:12px;color:var(--text2);line-height:1.5}
@media(max-width:768px){.st-layout{flex-direction:column;height:auto}.st-left{width:100%;max-width:100%;border-right:none;border-bottom:1px solid var(--border);padding-right:0;padding-bottom:12px;max-height:35vh;overflow-y:auto}.st-right{padding-left:0;padding-top:12px}.st-entry-cards{grid-template-columns:1fr}}
@media(max-width:1024px){.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-overlay.open{display:block}.main-area{margin-left:0}.hamburger{display:block}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.topbar{padding:0 16px}.content{padding:16px}.modal{padding:20px;width:95%}}
/* === STRATEGY V2: sparkline, lifecycle, enhanced card, inline backtest === */
.st-card .sc-sparkline{margin:6px 0 4px;height:30px;display:flex;align-items:flex-end}
.st-card .sc-sparkline canvas{width:100%;height:30px;border-radius:4px}
.st-card .sc-actions{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.st-card .sc-actions button{flex:1;padding:5px 0;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:11px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.st-card .sc-actions button:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}
.st-card .sc-bt-time{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:4px;margin-top:4px}
/* Lifecycle stepper */
.stv2-lifecycle{display:flex;align-items:center;gap:0;padding:12px 16px;background:var(--card2);border-radius:10px;margin-bottom:14px}
.stv2-lifecycle .lc-step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);white-space:nowrap}
.stv2-lifecycle .lc-step.active{color:var(--primary);font-weight:600}
.stv2-lifecycle .lc-step.done{color:var(--green);font-weight:500}
.stv2-lifecycle .lc-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:2px solid var(--border);background:var(--card);transition:all .2s}
.stv2-lifecycle .lc-step.active .lc-dot{border-color:var(--primary);background:var(--primary);color:#fff}
.stv2-lifecycle .lc-step.done .lc-dot{border-color:var(--green);background:var(--green);color:#fff}
.stv2-lifecycle .lc-line{flex:1;height:2px;background:var(--border);min-width:16px;margin:0 4px;border-radius:1px}
.stv2-lifecycle .lc-line.done{background:var(--green)}
.stv2-lifecycle .lc-line.active{background:linear-gradient(90deg,var(--green),var(--primary))}
/* Inline backtest quick params */
.stv2-bt-quick{background:var(--card2);border-radius:10px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}
.stv2-bt-quick .bq-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.stv2-bt-quick .bq-row:last-child{margin-bottom:0}
.stv2-bt-quick .bq-label{font-size:12px;color:var(--text2);font-weight:500;min-width:40px}
.stv2-bt-quick .bq-chips{display:flex;gap:4px;flex-wrap:wrap}
.stv2-bt-quick .bq-chip{padding:4px 12px;border-radius:6px;font-size:12px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.stv2-bt-quick .bq-chip:hover{border-color:var(--primary);color:var(--primary)}
.stv2-bt-quick .bq-chip.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
/* Backtest result inline card */
.stv2-bt-result{border:1.5px solid var(--border);border-radius:12px;padding:16px;background:var(--card);margin-top:14px;animation:fadeIn .3s}
.stv2-bt-result .br-grade{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;flex-shrink:0}
.stv2-bt-result .br-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stv2-bt-result .br-m{text-align:center;padding:8px 4px;background:var(--card2);border-radius:8px}
.stv2-bt-result .br-m .v{font-size:18px;font-weight:800;font-family:var(--font-num);line-height:1.2}
.stv2-bt-result .br-m .l{font-size:10px;color:var(--text3);margin-top:3px}
/* Big-font mode strategy page */
.bigfont .st-card .sc-name{font-size:17px}
.bigfont .st-card .sc-logic{font-size:14px}
.bigfont .st-card .sc-metric .mv{font-size:18px}
.bigfont .st-card .sc-metric .ml{font-size:12px}
.bigfont .st-card .sc-actions button{font-size:13px;padding:8px 0}
.bigfont .stv2-bt-result .br-m .v{font-size:22px}
.bigfont .stv2-bt-result .br-m .l{font-size:12px}
.bigfont .stv2-lifecycle .lc-step{font-size:14px}
.bigfont .stv2-lifecycle .lc-dot{width:30px;height:30px;font-size:13px}
.bigfont .st-drawer-head .dh-name{font-size:20px}
.bigfont .st-ws-tabs .ws-tab{font-size:15px;padding:9px 16px}
.bigfont .stv2-bt-quick .bq-label{font-size:14px}
.bigfont .stv2-bt-quick .bq-chip{font-size:14px;padding:6px 14px}
/* Backtest history list */
.stv2-bt-history{margin-top:14px}
.stv2-bt-history .bh-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:1px solid var(--border);margin-bottom:6px;font-size:12px;transition:background .15s}
.stv2-bt-history .bh-item:hover{background:var(--card2)}
.stv2-bt-history .bh-grade{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.stv2-bt-history .bh-body{flex:1;display:flex;flex-direction:column;gap:2px}
.stv2-bt-history .bh-date{color:var(--text3);font-size:10px}
.stv2-bt-history .bh-nums{display:flex;gap:12px;font-family:var(--font-num);font-weight:600}
/* === MARKET PAGE === */
.mkt-idx-bar{display:flex;gap:8px;padding:12px 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}.mkt-idx-bar::-webkit-scrollbar{display:none}
.mkt-idx-item{flex:0 0 auto;min-width:160px;padding:10px 16px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mkt-idx-item:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.mkt-idx-item .idx-name{font-size:12px;color:var(--text3);font-weight:500;margin-bottom:4px;white-space:nowrap}
.mkt-idx-item .idx-price{font-family:var(--font-num);font-size:20px;font-weight:700;line-height:1.2}
.mkt-idx-item .idx-chg{font-family:var(--font-num);font-size:12px;font-weight:600;margin-top:2px}
.mkt-idx-item .idx-spark{position:absolute;bottom:0;right:0;width:60px;height:30px;opacity:.15}
.mkt-tabs{display:flex;gap:2px;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.mkt-tabs::-webkit-scrollbar{display:none}
.mkt-tab{flex:0 0 auto;padding:8px 16px;border-radius:8px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;background:transparent;color:var(--text3);white-space:nowrap;display:flex;align-items:center;gap:5px}
.mkt-tab.active{background:var(--card);color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06);font-weight:600}
.mkt-tab .tab-count{font-size:10px;background:var(--primary-bg);color:var(--primary);padding:1px 6px;border-radius:10px;font-weight:600}
.mkt-sub-tabs{display:flex;gap:6px;margin-bottom:10px}
.mkt-sub-tab{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s}
.mkt-sub-tab.active{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}
.mkt-table{width:100%;border-collapse:separate;border-spacing:0}
.mkt-table thead{position:sticky;top:0;z-index:2}
.mkt-table th{padding:8px 12px;font-size:11px;font-weight:600;color:var(--text3);background:var(--card2);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;transition:color .15s}
.mkt-table th:hover{color:var(--primary)}
.mkt-table th.sorted{color:var(--primary)}
.mkt-table th .sort-arrow{font-size:9px;margin-left:3px;opacity:.5}.mkt-table th.sorted .sort-arrow{opacity:1}
.mkt-table th:first-child{border-radius:8px 0 0 0;padding-left:16px}.mkt-table th:last-child{border-radius:0 8px 0 0;padding-right:16px}
.mkt-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--border);transition:background .15s;white-space:nowrap}
.mkt-table td:first-child{padding-left:16px}.mkt-table td:last-child{padding-right:16px}
.mkt-table tr{cursor:pointer;transition:background .1s}.mkt-table tbody tr:hover{background:var(--primary-bg)}
.mkt-table .col-name{font-weight:600;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.mkt-table .col-code{font-size:11px;color:var(--text3);font-family:var(--font-num)}
.mkt-table .col-num{font-family:var(--font-num);font-weight:600;text-align:right}
.mkt-table .col-pct{font-family:var(--font-num);font-weight:600;text-align:right;padding:3px 8px;border-radius:4px;display:inline-block;min-width:64px;text-align:center}
.mkt-table .col-fav{text-align:center;width:36px}
.mkt-table .col-fav button{border:none;background:none;cursor:pointer;font-size:14px;padding:2px;transition:transform .15s}.mkt-table .col-fav button:hover{transform:scale(1.2)}
@keyframes mkt-flash-red{0%{background:rgba(239,68,68,.2)}100%{background:transparent}}
@keyframes mkt-flash-green{0%{background:rgba(16,185,129,.2)}100%{background:transparent}}
.mkt-flash-up{animation:mkt-flash-red .6s ease}.mkt-flash-down{animation:mkt-flash-green .6s ease}
/* 板块热力图 */
.mkt-heatmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:16px}
.mkt-hm-cell{padding:12px 10px;border-radius:10px;cursor:pointer;transition:all .2s;text-align:center;position:relative;overflow:hidden;min-height:72px;display:flex;flex-direction:column;justify-content:center}
.mkt-hm-cell:hover{transform:scale(1.03);box-shadow:var(--shadow-lg)}
.mkt-hm-cell .hm-name{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);margin-bottom:3px}
.mkt-hm-cell .hm-pct{font-family:var(--font-num);font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.mkt-hm-cell .hm-leader{font-size:10px;color:rgba(255,255,255,.8);margin-top:3px}
/* 自选股分组 */
.mkt-fav-groups{display:flex;gap:4px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.mkt-fav-groups::-webkit-scrollbar{display:none}
.mkt-fav-group{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:4px}
.mkt-fav-group.active{background:var(--primary-bg);color:var(--primary);border-color:var(--primary)}
.mkt-fav-group .fg-count{font-size:10px;background:var(--bg2);padding:1px 5px;border-radius:8px}
.mkt-fav-group.active .fg-count{background:var(--primary);color:#fff}
/* 搜索增强 */
.mkt-search-wrap{position:relative}
.mkt-search-wrap input{width:100%;padding:10px 14px 10px 38px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:13px;transition:all .2s}
.mkt-search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg);outline:none}

.mkt-drawer .d-depth-label{width:28px;color:var(--text3);flex-shrink:0}
.mkt-drawer .d-depth-bar{flex:1;height:16px;border-radius:3px;position:relative}
.mkt-drawer .d-depth-bar span{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:10px;color:#fff;font-weight:600}
.mkt-drawer .d-depth-price{width:64px;text-align:right;font-weight:600}
/* 大字模式 */
.bigfont .mkt-table td{font-size:16px;padding:12px 14px}
.bigfont .mkt-table th{font-size:13px;padding:10px 14px}
.bigfont .mkt-idx-item .idx-price{font-size:26px}
.bigfont .mkt-idx-item .idx-name{font-size:14px}
.bigfont .mkt-hm-cell .hm-name{font-size:15px}
.bigfont .mkt-hm-cell .hm-pct{font-size:18px}
.bigfont .mkt-drawer .d-price{font-size:44px}
.bigfont .col-pct{font-size:15px !important;padding:4px 10px !important}
/* 大字模式按钮 */
.bigfont-toggle{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s}
.bigfont-toggle.on{background:var(--orange-bg);border-color:var(--orange);color:var(--orange)}
/* 股票列表滚动容器 */
.mkt-list-wrap{max-height:calc(100vh - 340px);overflow-y:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
.mkt-list-wrap::-webkit-scrollbar{width:4px}.mkt-list-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
/* 工具条 */
.mkt-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.mkt-toolbar .mkt-search-wrap{flex:1;min-width:200px}
@media(max-width:768px){.mkt-idx-bar{gap:6px}.mkt-idx-item{min-width:130px;padding:8px 12px}.mkt-heatmap{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.mkt-drawer{width:100%;right:-100%}.mkt-list-wrap{max-height:calc(100vh - 380px)}}
/* Stock Detail Page responsive */
@media(max-width:900px){#sd-main-grid{grid-template-columns:1fr !important}}
</style>

  <input type="text" id="pipe-modal-symbol" placeholder="股票代码，如 000630 或 000001.SZ" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;margin-bottom:16px">

<script>
/* ===== CONFIG ===== */
/** 接口基址。空串=当前页同源。若前端与后端不同端口（如前端8100、后端8000），请设为后端地址如 'http://127.0.0.1:8000'，否则「生成分析」等会失败。见 docs/AI分析-测试与排查.md */
const API='';
const RELEASE_REAL_TRADING=false; // 首版不开放真实交易，改为 true 可开放
let TK=localStorage.getItem('tk')||'';
let U=JSON.parse(localStorage.getItem('u')||'null');
let ENV=localStorage.getItem('env')||'sim';
if(!RELEASE_REAL_TRADING&&ENV==='real'){ENV='sim';localStorage.setItem('env','sim');}
let ROLE='beginner'; // beginner|advanced|expert
let CUR='dashboard';

/* ===== PERMISSIONS ===== */
const PAGES={
  dashboard:{icon:'fa-tachometer-alt',label:'首页总览',roles:['beginner','advanced','expert']},
  pipeline:{icon:'fa-project-diagram',label:'交易向导',roles:['beginner','advanced','expert'],hidden:true},
  market:{icon:'fa-chart-bar',label:'行情数据',roles:['beginner','advanced','expert']},
  strategy:{icon:'fa-chess-knight',label:'策略工作台',roles:['beginner','advanced','expert']},
  trade:{icon:'fa-exchange-alt',label:'交易执行',roles:['beginner','advanced','expert']},
  position:{icon:'fa-wallet',label:'持仓管理',roles:['beginner','advanced','expert']},
  replay:{icon:'fa-history',label:'复盘分析',roles:['advanced','expert'],hidden:true},
  factor:{icon:'fa-cube',label:'因子管理',roles:['advanced','expert'],hidden:true},
  alert:{icon:'fa-bell',label:'预警中心',roles:['beginner','advanced','expert']},
  community:{icon:'fa-users',label:'社区交流',roles:['beginner','advanced','expert'],hidden:true},
  messages:{icon:'fa-envelope',label:'私信中心',roles:['beginner','advanced','expert'],hidden:true},
  guide:{icon:'fa-graduation-cap',label:'新手指南',roles:['beginner','advanced','expert'],hidden:true},
  pricing:{icon:'fa-crown',label:'套餐与费用',roles:['beginner','advanced','expert'],hidden:true},
  account:{icon:'fa-user-cog',label:'账户设置',roles:['beginner','advanced','expert']},
  stock_detail:{icon:'fa-chart-line',label:'个股详情',roles:['beginner','advanced','expert'],hidden:true},
  sector_detail:{icon:'fa-layer-group',label:'板块详情',roles:['beginner','advanced','expert'],hidden:true},
};
const ROLE_LABELS={beginner:'新手散户',advanced:'进阶散户',expert:'资深散户'};
const ROLE_COLORS={beginner:'role-beginner',advanced:'role-advanced',expert:'role-expert'};
const ROLE_THEME={beginner:'var(--green)',advanced:'var(--primary)',expert:'var(--orange)'};

/* ===== 个股详情状态 ===== */
let _sdSymbol='',_sdName='',_sdChartType='kline',_sdKlinePeriod='daily',_sdBottomTab='ai_analysis';
let _sdOverlayMode='ma'; /* 主图叠加: ma / ema / boll */
let _sdSubChartMode='vol'; /* 副图模式: vol / kdj / macd / rsi */
let _sdZoom={startIdx:0,endIdx:-1}; /* 图表缩放视口 */
let _sdNewsData=null; /* 资讯缓存 */
let _sdMarginData=null,_sdBlockTradeData=null,_sdCapitalFlowData=null,_sdPeerComparisonData=null,_sdIrmData=null; /* Phase2 懒加载 */
let _sdIrmExpanded=new Set(); /* 互动 Tab 展开全文的条目索引 */
let _sdF10SubTab='financial'; /* F10 子 Tab: financial|top_holders|dividends|holder_count */
let _sdRefreshTimer=null; /* 股票详情自动刷新 */
let _sdQuoteRefresh=false; /* 点击刷新重试时置 true，拉取报价时带 refresh=1 跳过缓存 */
let _dashRefreshTimer=null; /* 仪表盘自动刷新 */

/* ===== AI 分析 Tab 状态（对话与干预） ===== */
let _sdAiHasResult=false,_sdAiConfirmed=false,_sdAiUserNote='';
let _sdAiResult=null; /* mock 或后续 API 返回：{ dimensions, main, zones, suggest } */
let _sdAiResultCollapsed=false; /* 左侧结果区是否折叠 */
let _sdAiReportId=null; /* 当前展示的报告 ID，采纳时提交 */
let _sdAiReportsState={page:1,page_size:10};
function pipeConfirmSymbol(){
  var el=document.getElementById('pipe-modal-symbol');
  var v=((el&&el.value)||'').trim();
  if(!v){toast('请填写股票代码','warn');return;}
  _pipeSymbols=v;
  _pipeSetParams({symbols:v,strategy_id:_pipeStrategyId||'',backtest_id:_pipeBacktestId||''});
  closeModal('pipe-symbol-modal');
  goStockDetail(v,'');
}
async function _sdAiRunAnalysis(){
  if(!_sdSymbol){toast('请先选择或输入股票代码','warn');return;}
  const el=document.getElementById('sd-bottom-content');
  var genBtn=document.getElementById('sd-ai-generate-btn');
  var e2eBtn=document.getElementById('sd-ai-e2e-test-btn');
  if(genBtn){genBtn.disabled=true;genBtn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 生成中…';}
  if(e2eBtn){e2eBtn.disabled=true;}
  const res=await api('/ai-analysis/generate',{method:'POST',body:JSON.stringify({symbol:_sdSymbol,user_notes:_sdAiUserNote||null})});
  if(res&&res.code===0&&res.data){
    _sdAiHasResult=true;
    _sdAiResult=res.data;
    var saveRes=await api('/ai-analysis/reports',{method:'POST',body:JSON.stringify({symbol:_sdSymbol,user_notes:_sdAiUserNote||null,report_snapshot:res.data,status:'draft'})});
    if(saveRes&&saveRes.code===0&&saveRes.data&&saveRes.data.id){_sdAiReportId=saveRes.data.id;sdAiLoadReports();}
    toast('分析已生成','success');
  }else{
    _sdAiHasResult=false;
    _sdAiResult=null;
    toast((res&&res.message)||'生成分析失败，请检查登录与网络后重试','warn');
  }
  if(el)el.innerHTML=_sdRenderAiAnalysisTab();
}
async function _sdAiConfirm(){
  var n=document.getElementById('sd-ai-note');if(n)_sdAiUserNote=n.value;
  var r=_sdAiResult;if(!r){toast('请先生成分析','warn');return;}
  var body={symbol:_sdSymbol||'',user_notes:_sdAiUserNote||null,main_summary:(r.main&&r.main.summary)||null,suggest_text:(r.suggest&&r.suggest.text)||null,report_id:_sdAiReportId||null};
  var res=await api('/ai-analysis/confirm',{method:'POST',body:JSON.stringify(body)});
  if(res&&res.code===0){_sdAiConfirmed=true;sdAiLoadReports();var e=document.getElementById('sd-bottom-content');if(e)e.innerHTML=_sdRenderAiAnalysisTab();toast('已采纳并记录');}
  else{toast(apiErrMsg(res)||(res&&res.message)||'确认失败','warn');}
}
async function _sdAiGotoStrategy(){
  var btn=document.getElementById('sd-ai-goto-strategy-btn');if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 跳转中...';}
  _pipeStep='discover';
  window._stSkipWiz=false;
  var syms=_pipeSymbols||_sdSymbol||'';
  if(_sdAiReportId){
    _pipeSetParams({symbols:syms,report_id:_sdAiReportId,strategy_id:'',backtest_id:_pipeBacktestId||'',step:'discover',wiz_mode:'template'});
    toast('已为您打开策略模板，可继续选择模板','info');
  }else
    _pipeSetParams({symbols:syms,report_id:'',strategy_id:'',backtest_id:_pipeBacktestId||'',step:'discover',wiz_mode:'template'});
  navigate('strategy');
}
/** E2E 自动化测试：依次执行「生成分析」与「采纳」，结果写入 window.__e2eLastResult */
async function _sdAiE2ETest(){
  window.__e2eLastResult=null;
  if(!_sdSymbol){toast('请先选择标的','warn');window.__e2eLastResult={ok:false,step:'symbol',message:'no symbol'};return;}
  var el=document.getElementById('sd-bottom-content');
  if(el)el.innerHTML='<div style="text-align:center;padding:24px;color:var(--text3)"><i class="fas fa-spinner fa-spin"></i> E2E 测试中…</div>';
  var genRes=await api('/ai-analysis/generate',{method:'POST',body:JSON.stringify({symbol:_sdSymbol,user_notes:_sdAiUserNote||null})});
  var generateOk=!!(genRes&&genRes.code===0&&genRes.data);
  if(generateOk){_sdAiHasResult=true;_sdAiResult=genRes.data;}
  else{_sdAiHasResult=false;_sdAiResult=null;}
  if(el)el.innerHTML=_sdRenderAiAnalysisTab();
  var confirmOk=false;
  if(generateOk&&_sdAiResult){
    var r=_sdAiResult;
    var body={symbol:_sdSymbol||'',user_notes:_sdAiUserNote||null,main_summary:(r.main&&r.main.summary)||null,suggest_text:(r.suggest&&r.suggest.text)||null};
    var confRes=await api('/ai-analysis/confirm',{method:'POST',body:JSON.stringify(body)});
    confirmOk=!!(confRes&&confRes.code===0);
    if(confirmOk){_sdAiConfirmed=true;if(el)el.innerHTML=_sdRenderAiAnalysisTab();}
  }
  window.__e2eLastResult={ok:generateOk&&confirmOk,generate:generateOk,confirm:confirmOk,symbol:_sdSymbol};
  toast(window.__e2eLastResult.ok?'E2E 测试通过':'E2E 测试失败: '+(generateOk?'采纳失败':'生成失败'),window.__e2eLastResult.ok?'success':'warn');
}
function _sdAiReportsFmtTime(s){if(!s)return '-';var t=String(s).replace('T',' ').trim();return t.length>19?t.slice(0,19):t;}
async function sdAiLoadReports(){
  var tbody=document.getElementById('sd-ai-reports-tbody');var pagEl=document.getElementById('sd-ai-reports-pagination');
  if(!tbody||!_sdSymbol)return;
  var st=_sdAiReportsState;tbody.innerHTML='<tr><td colspan="4" style="padding:16px;text-align:center;color:var(--text3)">加载中...</td></tr>';
  var res=await api('/ai-analysis/reports?symbol='+encodeURIComponent(_sdSymbol)+'&page='+st.page+'&page_size='+st.page_size+'&sort_by=created_at&order=desc');
  if(!res||res.code!==0||!Array.isArray(res.data?.items)){tbody.innerHTML='<tr><td colspan="4" style="padding:16px;text-align:center;color:var(--text3)">暂无报告</td></tr>';if(pagEl)pagEl.innerHTML='';return;}
  var items=res.data.items,total=res.data.total||0,page=res.data.page||1,pageSize=res.data.page_size||10;
  if(items.length===0){tbody.innerHTML='<tr><td colspan="4" style="padding:16px;text-align:center;color:var(--text3)">暂无报告</td></tr>';}else{
    var esc=function(v){return (v||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');};
    tbody.innerHTML=items.map(function(v){
      var sum=(v.main_summary||'').substring(0,80);if((v.main_summary||'').length>80)sum+='…';
      var stLabel=v.status==='adopted'?'<span style="color:var(--green)">已采纳</span>':'<span style="color:var(--text3)">草稿</span>';

async function api(p,o={}){
  const h={'Content-Type':'application/json',...(o.headers||{})};
  if(TK)h['Authorization']='Bearer '+TK;
  try{const r=await fetch(API+p,{...o,headers:h});const d=await r.json();if(!r.ok&&r.status===401){doLogout();return null;}return d;}
  catch(e){console.error('API:',e);return null;}
}

/* 数据落后 30 分钟则触发预热（仅 indices/hot/sectors/ranking/minute_top20，不包含龙虎榜/北向） */
const _STALE_THRESHOLD_MS=30*60*1000;
let _lastWarmupTriggerTs=0;
const _WARMUP_COOLDOWN_MS=5*60*1000;
function maybeTriggerWarmupIfStale(res){
  if(!res||res.code!==0)return;
  const at=res.data_updated_at;
  if(!at||typeof at!=='string')return;
  const t=Date.parse(at);
  if(isNaN(t))return;
  if(Date.now()-t<=_STALE_THRESHOLD_MS)return;
  if(Date.now()-_lastWarmupTriggerTs<_WARMUP_COOLDOWN_MS)return;
  _lastWarmupTriggerTs=Date.now();
  api('/ops/market-warmup',{method:'POST',body:JSON.stringify({items:['indices','hot','sectors','ranking','minute_top20']})}).then(()=>{}).catch(()=>{});
}

  const q=RA_QUESTIONS[_raStep];
  let h=`<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

function fmtNum(n){
  if(n===undefined||n===null||isNaN(n))return '0.00';
  n=Number(n);
  if(Math.abs(n)>=10000)return (n/10000).toFixed(2)+'万';
  return n.toFixed(2);
}

}

function renderWizard(c){
  const stepLabels=['选择方式','配置策略','设置风控','选择标的','完成创建'];
  let h=`<div class="st-wizard">`;
  /* 步骤条 */
  h+=`<div class="st-wiz-steps">`;
  stepLabels.forEach((l,i)=>{
    const cls=i<_wizStep?'done':i===_wizStep?'active':'';
    h+=`<div class="st-wiz-step ${cls}"><span class="step-num">${i<_wizStep?'<i class=\"fas fa-check\"></i>':(i+1)}</span>${l}</div>`;
    if(i<stepLabels.length-1)h+=`<i class="fas fa-chevron-right" style="color:var(--text3);font-size:10px;margin:0 2px"></i>`;
  });
  h+=`</div>`;
  h+=`<div class="st-wiz-body" id="wiz-body"></div>`;
  h+=`</div>`;
  /* 跳过：说明 + 明确入口 */
  h+=`<div style="text-align:center;margin-top:16px;font-size:13px;color:var(--text2)">
    <p style="margin-bottom:8px">不想现在创建？可先进入策略列表，之后随时在左侧「创建新策略」中添加。</p>
    <button type="button" class="btn btn-sm btn-outline" onclick="window._stSkipWiz=true;rStrategy(document.getElementById('main-content'))"><i class="fas fa-list"></i> 进入策略管理</button>
  </div>`;
  c.innerHTML=h;
  renderWizStep();
}

function renderWizStep(){
  const b=document.getElementById('wiz-body');if(!b)return;
  if(_wizStep===0) wizStep0(b);
  else if(_wizStep===1) wizStep1(b);
  else if(_wizStep===2) wizStep2(b);
  else if(_wizStep===3) wizStep3Targets(b);
  else if(_wizStep===4) wizStep4(b);
}

async function _stPrefillWizardFromReport(){
  if(!_pipeReportId)return;
  var res=await api('/ai-analysis/reports/'+encodeURIComponent(_pipeReportId));
  if(!res||res.code!==0||!res.data||!res.data.report_snapshot)return;
  var sn=res.data.report_snapshot;
  var main=sn.main;
  var suggest=sn.suggest;
  var summary=(main&&main.summary)||'';
  var text=(suggest&&suggest.text)||'';
  _wizStep=1;_wizMode='ai';_wizData={prompt:(summary+' '+text).trim()||'根据分析报告生成策略'};
  renderWizStep();
}

function wizToggleTargetItem(item){

async function wizAiParse(){
  const inp=document.getElementById('wiz-ai-input');if(!inp)return;
  const p=inp.value.trim();if(!p){toast('请输入策略描述','error');return;}
  _wizData.prompt=p;
  const res=document.getElementById('wiz-ai-result');
  res.innerHTML='<div style="padding:12px;text-align:center"><i class="fas fa-spinner fa-spin" style="color:var(--primary)"></i> AI 正在解析...</div>';
  const d=await api('/ai/strategy/parse',{method:'POST',body:JSON.stringify({prompt:p})});
  if(d&&d.code===0&&d.data){

/* 绘制迷你 sparkline: 无回测数据时显示灰色水平线 */
function _drawSparkline(canvas,sid){
  const ctx=canvas.getContext('2d');
  const W=canvas.width;const H=canvas.height;
  ctx.clearRect(0,0,W,H);
  /* 无真实回测数据，绘制灰色水平虚线表示暂无数据 */
  ctx.strokeStyle='rgba(150,150,150,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,3]);
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
}

/* ========== 模板库 Tab ========== */
function _stEsc(v){return (v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function _stEscJs(v){return String(v||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r/g,'\\r').replace(/\n/g,'\\n');}
function _stEscJsAttr(v){return _stEsc(_stEscJs(v));}
function _stFormatTemplateText(v){
  const text=String(v||'').trim();
  if(!text)return '';
  const normalized=text
    .replace(/\r\n?/g,'\n')
    .replace(/([。！？；])(?=\S)/g,'$1\n')
    .replace(/\s*([一二三四五六七八九十]+、)/g,'\n$1')
    .replace(/\s*(\d+\.)/g,'\n$1')
    .replace(/\n{2,}/g,'\n');
  return normalized
    .split(/\n+/)
    .map(function(part){return part.trim();})
    .filter(Boolean)
    .map(function(part){return '<p>'+_stEsc(part)+'</p>';})
    .join('');
}

  const logicCode=_stEsc(t.logic_code||'');

  const consArr=Array.isArray(t.cons)?t.cons:(t.cons?[t.cons]:[]);
  const prosHtml=prosArr.map(function(p){return '<li>'+_stEsc(p)+'</li>';}).join('');
  const consHtml=consArr.map(function(c){return '<li>'+_stEsc(c)+'</li>';}).join('');

      '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">'+(t.tags||[]).map(function(tag){return '<span class="badge badge-blue">'+_stEsc(tag)+'</span>';}).join('')+'</div>'+

function stSelectCard(sid){
  /* 取消旧选中 */
  if(_stExpanded!==null){const oc=document.getElementById('st-card-'+_stExpanded);if(oc)oc.classList.remove('selected');}
  if(_stExpanded===sid){_stExpanded=null;const dr=document.getElementById('st-drawer');if(dr)dr.innerHTML=`<div style="text-align:center;padding:60px 20px"><i class="fas fa-hand-pointer" style="font-size:48px;color:var(--text3);opacity:.15;display:block;margin-bottom:16px"></i><p style="color:var(--text3);font-size:14px">点击左侧策略卡片<br>查看详情与编辑</p></div>`;return;}
  _stExpanded=sid;_stTab='overview';
  document.getElementById('st-card-'+sid)?.classList.add('selected');
  /* 加载策略已选指标 */
  const s=_stList.find(x=>String(x.id)===String(sid))||{};

  _selInds=p.indicators||[];

}

  const status=s.status||'draft';
  const runEnvDrawer=(typeof s.params_json==='string'?JSON.parse(s.params_json||'{}'):(s.params_json||{})).run_env;
  const baseDrawerLabel={draft:'草稿',backtested:'已回测',published:'已发布',running:'运行中',active:'运行中'}[status]||status;
  const stLabel=(status==='running'||status==='active')?(runEnvDrawer==='live'?'实盘运行中':'模拟运行中'):baseDrawerLabel;

  let h=`<div class="st-drawer-head">
    <div class="dh-name"><i class="fas fa-chess-knight" style="color:var(--primary)"></i> ${_stEsc(displayName)}${fromAnalysisTag}</div>
    <span class="st-status ${status}" style="margin-left:8px">${stLabel}</span>

    </div></div>`;
  /* 新四 Tab: 概览 | 回测 | 交易 | 日志 */
  h+=`<div class="st-ws-tabs">
    <div class="ws-tab ${_stTab==='overview'?'active':''}" onclick="renderDrawer(document.getElementById('st-drawer'),'${sid}','overview')"><i class="fas fa-th-large"></i> 概览</div>

    <div class="ws-tab ${_stTab==='log'?'active':''}" onclick="renderDrawer(document.getElementById('st-drawer'),'${sid}','log')"><i class="fas fa-list-alt"></i> 日志</div>
  </div>`;
  h+=`<div class="st-ws-body">`;
  if(_stTab==='overview') h+=wsOverview(s);
  else if(_stTab==='backtest') h+=wsBacktestV2(s);
  else if(_stTab==='trade') h+=wsTrade(s);
  else if(_stTab==='log') h+=wsLog(s);
  /* 兼容旧 tab 名 */
  else if(_stTab==='config') { _stTab='overview'; h+=wsOverview(s); }
  h+=`</div>`;
  panel.innerHTML=h;
  if(_stTab==='overview'&&sid!=='new') setTimeout(function(){ stLoadStrategyVersions(sid); },0);
}

/* ===== 策略生命周期状态条 ===== */
function _renderLifecycle(s){
  const status=s.status||'draft';
  const steps=[
    {id:'draft',label:'草稿',icon:'fa-pen'},
    {id:'backtested',label:'已回测',icon:'fa-flask'},
    {id:'simulating',label:'模拟运行',icon:'fa-play-circle'},
    {id:'running',label:'实盘运行',icon:'fa-rocket'}
  ];
  const stMap={draft:0,backtested:1,published:1,simulating:2,running:3,active:3};
  const cur=stMap[status]??0;
  let h='<div class="stv2-lifecycle">';
  steps.forEach((st,i)=>{
    const done=i<cur;const active=i===cur;
    h+=`<div class="lc-step ${done?'done':''}${active?' active':''}">
      <div class="lc-dot">${done?'<i class="fas fa-check" style="font-size:10px"></i>':(i+1)}</div>
      <span>${st.label}</span>
    </div>`;
    if(i<steps.length-1){
      h+=`<div class="lc-line ${done?'done':''}${active&&i===cur-0?' active':''}"></div>`;
    }
  });
  h+='</div>';
  return h;
}

          <tbody id="ws-version-tbody-${s.id}"><tr><td colspan="6" style="padding:16px;text-align:center;color:var(--text3)">加载中...</td></tr></tbody>
        </table>
      </div>
      <div id="ws-version-pagination-${s.id}" style="margin-top:12px;padding:12px 0;display:flex;flex-wrap:nowrap;align-items:center;gap:28px;font-size:12px;color:var(--text2);min-width:0;overflow-x:auto"></div>
    </div>`;
  }
  /* ===== 标的选择器（个股/板块/行业/概念/ETF） ===== */
  const targets=params.targets||{type:'stock',items:[]};
  h+=`<div class="form-group"><label style="font-weight:600"><i class="fas fa-bullseye" style="font-size:11px;color:var(--primary);margin-right:4px"></i>选择标的 <span style="font-size:11px;color:var(--text3);font-weight:400">你想交易什么？</span></label>`;
  h+=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap" id="ws-target-tabs-${s.id}">`;
  BT_TARGET_TYPES.forEach(t=>{
    const sel=targets.type===t.id;
    h+=`<div class="rec-btn${sel?' sel':''}" style="cursor:pointer;${sel?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" onclick="wsSetTargetType('${t.id}','${s.id}')" title="${t.desc}"><i class="fas ${t.icon}" style="font-size:11px"></i> ${t.name}</div>`;
  });
  h+=`</div>`;
  const tType=BT_TARGET_TYPES.find(x=>x.id===targets.type)||BT_TARGET_TYPES[0];
  if(tType.id==='stock'){
    h+=`<input id="ws-target-input-${s.id}" placeholder="${tType.placeholder}" value="${(targets.items||[]).join(', ')}" style="width:100%">
    <div style="font-size:11px;color:var(--text3);margin-top:4px"><i class="fas fa-info-circle"></i> 多只股票用逗号分隔，${ROLE==='beginner'?'新手最多5只':'最多10只'}</div>`;
  } else {
    h+=`<div style="display:flex;flex-wrap:wrap;gap:6px" id="ws-target-items-${s.id}">`;
    (tType.items||[]).forEach(item=>{
      const sel=(targets.items||[]).includes(item);
      h+=`<span class="ind-chip${sel?' sel':''}" onclick="wsToggleTarget(this,'${item}','${s.id}')">${item}</span>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;
  /* ===== 指标分类折叠面板（默认折叠，点击展开） ===== */
  h+=`<div class="form-group ind-privacy-wrap"><div class="ind-privacy-head" onclick="indTogglePrivacy(this)" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card2);font-weight:600;font-size:13px"><i class="fas fa-th-list" style="font-size:11px;color:var(--primary)"></i> 选择指标（点击展开） <span style="font-size:11px;color:var(--text3);font-weight:400;margin-left:auto">已选 <b id="ind-total">${_selInds.length}</b> 个</span> <i class="fas fa-chevron-right ind-privacy-arrow" style="transition:transform .2s;font-size:10px;color:var(--text3)"></i></div>`;
  h+=`<div class="ind-privacy-body" style="display:none;margin-top:10px"><label style="font-weight:600;display:block;margin-bottom:6px"><i class="fas fa-th-list" style="font-size:11px;color:var(--primary);margin-right:4px"></i>选择指标</label>`;
  /* 智能推荐（带 hover 解释） */
  h+=`<div class="ind-recommend" style="position:relative"><span style="font-size:11px;color:var(--text3);margin-right:4px" title="根据常见策略类型预设好的指标组合，点击即可快速选好一组指标">🎯 一键推荐 <i class="fas fa-question-circle" style="font-size:10px"></i>：</span>`;
  ST_IND_PRESETS.forEach(p=>{h+=`<div class="rec-btn" onclick="indApplyPreset(${JSON.stringify(p.inds).replace(/"/g,'&quot;')},${s.id})" title="${p.desc}">${p.name}</div>`;});
  h+=`</div>`;
  /* 分类手风琴 */
  h+=`<div class="ind-accordion" id="ind-acc">`;
  ST_IND_CATS.forEach(cat=>{
    const catRoleLevel={beginner:0,advanced:1,expert:2}[cat.minRole]||0;
    const locked=catRoleLevel>roleLevel;
    const allItems=[...(cat.items.beginner||[]),...(roleLevel>=1?(cat.items.advanced||[]):[]),...(roleLevel>=2?(cat.items.expert||[]):[])];
    const selCnt=allItems.filter(x=>_selInds.includes(x)).length;
    if(locked){
      h+=`<div class="ind-section"><div class="ind-section-head"><i class="fas ${cat.icon}" style="font-size:12px;color:var(--text3)"></i> ${cat.name} <span class="ind-lock"><i class="fas fa-lock"></i> ${cat.minRole==='advanced'?'进阶':'资深'}可用</span></div></div>`;
    } else {
      h+=`<div class="ind-section${selCnt>0?' open':''}"><div class="ind-section-head" onclick="indToggle(this)"><i class="fas fa-chevron-right ind-arrow"></i><i class="fas ${cat.icon}" style="font-size:12px"></i> ${cat.name} <span class="ind-cnt${selCnt===0?' zero':''}">${selCnt}</span>
        <span style="font-size:10px;color:var(--text3);margin-left:auto;font-weight:400" title="${cat.source}">${cat.desc}</span>
      </div>`;
      h+=`<div class="ind-section-body">`;
      allItems.forEach(ind=>{
        const sel=_selInds.includes(ind);
        const tip=IND_TIPS[ind]||ind;
        h+=`<span class="ind-chip${sel?' sel':''}" onclick="indToggleChip(this,'${ind}','${s.id}')" title="${tip}">${ind}</span>`;
      });
      h+=`<div style="font-size:10px;color:var(--text3);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)"><i class="fas fa-database"></i> ${cat.source}</div>`;
      h+=`</div></div>`;
    }
  });
  h+=`</div></div></div>`; /* close ind-accordion, ind-privacy-body, form-group */
  /* ===== 止盈止损（增强版） ===== */
  h+=`<div class="form-group"><label style="font-weight:600"><i class="fas fa-shield-halved" style="font-size:11px;color:var(--primary);margin-right:4px"></i>止盈止损
    <span style="font-size:11px;color:var(--text3);font-weight:400" title="止盈=涨到目标自动卖出锁定利润；止损=跌到底线自动卖出防止更大损失"><i class="fas fa-question-circle" style="font-size:10px"></i> 什么意思？</span></label>`;
  /* 预设模板 */
  const tpSlPresets=[{label:'🛡️ 保守',tp:8,sl:5,desc:'小赚即走'},{label:'⚖️ 稳健',tp:12,sl:8,desc:'推荐'},{label:'🚀 激进',tp:20,sl:12,desc:'追求高收益'}];
  h+=`<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">`;
  tpSlPresets.forEach(p=>{
    const sel=tp===p.tp&&slv===p.sl;
    h+=`<div class="rec-btn${sel?' sel':''}" style="cursor:pointer;font-size:12px;${sel?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" onclick="wsSetTpSl(${p.tp},${p.sl},'${s.id}')" title="止盈+${p.tp}% 止损-${p.sl}%">${p.label} <span style="font-size:10px;opacity:.8">(${p.desc})</span></div>`;
  });
  h+=`</div>`;
  const _sid=String(s.id||s.strategy_id||'');
  h+=`<div style="display:flex;gap:16px;margin-bottom:10px">
    <div style="flex:1"><span style="font-size:12px;color:var(--red);font-weight:500"><i class="fas fa-arrow-trend-up"></i> 止盈（涨到几%卖出）</span>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px"><input type="range" min="3" max="30" value="${tp}" id="ws-tp-${s.id}" oninput="wsUpdateTpSlLabel('${_sid}')" style="flex:1;accent-color:var(--red)"><input type="number" id="ws-tp-v-${s.id}" min="3" max="30" value="${tp}" oninput="wsSyncTpFromInput('${_sid}')" style="font-family:var(--font-num);font-weight:700;color:var(--red);min-width:42px;width:42px;text-align:right;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--card);font-size:inherit"></div></div>
    <div style="flex:1"><span style="font-size:12px;color:var(--green);font-weight:500"><i class="fas fa-arrow-trend-down"></i> 止损（跌到几%卖出）</span>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px"><input type="range" min="2" max="20" value="${slv}" id="ws-sl-${s.id}" oninput="wsUpdateTpSlLabel('${_sid}')" style="flex:1;accent-color:var(--green)"><input type="number" id="ws-sl-v-${s.id}" min="2" max="20" value="${slv}" oninput="wsSyncSlFromInput('${_sid}')" style="font-family:var(--font-num);font-weight:700;color:var(--green);min-width:42px;width:42px;text-align:right;padding:2px 4px;border:1px solid var(--border);border-radius:4px;background:var(--card);font-size:inherit"></div></div>
  </div>`;
  /* 图示说明 */
  h+=`<div id="ws-tpsl-explain-${s.id}" style="background:var(--card2);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;color:var(--text2)">
    <i class="fas fa-info-circle" style="color:var(--primary)"></i> <b>举例说明：</b>假设你用 <b>1万元</b> 买入一只股票 →<br>
    <span style="color:var(--red)">✅ 涨到 +${tp}% 时自动卖出 → 赚 ¥${(100*tp).toLocaleString()}</span><br>
    <span style="color:var(--green)">🛑 跌到 -${slv}% 时自动卖出 → 亏 ¥${(100*slv).toLocaleString()}</span><br>
    <span style="font-size:11px;color:var(--text3)">盈亏比 ${(tp/slv).toFixed(1)}:1 ${tp/slv>=1.5?'✅ 合理':'⚠️ 建议盈亏比≥1.5'}</span>
  </div></div>`;
  /* 操作按钮 */
  h+=`<div style="display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
    <button class="btn btn-primary" onclick="wsSaveStrategy('${s.id}')"><i class="fas fa-save"></i> 保存策略</button>
    <button class="btn btn-outline" onclick="stRunBacktestInline('${s.id}')"><i class="fas fa-flask"></i> 回测验证</button>
  </div>`;
  return h;
}
/* 指标面板交互 */
function indToggle(el){el.parentElement.classList.toggle('open');}
function indTogglePrivacy(el){
  const wrap=el.closest('.ind-privacy-wrap');if(!wrap)return;
  const body=wrap.querySelector('.ind-privacy-body');const arrow=el.querySelector('.ind-privacy-arrow');
  if(body.style.display==='none'){body.style.display='block';if(arrow)arrow.style.transform='rotate(90deg)';}
  else{body.style.display='none';if(arrow)arrow.style.transform='';}
}
function indToggleChip(el,name,sid){
  const idx=_selInds.indexOf(name);
  if(idx>=0){_selInds.splice(idx,1);el.classList.remove('sel');}
  else{_selInds.push(name);el.classList.add('sel');}
  /* 更新计数 */
  const sec=el.closest('.ind-section');if(sec){const cnt=sec.querySelector('.ind-cnt');if(cnt){const n=sec.querySelectorAll('.ind-chip.sel').length;cnt.textContent=n;cnt.classList.toggle('zero',n===0);}}
  const tot=document.getElementById('ind-total');if(tot)tot.textContent=_selInds.length;
}
function indApplyPreset(inds,sid){
  _selInds=[...inds];
  const dr=document.getElementById('st-drawer');if(dr)renderDrawer(dr,_stExpanded,'overview');
  toast('已应用推荐指标组合','success');
}

/* ===== 回测 Tab V2 (快捷参数条 + 内嵌结果 + 高级折叠 + 历史) ===== */
function wsBacktestV2(s){
  const sid=s.id||s.strategy_id;
  if(sid==='new'){
    return `<div style="text-align:center;padding:40px 20px;font-size:14px;color:var(--text2)">
      <i class="fas fa-save" style="font-size:36px;opacity:.3;display:block;margin-bottom:12px"></i>
      <p>请先保存策略后再进行回测</p>
      <button class="btn btn-sm btn-outline" style="margin-top:12px" onclick="renderDrawer(document.getElementById('st-drawer'),'new','overview')"><i class="fas fa-th-large"></i> 去概览保存</button>
    </div>`;
  }
  const hasBt=!!s.last_backtest_id||s.status==='backtested'||s.status==='published'||s.status==='running';
  const params=typeof s.params_json==='string'?JSON.parse(s.params_json||'{}'):(s.params_json||{});
  const targets=params.targets||{type:'stock',items:[]};
  const today=new Date();
  const defEnd=today.toISOString().split('T')[0];
  const def3m=new Date(today.getFullYear(),today.getMonth()-3,today.getDate()).toISOString().split('T')[0];
  let h='';

  /* ── 策略已自动选中提示 ── */
  h+=`<div style="font-size:12px;color:var(--text2);margin-bottom:10px;display:flex;align-items:center;gap:6px">
    <i class="fas fa-chess-knight" style="color:var(--primary)"></i>
    <span>策略已自动选中：<b>${s.name||'当前策略'}</b></span>
  </div>`;

  /* ── 快捷参数条 ── */
  h+=`<div class="stv2-bt-quick">`;
  /* 时间 */
  h+=`<div class="bq-row">
    <span class="bq-label"><i class="fas fa-calendar"></i> 时间</span>
    <div class="bq-chips" id="ws-bt-period-chips-${sid}">`;
  const periods=[{n:'1月',m:1},{n:'3月',m:3},{n:'半年',m:6},{n:'1年',m:12}];
  if(ROLE!=='beginner')periods.push({n:'3年',m:36});
  periods.forEach((p,i)=>{h+=`<span class="bq-chip${i===1?' sel':''}" onclick="wsBtQuickPeriod('${sid}',${p.m},this)">${p.n}</span>`;});
  h+=`</div>
    <input type="date" id="ws-bt-start-${sid}" value="${def3m}" style="font-size:11px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);width:110px">
    <span style="font-size:11px;color:var(--text3)">至</span>
    <input type="date" id="ws-bt-end-${sid}" value="${defEnd}" style="font-size:11px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;background:var(--card);color:var(--text);width:110px">
  </div>`;
  /* 资金 */
  h+=`<div class="bq-row">
    <span class="bq-label"><i class="fas fa-coins"></i> 资金</span>
    <div class="bq-chips">`;
  [{n:'5万',v:50000},{n:'10万',v:100000},{n:'20万',v:200000},{n:'50万',v:500000}].forEach((p,i)=>{
    h+=`<span class="bq-chip${i===1?' sel':''}" onclick="wsBtQuickCapital('${sid}',${p.v},this)">${p.n}</span>`;
  });
  h+=`</div><input type="hidden" id="ws-bt-capital-${sid}" value="100000">
  </div>`;
  /* 标的 */
  h+=`<div class="bq-row">
    <span class="bq-label"><i class="fas fa-bullseye"></i> 标的</span>
    <div style="flex:1;font-size:12px;color:var(--text2)">`;
  if(targets.items&&targets.items.length>0){
    targets.items.forEach(t=>{h+=`<span class="badge badge-blue" style="font-size:10px;margin-right:4px">${t}</span>`;});
    h+=`<span style="font-size:10px;color:var(--text3);cursor:pointer" onclick="renderDrawer(document.getElementById('st-drawer'),'${sid}','overview')" title="在概览中编辑标的">[编辑]</span>`;
  } else {
    h+=`<span style="color:var(--text3)">沪深300成分股(默认)</span>`;
  }
  h+=`</div></div>`;
  /* 运行按钮 */
  h+=`<div style="margin-top:4px;display:flex;align-items:center;gap:8px">
    <button class="btn btn-primary" onclick="wsRunBtInline('${sid}')" id="ws-bt-btn-${sid}" style="gap:6px"><i class="fas fa-play"></i> 开始回测</button>
    <span style="font-size:11px;color:var(--text3)">佣金万2.5 · 印花税千1 · 默认散户费率</span>
  </div>`;
  /* 高级参数折叠 */
  h+=`<details style="margin-top:10px"><summary style="font-size:12px;color:var(--primary);cursor:pointer"><i class="fas fa-sliders-h"></i> 高级参数</summary>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
      <div><label style="font-size:11px;color:var(--text3)">佣金率</label><input type="number" id="ws-bt-comm-${sid}" value="0.00025" step="0.00001" style="width:100%;padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px"></div>
      <div><label style="font-size:11px;color:var(--text3)">印花税率</label><input type="number" id="ws-bt-stamp-${sid}" value="0.001" step="0.0001" style="width:100%;padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px"></div>
      <div><label style="font-size:11px;color:var(--text3)">止盈%</label><input type="number" id="ws-bt-tp-${sid}" value="${params.take_profit||10}" min="0" max="50" style="width:100%;padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px"></div>
      <div><label style="font-size:11px;color:var(--text3)">止损%</label><input type="number" id="ws-bt-sl-${sid}" value="${params.stop_loss||8}" min="0" max="30" style="width:100%;padding:4px 8px;font-size:11px;border:1px solid var(--border);border-radius:4px"></div>
    </div>
    <div style="margin-top:8px"><label style="font-size:11px;color:var(--text3)">对标指数</label>
      <div style="display:flex;gap:4px;margin-top:4px">`;
  [{c:'000300.SH',n:'沪深300'},{c:'000016.SH',n:'上证50'},{c:'399006.SZ',n:'创业板指'}].forEach((idx,i)=>{
    h+=`<span class="bq-chip${i===0?' sel':''}" onclick="document.getElementById('ws-bt-bench-${sid}').value='${idx.c}';this.parentElement.querySelectorAll('.bq-chip').forEach(c=>c.classList.remove('sel'));this.classList.add('sel')">${idx.n}</span>`;
  });
  h+=`</div><input type="hidden" id="ws-bt-bench-${sid}" value="000300.SH">
    </div>
  </details>`;
  h+=`</div>`; /* close stv2-bt-quick */

  /* ── 回测结果区域 ── */
  h+=`<div id="ws-bt-result-${sid}">`;
  if(!hasBt){
    h+=`<div style="text-align:center;padding:30px;color:var(--text3)">
      <i class="fas fa-flask" style="font-size:36px;opacity:.2;display:block;margin-bottom:10px"></i>
      <p style="font-size:13px">点击上方"开始回测"<br>用历史数据验证策略效果</p>
      ${ROLE==='beginner'?'<div style="background:var(--primary-bg);border-radius:8px;padding:10px;font-size:12px;color:var(--primary);margin-top:12px;text-align:left"><i class="fas fa-lightbulb"></i> <b>新手提示：</b>回测就是用过去的股市数据来模拟运行你的策略，看看如果之前按这个策略操作能赚多少钱。先回测再实盘，是投资最重要的习惯！</div>':''}
    </div>`;
  } else {
    /* 显示已有回测摘要 */
    const btm=s.last_backtest_metrics||{};
    const pnl=btm.total_return_pct||s.cumulative_return||0;
    const wr=btm.win_rate||s.win_rate||0;
    const dd=btm.max_drawdown_pct||s.max_drawdown||0;
    const grade=s.last_backtest_grade||(pnl>15?'A':pnl>5?'B':pnl>0?'C':'D');
    const gc={A:'var(--green)',B:'var(--primary)',C:'var(--orange)',D:'var(--red)'}[grade]||'var(--text3)';
    h+=`<div class="stv2-bt-result">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
        <div class="br-grade" style="background:${gc}15;color:${gc}">${grade}</div>
        <div><div style="font-size:14px;font-weight:600">最近回测结果</div>
          <div style="font-size:11px;color:var(--text3)">策略: ${s.name||'-'}</div></div>
      </div>
      <div class="br-metrics">
        <div class="br-m"><div class="v" style="color:${pnl>=0?'var(--red)':'var(--green)'}">${pnl>=0?'+':''}${pnl.toFixed(1)}%</div><div class="l">总收益</div></div>
        <div class="br-m"><div class="v">${wr.toFixed(0)}%</div><div class="l">胜率</div></div>
        <div class="br-m"><div class="v" style="color:var(--green)">${dd.toFixed(1)}%</div><div class="l">最大回撤</div></div>
        <div class="br-m"><div class="v">${(btm.sharpe_ratio||0).toFixed(2)}</div><div class="l">Sharpe</div></div>
      </div>`;
    /* 通俗结论 */
    const gLabel=pnl>15&&wr>55?'优秀':pnl>5&&wr>45?'良好':'需优化';
    const glC=gLabel==='优秀'?'var(--green)':gLabel==='良好'?'var(--primary)':'var(--orange)';
    h+=`<div style="background:${gLabel==='优秀'?'var(--green-bg)':gLabel==='良好'?'var(--primary-bg)':'var(--orange-bg)'};border-radius:8px;padding:10px;font-size:12px;line-height:1.6">
      <span style="font-weight:700;color:${glC}">${gLabel==='优秀'?'🏆':'🔍'} 总评: ${gLabel}</span>
      <span style="color:var(--text2)"> — ${pnl>0?`赚了${pnl.toFixed(1)}%, 胜率${wr.toFixed(0)}%`:'目前亏损, 建议优化'}${dd>15?', 回撤偏高':''}。</span>
    </div>`;
    h+=`</div>`; /* close stv2-bt-result */
  }

  /* ── 回测历史 ── */
  h+=`<div class="stv2-bt-history" id="ws-bt-history-${sid}">
    <div style="font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px">

  return h;
}
