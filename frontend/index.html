/* ===== 6. BACKTEST ===== */
/* ========== 回测中心 — 三步渐进式 ========== */
let _btStep=1, _btCfg={}, _btResult=null;

async function rBacktest(c){
  /* 已合并到策略工作台 — 重定向 */
  CUR='strategy';window._stAutoActivateBt=true;buildSidebar();rStrategy(c);
}

function _btRender(c){
  let h=`<div class="content-header"><h1><i class="fas fa-flask" style="color:var(--primary)"></i> 回测中心</h1></div>`;
  /* 步骤条 */
  h+=`<div style="display:flex;align-items:center;gap:0;margin-bottom:24px;padding:16px 20px;background:var(--card);border-radius:12px;border:1.5px solid var(--border)">`;
  const steps=[{n:1,icon:'fa-chess-knight',t:'选择策略 & 标的'},{n:2,icon:'fa-sliders-h',t:'回测参数'},{n:3,icon:'fa-chart-line',t:'结果分析'}];
  steps.forEach((s,i)=>{
    const active=_btStep===s.n, done=_btStep>s.n;
    h+=`<div style="flex:1;display:flex;align-items:center;gap:8px;cursor:${done?'pointer':'default'};opacity:${active||done?1:0.4}" ${done?`onclick="_btStep=${s.n};_btRender(document.getElementById('main-content'))"`:''}>`
    h+=`<div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;${active?'background:var(--primary);color:#fff':done?'background:var(--green);color:#fff':'background:var(--card2);color:var(--text3)'}">`;
    h+=done?'<i class="fas fa-check"></i>':s.n;
    h+=`</div><div><div style="font-size:13px;font-weight:${active?700:400};color:${active?'var(--text)':'var(--text2)'}">${s.t}</div></div>`;
    if(i<steps.length-1)h+=`<div style="flex:1;height:2px;background:${done?'var(--green)':'var(--border)'};margin:0 12px;border-radius:1px"></div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  /* 步骤内容 */
  if(_btStep===1) h+=_btStep1();
  else if(_btStep===2) h+=_btStep2();
  else h+=_btStep3();
  c.innerHTML=h;
  /* 后处理 */
  if(_btStep===3&&_btResult){setTimeout(()=>_btDrawChart(),200);}
}

/* --- Step 1: 选择策略 + 标的 --- */
function _btStep1(){
  const stList=_btCfg.stList||[];
  const maxT={beginner:5,advanced:10,expert:20}[ROLE]||5;
  let h=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-chess-knight"></i> 选择策略</div>`;
  if(stList.length===0){
    h+=`<div style="text-align:center;padding:30px;color:var(--text3)"><i class="fas fa-inbox" style="font-size:32px;display:block;margin-bottom:10px;opacity:.3"></i>暂无策略，请先<a style="color:var(--primary);cursor:pointer" onclick="navigate('strategy')">创建策略</a></div>`;
  } else {
    h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">`;
    stList.forEach(s=>{
      const sel=_btCfg.sid===s.id;
      const st={draft:'草稿',backtested:'已回测',published:'已发布',running:'运行中'}[s.status]||s.status;
      h+=`<div class="st-card${sel?' selected':''}" onclick="_btSelStrategy('${s.id}')" style="cursor:pointer;padding:14px;border-radius:10px;border:2px solid ${sel?'var(--primary)':'var(--border)'};background:${sel?'rgba(99,102,241,0.06)':'var(--card)'};transition:all .2s">`;
      h+=`<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:600;font-size:14px">${s.name||'未命名策略'}</span><span class="st-status ${s.status||'draft'}" style="font-size:11px">${st}</span></div>`;
      const p=typeof s.params_json==='string'?JSON.parse(s.params_json||'{}'):(s.params_json||{});
      const inds=(p.indicators||[]).slice(0,3).join('、');
      h+=`<div style="font-size:12px;color:var(--text3);margin-top:6px">${inds||'暂无指标'}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }
  h+=`</div>`;

  /* 标的选择 */
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-bullseye"></i> 选择标的 <span style="font-size:11px;color:var(--text3);font-weight:400">（${ROLE==='beginner'?'新手':'进阶'}模式最多 ${maxT} 只）</span></div>`;
  const curType=_btCfg.targetType||'stock';
  h+=`<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">`;
  BT_TARGET_TYPES.forEach(t=>{
    const sel=curType===t.id;
    h+=`<div class="rec-btn${sel?' sel':''}" style="cursor:pointer;padding:6px 14px;border-radius:8px;font-size:13px;${sel?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" onclick="_btSetTargetType('${t.id}')"><i class="fas ${t.icon}" style="font-size:11px;margin-right:4px"></i>${t.name}</div>`;
  });
  h+=`</div>`;

  const typeObj=BT_TARGET_TYPES.find(t=>t.id===curType)||BT_TARGET_TYPES[0];
  if(curType==='stock'){
    h+=`<input id="bt-target-input" style="width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px" placeholder="${typeObj.placeholder||'输入股票代码，逗号分隔'}" value="${(_btCfg.targets||[]).map(t=>t.code||t).join(', ')}">`;
    h+=`<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><span style="font-size:11px;color:var(--text3)">热门：</span>`;
    ['600519.SH 贵州茅台','000858.SZ 五粮液','300750.SZ 宁德时代','601318.SH 中国平安','600036.SH 招商银行'].forEach(s=>{
      const[code,name]=s.split(' ');
      h+=`<span style="font-size:11px;padding:2px 8px;border-radius:4px;background:var(--card2);color:var(--primary);cursor:pointer" onclick="_btAddStock('${code}','${name}')">${name}</span>`;
    });
    h+=`</div>`;
  } else {
    const items=typeObj.items||[];
    const selItems=_btCfg.targets||[];
    h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
    items.forEach(it=>{
      const sel=selItems.some(t=>(t.code||t)===it);
      h+=`<span class="ind-chip${sel?' sel':''}" onclick="_btToggleItem('${it}')" style="cursor:pointer">${it}</span>`;
    });
    h+=`</div>`;
  }

  /* 持仓比例 */
  const tgts=_btCfg.targets||[];
  if(tgts.length>1){
    h+=`<div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--border)"><div style="font-size:12px;font-weight:600;margin-bottom:8px"><i class="fas fa-balance-scale" style="color:var(--primary)"></i> 持仓比例配置</div>`;
    h+=`<div style="display:flex;flex-wrap:wrap;gap:8px" id="bt-weights">`;
    tgts.forEach((t,i)=>{
      const name=t.name||t.code||t;
      h+=`<div style="display:flex;align-items:center;gap:4px;font-size:12px"><span>${name}</span><input type="number" min="0" max="100" value="${t.weight||Math.round(100/tgts.length)}" style="width:50px;padding:4px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px" data-idx="${i}" onchange="_btUpdateWeight(${i},this.value)">%</div>`;
    });
    h+=`</div>`;
    const totalW=tgts.reduce((s,t)=>s+(t.weight||Math.round(100/tgts.length)),0);
    h+=`<div style="font-size:11px;margin-top:6px;color:${Math.abs(totalW-100)<1?'var(--green)':'var(--red)'}">总计: ${totalW}% ${Math.abs(totalW-100)<1?'✓':'(需要=100%)'}</div>`;
    h+=`</div>`;
  }
  h+=`</div>`;

  /* 下一步按钮 */
  const canNext=_btCfg.sid&&(tgts.length>0||curType==='stock');
  h+=`<div style="text-align:right;margin-top:16px"><button class="btn btn-primary" ${canNext?'':`disabled style="opacity:0.5"`} onclick="_btGoStep2()"><i class="fas fa-arrow-right"></i> 下一步：设置参数</button></div>`;
  return h;
}

function _btSelStrategy(sid){
  _btCfg.sid=sid;
  const s=(_btCfg.stList||[]).find(x=>String(x.id)===String(sid));
  _btCfg.sName=s?.name||'';
  /* 从策略参数预填标的 */
  const p=typeof s?.params_json==='string'?JSON.parse(s.params_json||'{}'):(s?.params_json||{});
  if(p.targets){_btCfg.targets=p.targets.items||[];_btCfg.targetType=p.targets.type||'stock';}
  _btRender(document.getElementById('main-content'));
}
function _btSetTargetType(type){_btCfg.targetType=type;_btCfg.targets=[];_btRender(document.getElementById('main-content'));}
function _btToggleItem(item){
  if(!_btCfg.targets)_btCfg.targets=[];
  const maxT={beginner:5,advanced:10,expert:20}[ROLE]||5;
  const idx=_btCfg.targets.findIndex(t=>(t.code||t)===item);
  if(idx>=0)_btCfg.targets.splice(idx,1);
  else{if(_btCfg.targets.length>=maxT){toast(`当前角色最多选${maxT}只标的`,'warn');return;}_btCfg.targets.push({code:item,name:item,weight:0});}
  _btRender(document.getElementById('main-content'));
}
function _btAddStock(code,name){
  const inp=document.getElementById('bt-target-input');
  if(inp){const v=inp.value.trim();inp.value=v?(v+', '+code):code;}
}
function _btUpdateWeight(idx,val){
  if(_btCfg.targets&&_btCfg.targets[idx])_btCfg.targets[idx].weight=parseInt(val)||0;
}
function _btGoStep2(){
  /* 读取个股输入 */
  if((_btCfg.targetType||'stock')==='stock'){
    const inp=document.getElementById('bt-target-input');
    const raw=inp?inp.value:'';
    const codes=raw.split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean);
    _btCfg.targets=codes.map(c=>({code:c,name:c,weight:0}));
  }
  /* 校验 */
  if(!_btCfg.sid){toast('请先选择策略','warn');return;}
  if(!_btCfg.targets||_btCfg.targets.length===0){
    /* 默认填一只 */
    _btCfg.targets=[{code:'600519.SH',name:'贵州茅台',weight:100}];
  }
  /* 均分权重 */
  const tw=_btCfg.targets.reduce((s,t)=>s+(t.weight||0),0);
  if(tw<=0||Math.abs(tw-100)>1){
    const w=Math.round(100/_btCfg.targets.length);
    _btCfg.targets.forEach((t,i)=>{t.weight=i===_btCfg.targets.length-1?100-w*(_btCfg.targets.length-1):w;});
  }
  _btStep=2;_btRender(document.getElementById('main-content'));
}

/* --- Step 2: 回测参数 --- */
function _btStep2(){
  /* 默认日期 */
  const today=new Date();
  const defEnd=today.toISOString().split('T')[0];
  const defStart=new Date(today.getFullYear(),today.getMonth()-3,today.getDate()).toISOString().split('T')[0];
  if(!_btCfg.startDate)_btCfg.startDate=defStart;
  if(!_btCfg.endDate)_btCfg.endDate=defEnd;
  if(!_btCfg.capital)_btCfg.capital=100000;

  let h=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-chess-knight"></i> 策略：${_btCfg.sName||'已选策略'}</div>`;
  h+=`<div style="font-size:12px;color:var(--text3)">标的：${(_btCfg.targets||[]).map(t=>t.name||t.code).join('、')}</div></div>`;

  /* 时间范围 */
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-calendar-alt"></i> 回测时间</div>`;
  h+=`<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap">`;
  const periods=[{n:'1个月',m:1},{n:'3个月',m:3},{n:'半年',m:6},{n:'1年',m:12}];
  if(ROLE!=='beginner')periods.push({n:'3年',m:36});
  periods.forEach(p=>{h+=`<div class="rec-btn" style="cursor:pointer;font-size:12px" onclick="_btSetPeriod(${p.m})">${p.n}</div>`;});
  h+=`</div>`;
  h+=`<div style="display:flex;gap:12px;align-items:center"><input type="date" id="bt-start" value="${_btCfg.startDate}" style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)"><span style="color:var(--text3)">至</span><input type="date" id="bt-end" value="${_btCfg.endDate}" style="flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text)"></div>`;
  h+=`</div>`;

  /* 初始资金 */
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-coins"></i> 初始资金</div>`;
  h+=`<div style="display:flex;gap:8px;align-items:center">`;
  h+=`<input type="range" id="bt-capital" min="10000" max="1000000" step="10000" value="${_btCfg.capital}" oninput="document.getElementById('bt-capital-val').textContent=parseInt(this.value).toLocaleString()" style="flex:1">`;
  h+=`<span id="bt-capital-val" style="font-weight:700;font-family:var(--font-num);min-width:80px;text-align:right">${_btCfg.capital.toLocaleString()}</span><span style="font-size:12px;color:var(--text3)">元</span></div>`;
  h+=`<div style="display:flex;gap:6px;margin-top:8px">`;
  [50000,100000,200000,500000].forEach(v=>{
    h+=`<span class="rec-btn" style="cursor:pointer;font-size:11px" onclick="document.getElementById('bt-capital').value=${v};document.getElementById('bt-capital-val').textContent='${v.toLocaleString()}'">¥${(v/10000).toFixed(0)}万</span>`;
  });
  h+=`</div></div>`;

  /* 佣金设置 */
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-receipt"></i> 交易费用`;
  h+=`<span style="font-size:11px;color:var(--text3);font-weight:400;margin-left:8px">默认散户标准</span></div>`;
  h+=`<div style="display:flex;gap:16px;flex-wrap:wrap;font-size:13px">`;
  h+=`<div style="flex:1;min-width:140px"><label style="font-size:11px;color:var(--text3)">佣金</label><div style="display:flex;align-items:center;gap:4px"><span style="font-weight:600" id="bt-comm-label">万2.5</span><span style="font-size:10px;color:var(--text3)">(免5)</span></div></div>`;
  h+=`<div style="flex:1;min-width:140px"><label style="font-size:11px;color:var(--text3)">印花税</label><div style="font-weight:600">千1 (卖出)</div></div>`;
  h+=`<div style="flex:1;min-width:140px"><label style="font-size:11px;color:var(--text3)">过户费</label><div style="font-weight:600">万0.2</div></div>`;
  h+=`</div>`;
  h+=`<details style="margin-top:12px"><summary style="font-size:12px;color:var(--primary);cursor:pointer"><i class="fas fa-cog"></i> 自定义费率</summary>`;
  h+=`<div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap">`;
  h+=`<div class="form-group" style="flex:1;min-width:120px"><label style="font-size:11px">佣金率</label><input type="number" id="bt-comm" value="0.00025" step="0.00001" min="0" max="0.01" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;width:100%;font-size:12px"></div>`;
  h+=`<div class="form-group" style="flex:1;min-width:120px"><label style="font-size:11px">最低佣金</label><input type="number" id="bt-mincomm" value="5" step="1" min="0" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;width:100%;font-size:12px"></div>`;
  h+=`<div class="form-group" style="flex:1;min-width:120px"><label style="font-size:11px">印花税率</label><input type="number" id="bt-stamp" value="0.001" step="0.0001" min="0" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;width:100%;font-size:12px"></div>`;
  h+=`<div class="form-group" style="flex:1;min-width:120px"><label style="font-size:11px">过户费率</label><input type="number" id="bt-transfer" value="0.00002" step="0.00001" min="0" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;width:100%;font-size:12px"></div>`;
  h+=`</div></details></div>`;

  /* 止盈止损 */
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-shield-alt"></i> 止盈止损</div>`;
  h+=`<div style="display:flex;gap:16px;flex-wrap:wrap">`;
  h+=`<div style="flex:1;min-width:200px"><label style="font-size:12px;color:var(--green);font-weight:600">止盈 <span id="bt-tp-val">${_btCfg.takeProfit||10}%</span></label><input type="range" id="bt-tp" min="0" max="50" value="${_btCfg.takeProfit||10}" oninput="document.getElementById('bt-tp-val').textContent=this.value+'%'" style="width:100%"></div>`;
  h+=`<div style="flex:1;min-width:200px"><label style="font-size:12px;color:var(--red);font-weight:600">止损 <span id="bt-sl-val">${_btCfg.stopLoss||8}%</span></label><input type="range" id="bt-sl" min="0" max="30" value="${_btCfg.stopLoss||8}" oninput="document.getElementById('bt-sl-val').textContent=this.value+'%'" style="width:100%"></div>`;
  h+=`</div></div>`;

  /* 对标指数 */
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-chart-line"></i> 对标指数</div>`;
  h+=`<div style="display:flex;gap:8px;flex-wrap:wrap">`;
  const idxList=[{code:'000300.SH',name:'沪深300'},{code:'000016.SH',name:'上证50'},{code:'399006.SZ',name:'创业板指'},{code:'000905.SH',name:'中证500'}];
  const curIdx=_btCfg.benchmark||'000300.SH';
  idxList.forEach(idx=>{
    const sel=curIdx===idx.code;
    h+=`<div class="rec-btn${sel?' sel':''}" style="cursor:pointer;font-size:12px;${sel?'background:var(--primary);color:#fff;border-color:var(--primary)':''}" onclick="_btCfg.benchmark='${idx.code}';_btRender(document.getElementById('main-content'))">${idx.name}</div>`;
  });
  h+=`</div></div>`;

  /* 按钮 */
  h+=`<div style="display:flex;justify-content:space-between;margin-top:16px">`;
  h+=`<button class="btn btn-outline" onclick="_btStep=1;_btRender(document.getElementById('main-content'))"><i class="fas fa-arrow-left"></i> 上一步</button>`;
  h+=`<button class="btn btn-primary" id="bt-run-btn" onclick="_btRunFull()"><i class="fas fa-play"></i> 开始回测</button>`;
  h+=`</div>`;
  return h;
}

function _btSetPeriod(months){
  const end=new Date();
  const start=new Date(end.getFullYear(),end.getMonth()-months,end.getDate());
  document.getElementById('bt-start').value=start.toISOString().split('T')[0];
  document.getElementById('bt-end').value=end.toISOString().split('T')[0];
}

async function _btRunFull(){
  /* 收集参数 */
  const startDate=document.getElementById('bt-start')?.value||_btCfg.startDate;
  const endDate=document.getElementById('bt-end')?.value||_btCfg.endDate;
  const capital=parseInt(document.getElementById('bt-capital')?.value)||100000;
  const commRate=parseFloat(document.getElementById('bt-comm')?.value)||0.00025;
  const minComm=parseFloat(document.getElementById('bt-mincomm')?.value)||5;
  const stampRate=parseFloat(document.getElementById('bt-stamp')?.value)||0.001;
  const transferRate=parseFloat(document.getElementById('bt-transfer')?.value)||0.00002;
  const tp=parseInt(document.getElementById('bt-tp')?.value)||0;
  const sl=parseInt(document.getElementById('bt-sl')?.value)||0;
  const benchmark=_btCfg.benchmark||'000300.SH';

  _btCfg.startDate=startDate;_btCfg.endDate=endDate;_btCfg.capital=capital;
  _btCfg.takeProfit=tp;_btCfg.stopLoss=sl;

  const targets=(_btCfg.targets||[]).map(t=>({code:t.code||t,name:t.name||t.code||t,weight:t.weight||0}));

  const body={
    start_date:startDate,end_date:endDate,initial_capital:capital,
    targets:targets,target_type:_btCfg.targetType||'stock',
    commission_rate:commRate,min_commission:minComm,
    stamp_tax_rate:stampRate,transfer_fee_rate:transferRate,
    take_profit:tp>0?tp:null,stop_loss:sl>0?sl:null,
    benchmark_index:benchmark,
  };

  /* 禁用按钮 + 显示 loading */
  const btn=document.getElementById('bt-run-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 回测中...';}

  let d=null;
  try{d=await api(`/strategy/${_btCfg.sid}/backtest`,{method:'POST',body:JSON.stringify(body)});}
  catch(e){console.error('backtest error',e);}

  if(!d||d.code!==0||!d.data){if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-play"></i> 开始回测';}toast(d?.detail||d?.message||'回测失败，请检查策略和参数','error');return;}
  const st=d.data.status;
  if(st==='completed'){if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-play"></i> 开始回测';}_btResult=d.data;_btStep=3;_btRender(document.getElementById('main-content'));return;}
  const btId=d.data.backtest_id;
  try{
    const full=await pollBacktestResult(_btCfg.sid,btId);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-play"></i> 开始回测';}
    _btResult=full;_btStep=3;_btRender(document.getElementById('main-content'));
  }catch(e){if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-play"></i> 开始回测';}toast(e.message,'error');}
}

/* --- Step 3: 结果展示 (放在第六个 todo) --- */
function _btStep3(){
  if(!_btResult)return `<div style="text-align:center;padding:40px;color:var(--text3)">暂无回测结果</div>`;
  return _btRenderResult(_btResult);
}

/* --- 回测结果渲染 --- */
function _btRenderResult(r){
  const m=r.metrics||{};
  const fee=r.fee_breakdown||{};

function _btDrawChart(){
  if(!_btResult)return;
  const canvas=document.getElementById('bt-chart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const W=canvas.width=canvas.parentElement.clientWidth-32;
  const H=canvas.height=280;
  const pad={t:20,r:20,b:30,l:60};

  const curve=_btResult.equity_curve||[];
  const benchCurve=_btResult.benchmark?.index_curve||[];
  if(curve.length<2)return;

  /* 归一化为收益率 */
  const startVal=curve[0].value||1;
  const sVals=curve.map(p=>((p.value/startVal)-1)*100);
  const bStartVal=benchCurve.length>0?(benchCurve[0].value||1):1;
  const bVals=benchCurve.map(p=>((p.value/bStartVal)-1)*100);

  const allVals=[...sVals,...bVals];
  const minV=Math.min(...allVals)-2;
  const maxV=Math.max(...allVals)+2;
  const rangeV=maxV-minV||1;

  const pw=W-pad.l-pad.r;
  const ph=H-pad.t-pad.b;

  /* 背景网格 */
  ctx.strokeStyle='rgba(128,128,128,0.1)';
  ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++){
    const y=pad.t+ph*(i/4);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    const val=maxV-rangeV*(i/4);
    ctx.fillStyle='rgba(128,128,128,0.5)';ctx.font='10px sans-serif';ctx.textAlign='right';
    ctx.fillText(val.toFixed(1)+'%',pad.l-6,y+4);
  }

  /* 零线 */
  if(minV<0&&maxV>0){
    const y0=pad.t+ph*((maxV-0)/rangeV);
    ctx.strokeStyle='rgba(128,128,128,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(pad.l,y0);ctx.lineTo(W-pad.r,y0);ctx.stroke();
    ctx.setLineDash([]);
  }

  /* X 轴标签 */
  const totalPts=sVals.length;
  const labelStep=Math.max(1,Math.floor(totalPts/6));
  ctx.fillStyle='rgba(128,128,128,0.5)';ctx.font='10px sans-serif';ctx.textAlign='center';
  for(let i=0;i<totalPts;i+=labelStep){
    const x=pad.l+pw*(i/(totalPts-1));
    ctx.fillText(curve[i].date?.slice(5)||'',x,H-8);
  }

  /* 绘制曲线 */
  function drawLine(vals,color,width){
    if(vals.length<2)return;
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();
    vals.forEach((v,i)=>{
      const x=pad.l+pw*(i/(vals.length-1));
      const y=pad.t+ph*((maxV-v)/rangeV);
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.stroke();
    /* 填充渐变 */
    const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
    grad.addColorStop(0,color.replace('1)','0.15)').replace('rgb','rgba'));
    grad.addColorStop(1,color.replace('1)','0)').replace('rgb','rgba'));
    ctx.fillStyle=grad;ctx.lineTo(pad.l+pw,H-pad.b);ctx.lineTo(pad.l,H-pad.b);ctx.closePath();ctx.fill();
  }

  drawLine(bVals,'rgba(249,115,22,0.7)',1.5);
  drawLine(sVals,'rgba(99,102,241,1)',2);

  /* Tooltip: 鼠标悬停显示日期和收益 */
  canvas.onmousemove=function(e){
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left;
    const idx=Math.round((mx-pad.l)/pw*(totalPts-1));
    if(idx<0||idx>=totalPts)return;
    /* 重绘 */
    _btDrawChart();
    const x=pad.l+pw*(idx/(totalPts-1));
    const ctx2=canvas.getContext('2d');
    /* 竖线 */
    ctx2.strokeStyle='rgba(128,128,128,0.4)';ctx2.lineWidth=1;ctx2.setLineDash([3,3]);
    ctx2.beginPath();ctx2.moveTo(x,pad.t);ctx2.lineTo(x,H-pad.b);ctx2.stroke();ctx2.setLineDash([]);
    /* 圆点 */
    const sy=pad.t+ph*((maxV-sVals[idx])/rangeV);
    ctx2.beginPath();ctx2.arc(x,sy,4,0,Math.PI*2);ctx2.fillStyle='rgba(99,102,241,1)';ctx2.fill();
    if(bVals[idx]!==undefined){
      const by=pad.t+ph*((maxV-bVals[idx])/rangeV);
      ctx2.beginPath();ctx2.arc(x,by,4,0,Math.PI*2);ctx2.fillStyle='rgba(249,115,22,0.7)';ctx2.fill();
    }
    /* Tooltip框 */
    const dateStr=curve[idx]?.date||'';
    const txt1=`${dateStr}`;
    const txt2=`策略: ${sVals[idx]>=0?'+':''}${sVals[idx].toFixed(1)}%`;
    const txt3=bVals[idx]!==undefined?`指数: ${bVals[idx]>=0?'+':''}${bVals[idx].toFixed(1)}%`:'';
    ctx2.font='11px sans-serif';
    const tw=Math.max(ctx2.measureText(txt1).width,ctx2.measureText(txt2).width,ctx2.measureText(txt3).width)+16;
    const th=txt3?52:38;const tx=Math.min(x+10,W-tw-5);const ty=Math.max(sy-th-10,5);
    ctx2.fillStyle='rgba(30,30,40,0.9)';
    ctx2.beginPath();if(ctx2.roundRect)ctx2.roundRect(tx,ty,tw,th,6);else{ctx2.moveTo(tx+6,ty);ctx2.lineTo(tx+tw-6,ty);ctx2.quadraticCurveTo(tx+tw,ty,tx+tw,ty+6);ctx2.lineTo(tx+tw,ty+th-6);ctx2.quadraticCurveTo(tx+tw,ty+th,tx+tw-6,ty+th);ctx2.lineTo(tx+6,ty+th);ctx2.quadraticCurveTo(tx,ty+th,tx,ty+th-6);ctx2.lineTo(tx,ty+6);ctx2.quadraticCurveTo(tx,ty,tx+6,ty);ctx2.closePath();}ctx2.fill();
    ctx2.fillStyle='#fff';ctx2.font='10px sans-serif';
    ctx2.fillText(txt1,tx+8,ty+14);
    ctx2.fillStyle='rgba(99,102,241,1)';ctx2.fillText(txt2,tx+8,ty+28);
    if(txt3){ctx2.fillStyle='rgba(249,115,22,1)';ctx2.fillText(txt3,tx+8,ty+42);}
  };
  canvas.onmouseleave=function(){_btDrawChart();canvas.onmousemove=null;canvas.onmouseleave=null;};
}

  const d=await api('/replay/report',{method:'POST',body:JSON.stringify({strategy_id:document.getElementById('rp-sid').value,start_date:document.getElementById('rp-s').value,end_date:document.getElementById('rp-e').value})});
  _lastReportData=d?.data||d;
  showReplayMetrics(_lastReportData);
  r.innerHTML=`<div class="card"><div class="section-title"><i class="fas fa-check-circle" style="color:var(--green)"></i> 报告详情</div><pre style="background:var(--card2);padding:12px;border-radius:8px;font-size:13px;overflow-x:auto;max-height:300px">${JSON.stringify(_lastReportData,null,2)}</pre></div>`;
}

function showReplayMetrics(data){
  if(!data)return;
  document.getElementById('rp-metrics').style.display='block';
  const totalReturn=data.total_return||data.pnl||0;
  const maxDrawdown=data.max_drawdown||data.drawdown||0;
  const winRate=data.win_rate||0;
  const sharpe=data.sharpe_ratio||data.sharpe||0;
  const tradeCount=data.trade_count||data.total_trades||0;
  const avgProfit=tradeCount>0?(totalReturn/tradeCount):0;

  const metrics=[
    {name:'收益稳定性',value:sharpe>1?'优秀':sharpe>0.5?'良好':sharpe>0?'一般':'较差',color:sharpe>0.5?'var(--green)':'var(--orange)',icon:'fa-chart-line',detail:`夏普比率 ${sharpe.toFixed(2)}`},
    {name:'最大亏损',value:`${(maxDrawdown*100).toFixed(1)}%`,color:maxDrawdown>0.2?'var(--red)':'var(--orange)',icon:'fa-arrow-down',detail:maxDrawdown>0.2?'风险偏高，注意控制':'风险可控'},
    {name:'胜率',value:`${(winRate*100).toFixed(0)}%`,color:winRate>=0.6?'var(--green)':'var(--orange)',icon:'fa-trophy',detail:`${tradeCount}笔交易中赢${Math.round(tradeCount*winRate)}笔`},
    {name:'总收益',value:`¥${totalReturn.toFixed(2)}`,color:totalReturn>=0?'var(--green)':'var(--red)',icon:'fa-coins',detail:totalReturn>=0?'盈利':'亏损'},
    {name:'平均每笔盈亏',value:`¥${avgProfit.toFixed(2)}`,color:avgProfit>=0?'var(--green)':'var(--red)',icon:'fa-balance-scale',detail:`共${tradeCount}笔交易`},
    {name:'超额收益',value:sharpe>1?'跑赢大盘':'待评估',color:'var(--primary)',icon:'fa-rocket',detail:'对比同期沪深300'},
  ];

  let h='';
  metrics.forEach(m=>{
    h+=`<div class="card" style="padding:14px;text-align:center;border-top:3px solid ${m.color}">
      <i class="fas ${m.icon}" style="color:${m.color};font-size:18px;margin-bottom:6px;display:block"></i>
      <div style="font-size:12px;color:var(--text3)">${m.name}</div>
      <div style="font-size:20px;font-weight:700;color:${m.color};font-family:var(--font-num);margin:4px 0">${m.value}</div>
      <div style="font-size:11px;color:var(--text3)">${m.detail}</div></div>`;
  });
  document.getElementById('rp-cards').innerHTML=h;
}

async function askReplay(preset){
  const q=preset||document.getElementById('rp-ask').value.trim();
  if(!q){toast('请输入问题','error');return;}
  if(!preset)document.getElementById('rp-ask').value='';
  const ans=document.getElementById('rp-ai-answer');
  ans.innerHTML='<div style="padding:12px;text-align:center"><i class="fas fa-spinner fa-spin" style="color:var(--primary)"></i> AI 分析中...</div>';
  
  const context=_lastReportData?`复盘数据: ${JSON.stringify(_lastReportData).substring(0,500)}\n\n`:'';
  const d=await api('/ai/chat',{method:'POST',body:JSON.stringify({message:context+q,agent:'replay_analysis',history:[]})});
  const reply=d?.data?.reply||'请先生成复盘报告后再提问';
  ans.innerHTML=`<div style="padding:14px;background:var(--card2);border-radius:10px;border-left:3px solid var(--primary)">
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px"><i class="fas fa-robot"></i> 复盘分析 Agent</div>
    <div style="font-size:13px;line-height:1.7;color:var(--text)">${reply.replace(/\n/g,'<br>')}</div>
    <div style="margin-top:8px;font-size:11px;color:var(--orange)"><i class="fas fa-exclamation-triangle"></i> 不构成投资建议</div>
  </div>`;
}

function exportReport(type){
  if(!_lastReportData){toast('请先生成报告','error');return;}
  if(type==='pdf'){
    toast('PDF 导出中...','info');
    api('/export/report/1?export_type=pdf').then(()=>toast('导出完成','success'));
  } else {
    toast('Excel 导出中...','info');
    const csv='指标,值\n'+Object.entries(_lastReportData).map(([k,v])=>`${k},${JSON.stringify(v)}`).join('\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='replay_report.csv';a.click();
    toast('已下载','success');
  }
}

async function mkAnalysis(){
  const tid=document.getElementById('rp-tid').value.trim();if(!tid){toast('请输入交易ID','error');return;}

}

  h+=`</div>`;

  if(Array.isArray(ml)&&ml.length>0){h+=`<table><thead><tr><th>名称</th><th>代码</th><th>说明</th></tr></thead><tbody>`;ml.forEach(f=>{h+=`<tr><td style="font-weight:500">${f.name||''}</td><td style="font-family:monospace;font-size:13px">${f.code||''}</td><td style="font-size:13px">${f.description||''}</td></tr>`;});h+=`</tbody></table>`;}

/* ===== 9. ALERT ===== */
let _alertTab='active';
async function rAlert(c){
  /* 骨架屏 */
  c.innerHTML=`<div style="padding:16px"><div style="height:24px;width:160px;background:var(--card2);border-radius:8px;margin-bottom:16px"></div>${'<div style="height:80px;background:var(--card2);border-radius:12px;margin-bottom:10px"></div>'.repeat(5)}</div>`;
  const d=await api('/alerts?limit=50');const al=d?.data||[];
  _alertRenderList(c,al);
}

function _alertRenderList(c,al){
  const active=al.filter(a=>a.status!=='resolved');const triggered=al.filter(a=>a.status==='triggered');const resolved=al.filter(a=>a.status==='resolved');
  let filtered=al;
  if(_alertTab==='active')filtered=active;else if(_alertTab==='triggered')filtered=triggered;else if(_alertTab==='resolved')filtered=resolved;

  let h=`<div class="content-header"><h1><i class="fas fa-bell" style="color:var(--primary)"></i> ${ROLE==='beginner'?'我的提醒':'预警中心'}</h1></div>`;

  /* 状态卡片 */
  h+=`<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">`;
  [{l:'活跃监控',v:active.length,c:'var(--primary)',i:'fa-eye'},{l:'今日触发',v:triggered.length,c:'var(--orange)',i:'fa-bolt'},{l:'已解决',v:resolved.length,c:'var(--green)',i:'fa-check-circle'}].forEach(s=>{
    h+=`<div style="flex:1;min-width:120px;padding:14px;background:var(--card);border-radius:12px;border:1.5px solid var(--border);text-align:center">`;
    h+=`<div style="font-size:24px;font-weight:800;font-family:var(--font-num);color:${s.c}">${s.v}</div>`;
    h+=`<div style="font-size:11px;color:var(--text3)"><i class="fas ${s.i}" style="margin-right:4px"></i>${s.l}</div></div>`;
  });
  h+=`</div>`;

  /* Tab 筛选 */
  h+=`<div style="display:flex;gap:4px;margin-bottom:16px;padding:4px;background:var(--card2);border-radius:10px">`;
  [{k:'active',l:'活跃预警'},{k:'triggered',l:'已触发'},{k:'resolved',l:'已解决'},{k:'all',l:'全部'}].forEach(t=>{
    const act=_alertTab===t.k;
    h+=`<button style="flex:1;padding:8px;border-radius:8px;border:none;font-size:12px;font-weight:${act?'600':'400'};cursor:pointer;background:${act?'var(--card)':'transparent'};color:${act?'var(--primary)':'var(--text3)'};${act?'box-shadow:0 2px 8px rgba(0,0,0,.06)':''}" onclick="_alertTab='${t.k}';_alertRenderList(document.getElementById('main-content'),window._alertData||[])">${t.l}</button>`;
  });
  h+=`</div>`;

  /* 快捷预设创建 */
  h+=`<div class="card" style="padding:16px;margin-bottom:16px">`;
  h+=`<div style="font-size:13px;font-weight:600;margin-bottom:10px"><i class="fas fa-zap" style="color:var(--orange)"></i> ${ROLE==='beginner'?'一键设置提醒':'快捷预设'}</div>`;
  h+=`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">`;
  const presets=ROLE==='beginner'
    ?[{l:'股票跌了就提醒',i:'fa-arrow-down',t:'跌破成本价',m:'持仓跌破买入价时通知',lv:'warning'},{l:'股票涨了就提醒',i:'fa-arrow-up',t:'涨10%提醒',m:'持仓上涨10%时提醒止盈',lv:'info'},{l:'大盘大跌提醒',i:'fa-chart-line',t:'大盘暴跌',m:'大盘跌幅超过3%时紧急通知',lv:'critical'}]
    :[{l:'跌破成本价',i:'fa-arrow-down',t:'跌破成本价',m:'持仓跌破买入成本价',lv:'warning'},{l:'涨10%止盈',i:'fa-arrow-up',t:'止盈10%',m:'持仓上涨10%提醒止盈',lv:'info'},{l:'大盘暴跌',i:'fa-chart-line',t:'大盘暴跌',m:'上证指数跌幅>3%',lv:'critical'},{l:'板块异动',i:'fa-industry',t:'板块异动',m:'关注板块涨跌幅超过5%',lv:'warning'}];
  presets.forEach(p=>{
    h+=`<button class="btn btn-sm btn-outline" style="font-size:12px" onclick="_alertQuickCreate('${p.t}','${p.m}','${p.lv}')"><i class="fas ${p.i}"></i> ${p.l}</button>`;
  });
  h+=`</div>`;
  h+=`<button class="btn btn-primary btn-sm" onclick="showAddAlert()"><i class="fas fa-plus"></i> ${ROLE==='beginner'?'自定义提醒':'新建预警'}</button>`;
  h+=`</div>`;

  /* 预警卡片列表 */
  if(filtered.length===0){
    h+=`<div class="card" style="text-align:center;padding:40px"><i class="fas fa-bell-slash" style="font-size:32px;opacity:.12;display:block;margin-bottom:12px"></i>`;
    h+=`<p style="font-size:14px;color:var(--text2)">${_alertTab==='resolved'?'没有已解决的预警':'暂无预警，添加一个试试'}</p></div>`;
  } else {
    filtered.forEach(a=>{
      const lvMap={critical:{c:'var(--red)',bg:'var(--red-bg)',i:'fa-exclamation-circle',l:'紧急'},warning:{c:'var(--orange)',bg:'var(--orange-bg)',i:'fa-exclamation-triangle',l:'警告'},info:{c:'var(--primary)',bg:'var(--primary-bg)',i:'fa-info-circle',l:'提示'}};
      const lv=lvMap[a.level]||lvMap.info;const isResolved=a.status==='resolved';
      h+=`<div class="card" style="padding:16px;margin-bottom:8px;${isResolved?'opacity:.6':''}border-left:4px solid ${lv.c};transition:transform .1s" onmouseenter="this.style.transform='translateX(4px)'" onmouseleave="this.style.transform=''">`;
      h+=`<div style="display:flex;align-items:flex-start;gap:10px">`;
      h+=`<div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${lv.bg};color:${lv.c};flex-shrink:0"><i class="fas ${lv.i}"></i></div>`;
      h+=`<div style="flex:1;min-width:0"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">`;
      h+=`<span style="font-size:14px;font-weight:600">${a.title||ROLE==='beginner'?'提醒':a.symbol||'预警'}</span>`;
      h+=`<span style="font-size:11px;padding:2px 6px;border-radius:4px;background:${lv.bg};color:${lv.c}">${lv.l}</span>`;
      h+=`<span style="font-size:11px;padding:2px 6px;border-radius:4px;${isResolved?'background:var(--green-bg);color:var(--green)':'background:var(--primary-bg);color:var(--primary)'}">${isResolved?'已解决':'监控中'}</span>`;
      h+=`</div>`;
      h+=`<div style="font-size:13px;color:var(--text2);margin-bottom:6px">${a.message||a.content||''}</div>`;
      h+=`<div style="display:flex;align-items:center;gap:12px;font-size:11px;color:var(--text3)">`;
      h+=`<span><i class="fas fa-clock"></i> ${a.created_at||a.time||'刚刚'}</span>`;
      h+=`<span><i class="fas fa-mobile-alt"></i> APP通知</span>`;
      h+=`</div></div>`;
      /* 操作按钮 */
      if(!isResolved){
        h+=`<div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">`;
        h+=`<button class="btn btn-sm btn-green" style="font-size:11px" onclick="resolveA('${a.id||a.alert_id}')"><i class="fas fa-check"></i></button>`;
        h+=`<button class="btn btn-sm" style="font-size:11px;background:var(--card2);color:var(--text3);border:none" onclick="toast('已暂停','info')"><i class="fas fa-pause"></i></button>`;
        h+=`</div>`;
      }
      h+=`</div></div>`;
    });
  }

  c.innerHTML=h;
  window._alertData=al;
}

async function rMessages(c){
  loading(c);const d=await api('/messages?limit=20');const ml=d?.data||[];
  let h=`<div class="content-header"><h1>私信中心</h1></div>`;
  h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-paper-plane"></i> 发送私信</div>
  <div style="display:flex;gap:8px"><input id="msg-to" placeholder="接收者ID" style="flex:1"><input id="msg-c" placeholder="消息内容" style="flex:2"><button class="btn btn-primary btn-sm" onclick="sendMsg()">发送</button></div></div>`;
  if(Array.isArray(ml)&&ml.length>0){
    h+=`<div class="card"><div class="section-title"><i class="fas fa-inbox"></i> 消息列表</div><table><thead><tr><th>发送者</th><th>内容</th><th>状态</th><th>操作</th></tr></thead><tbody>`;
    ml.forEach(m=>{h+=`<tr><td>${m.sender_id||''}</td><td style="font-size:13px">${m.content||''}</td><td><span class="badge ${m.is_read?'badge-green':'badge-orange'}">${m.is_read?'已读':'未读'}</span></td><td>${!m.is_read?`<button class="btn btn-sm btn-ghost" onclick="readMsg('${m.id||m.message_id}')">标记已读</button>`:''}</td></tr>`;});
    h+=`</tbody></table></div>`;
  } else h+=`<div class="empty-state"><i class="fas fa-envelope-open"></i><p>暂无私信</p></div>`;
  c.innerHTML=h;
}

async function sendMsg(){const to=document.getElementById('msg-to').value.trim(),ct=document.getElementById('msg-c').value.trim();if(!to||!ct){toast('请填写完整','error');return;}await api('/messages',{method:'POST',body:JSON.stringify({receiver_id:to,content:ct})});toast('发送成功','success');rMessages(document.getElementById('main-content'));}
async function readMsg(id){await api(`/messages/${id}/read`,{method:'PUT'});toast('已标记','success');rMessages(document.getElementById('main-content'));}

/* 账户设置辅助函数 */
function _acctGroup(icon,title,sub,content){
  return `<div class="card" style="padding:20px;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:12px"><i class="fas ${icon}" style="color:var(--primary)"></i><span style="font-size:14px;font-weight:700">${title}</span>${sub?`<span style="font-size:11px;color:var(--text3)">${sub}</span>`:''}</div>${content}</div>`;
}
function _acctRow(icon,label,value,action,onclick){
  return `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><i class="fas ${icon}" style="color:var(--text3);width:20px;text-align:center"></i><div style="flex:1"><div style="font-size:13px;font-weight:500">${label}</div></div><span style="font-size:13px;color:var(--text);font-weight:500">${value}</span>${action?`<button class="btn btn-sm btn-outline" style="font-size:11px;padding:3px 10px" onclick="${onclick||''}">${action}</button>`:''}</div>`;
}
function _acctChip(label,color,active){
  const c=color==='green'?'var(--green)':color==='primary'?'var(--primary)':'var(--text3)';
  return `<span style="font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;${active?`background:${c}15;color:${c};font-weight:600`:'background:var(--card2);color:var(--text3)'}">${label}</span>`;
}

function showChangePassword(){
  document.getElementById('gm-body').innerHTML=`<h3>修改密码</h3>
    <div class="form-group"><label>当前密码</label><input type="password" id="cp-old" placeholder="输入当前密码"></div>

async function saveChangePassword(){
  const cur=document.getElementById('cp-old').value;
  const neu=document.getElementById('cp-new').value;
  if(!cur||!neu){toast('请填写当前密码和新密码','error');return;}
  if(neu.length<6){toast('新密码至少6位','error');return;}
  const d=await api('/auth/change-password',{method:'PUT',body:JSON.stringify({current_password:cur,new_password:neu})});
  if(d&&d.code===0){closeModal('gm');toast('密码已修改','success');}else{toast(apiErrMsg(d)||'修改失败','error');}
}

function genD(n){const d=[];let p=25;for(let i=0;i<n;i++){const o=p+((Math.random()-.48)*1.5);const cl=o+((Math.random()-.48)*2);const hi=Math.max(o,cl)+(Math.random()*1);const lo=Math.min(o,cl)-(Math.random()*1);const v=Math.floor(5000+Math.random()*15000);d.push({o:+o.toFixed(2),h:+hi.toFixed(2),l:+lo.toFixed(2),c:+cl.toFixed(2),v,dt:new Date(2025,0,i+1)});p=cl;}return d;}

function drawKC(id){
  const cv=document.getElementById(id);if(!cv)return;
  const dpr=window.devicePixelRatio||1;const rc=cv.parentElement.getBoundingClientRect();
  const W=rc.width-32,H=450;cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const data=genD(60),kH=H*.52,vH=H*.12,retH=H*.25;
  const mT=30,mL=50,mR=20;
  const ps=data.flatMap(d=>[d.h,d.l]),pMn=Math.min(...ps),pMx=Math.max(...ps),vMx=Math.max(...data.map(d=>d.v));
  const bW=(W-mL-mR)/data.length;
  const dk=document.documentElement.classList.contains('dark');
  const gc=dk?'rgba(148,163,184,.1)':'rgba(0,0,0,.06)',tc=dk?'#94a3b8':'#64748b';
  function pY(p){return mT+(1-(p-pMn)/(pMx-pMn))*(kH-mT-10);}
  ctx.strokeStyle=gc;ctx.lineWidth=.5;
  for(let i=0;i<5;i++){const y=mT+(kH-mT-10)*i/4;ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(W-mR,y);ctx.stroke();ctx.fillStyle=tc;ctx.font='11px var(--font-num)';ctx.textAlign='right';ctx.fillText((pMx-(pMx-pMn)*i/4).toFixed(2),mL-6,y+4);}
  const bp=[8,22,38,52],sp=[15,30,45,57];
  data.forEach((d,i)=>{const x=mL+i*bW+bW/2;const up=d.c>=d.o;ctx.strokeStyle=up?'#ef4444':'#22c55e';ctx.fillStyle=up?'#ef4444':'#22c55e';ctx.beginPath();ctx.moveTo(x,pY(d.h));ctx.lineTo(x,pY(d.l));ctx.lineWidth=1;ctx.stroke();const bt=pY(Math.max(d.o,d.c)),bb=pY(Math.min(d.o,d.c));ctx.fillRect(x-bW*.35,bt,bW*.7,Math.max(bb-bt,1));});
  function drawMA(n,c){ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=1.5;data.forEach((d,i)=>{if(i<n-1)return;let s=0;for(let j=i-n+1;j<=i;j++)s+=data[j].c;const a=s/n,x=mL+i*bW+bW/2,y=pY(a);i===n-1?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();}
  drawMA(5,'#3b82f6');drawMA(10,'#f59e0b');drawMA(20,'#a855f7');
  ctx.font='11px var(--font)';[{c:'#3b82f6',t:'MA5'},{c:'#f59e0b',t:'MA10'},{c:'#a855f7',t:'MA20'}].forEach((m,i)=>{ctx.fillStyle=m.c;ctx.fillRect(mL+i*70,6,16,3);ctx.fillStyle=tc;ctx.fillText(m.t,mL+i*70+20,11);});
  bp.forEach(i=>{if(i>=data.length)return;const x=mL+i*bW+bW/2,y=pY(data[i].l)+22;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle='#10b981';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px var(--font)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('买',x,y);});
  sp.forEach(i=>{if(i>=data.length)return;const x=mL+i*bW+bW/2,y=pY(data[i].h)-22;ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle='#ef4444';ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px var(--font)';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('卖',x,y);});
  const vB=kH+vH;ctx.fillStyle=tc;ctx.font='11px var(--font)';ctx.textAlign='left';ctx.fillText('成交量',mL,kH+14);
  data.forEach((d,i)=>{const x=mL+i*bW+bW*.15,h=(d.v/vMx)*vH*.8;ctx.fillStyle=d.c>=d.o?'rgba(239,68,68,.4)':'rgba(34,197,94,.4)';ctx.fillRect(x,vB-h,bW*.7,h);});
  const rB=kH+vH+30;ctx.fillStyle=tc;ctx.font='11px var(--font)';ctx.textAlign='left';ctx.fillText('累计收益',mL,rB-6);
  const sr=[],mr=[];let s1=0,m1=0;data.forEach((d,i)=>{if(i>0){s1+=(d.c-data[i-1].c)/data[i-1].c*100*(0.8+Math.random()*.4);m1+=(d.c-data[i-1].c)/data[i-1].c*100*.6;}sr.push(s1);mr.push(m1);});
  const ar=[...sr,...mr],rMn=Math.min(...ar)-2,rMx=Math.max(...ar)+2;
  function rY(r){return rB+(1-(r-rMn)/(rMx-rMn))*(retH-20);}
  ctx.beginPath();ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;data.forEach((d,i)=>{const x=mL+i*bW+bW/2;i===0?ctx.moveTo(x,rY(sr[i])):ctx.lineTo(x,rY(sr[i]));});ctx.stroke();
  ctx.beginPath();ctx.strokeStyle='#94a3b8';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);data.forEach((d,i)=>{const x=mL+i*bW+bW/2;i===0?ctx.moveTo(x,rY(mr[i])):ctx.lineTo(x,rY(mr[i]));});ctx.stroke();ctx.setLineDash([]);
}

/* ===== AI ASSISTANT PANEL ===== */
const AI_AGENTS=[
  {id:'strategy_parse',name:'策略助手',icon:'fa-chess-knight',desc:'解析策略、生成配置'},
  {id:'replay_analysis',name:'复盘分析',icon:'fa-chart-bar',desc:'分析交易、盈亏根因'},
  {id:'data_validate',name:'数据校验',icon:'fa-check-double',desc:'行情异常检测'},
  {id:'alert_reason',name:'告警推理',icon:'fa-bell',desc:'告警根因分析'},
];
let _aiOpen=false,_aiAgent='strategy_parse',_aiHistory=[],_aiLoading=false;

function toggleAiPanel(){_aiOpen=!_aiOpen;document.getElementById('ai-panel').classList.toggle('open',_aiOpen);document.getElementById('ai-fab').classList.toggle('active',_aiOpen);if(_aiOpen)renderAiPanel();}

function renderAiPanel(){
  const p=document.getElementById('ai-panel-body');
  let h=`<div style="padding:8px 12px;background:var(--orange-bg);border-radius:8px;font-size:11px;color:var(--text2);margin-bottom:8px">
    <i class="fas fa-exclamation-triangle" style="color:var(--orange)"></i> 本内容仅为工具性分析，不构成投资建议</div>`;
  /* Agent tabs */
  h+=`<div style="display:flex;gap:4px;margin-bottom:8px;overflow-x:auto;padding-bottom:4px">`;
  AI_AGENTS.forEach(a=>{h+=`<div style="padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;white-space:nowrap;${a.id===_aiAgent?'background:var(--primary);color:#fff':'background:var(--card2);color:var(--text2)'}" onclick="_aiAgent='${a.id}';renderAiPanel()"><i class="fas ${a.icon}"></i> ${a.name}</div>`;});
  h+=`</div>`;
  /* Chat history */
  h+=`<div id="ai-msgs" style="flex:1;overflow-y:auto;padding:4px 0">`;
  if(_aiHistory.length===0){
    const a=AI_AGENTS.find(x=>x.id===_aiAgent);
    h+=`<div style="text-align:center;padding:40px 16px;color:var(--text3)"><i class="fas ${a?.icon||'fa-robot'}" style="font-size:28px;margin-bottom:8px;display:block"></i><b>${a?.name||'AI 助手'}</b><br><span style="font-size:12px">${a?.desc||''}</span><br><br><span style="font-size:12px">试试输入问题开始对话</span></div>`;
  } else {
    _aiHistory.forEach(m=>{
      if(m.role==='user'){
        h+=`<div style="display:flex;justify-content:flex-end;margin-bottom:8px"><div style="background:var(--primary);color:#fff;padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:85%;font-size:13px;line-height:1.5">${escHtml(m.content)}</div></div>`;
      } else {
        h+=`<div style="display:flex;margin-bottom:8px"><div style="background:var(--card2);padding:8px 12px;border-radius:12px 12px 12px 2px;max-width:85%;font-size:13px;line-height:1.5;color:var(--text)"><div style="font-size:10px;color:var(--text3);margin-bottom:4px"><i class="fas fa-robot"></i> ${AI_AGENTS.find(a=>a.id===_aiAgent)?.name||'AI'}</div>${escHtml(m.content).replace(/\n/g,'<br>')}<div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-sm btn-ghost" style="font-size:11px;padding:2px 6px" onclick="aiFeedback(1)"><i class="fas fa-thumbs-up"></i></button><button class="btn btn-sm btn-ghost" style="font-size:11px;padding:2px 6px" onclick="aiFeedback(0)"><i class="fas fa-thumbs-down"></i></button></div></div></div>`;
      }
    });
  }
  if(_aiLoading)h+=`<div style="text-align:center;padding:12px"><i class="fas fa-spinner fa-spin" style="color:var(--primary)"></i></div>`;
  h+=`</div>`;
  p.innerHTML=h;
  const msgs=document.getElementById('ai-msgs');if(msgs)msgs.scrollTop=msgs.scrollHeight;
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function sendAiMsg(){
  const inp=document.getElementById('ai-input');const msg=inp.value.trim();
  if(!msg||_aiLoading)return;
  inp.value='';_aiHistory.push({role:'user',content:msg});_aiLoading=true;renderAiPanel();
  const d=await api('/ai/chat',{method:'POST',body:JSON.stringify({message:msg,agent:_aiAgent,history:_aiHistory.slice(-10)})});
  _aiLoading=false;
  const reply=d?.data?.reply||d?.reply||'请求失败，请稍后重试';
  _aiHistory.push({role:'assistant',content:reply});
  renderAiPanel();
}
function aiInputKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendAiMsg();}}
function aiFeedback(v){toast(v?'感谢反馈！':'已记录，我们会改进','info');}
function clearAiChat(){_aiHistory=[];renderAiPanel();}

<!-- ===== COMMAND PALETTE (Ctrl+K) ===== -->
<div id="cmd-palette-overlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);z-index:10000;backdrop-filter:blur(4px)" onclick="_cmdClose()"></div>
<div id="cmd-palette" style="display:none;position:fixed;top:15%;left:50%;transform:translateX(-50%);width:560px;max-width:90vw;background:var(--card);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);z-index:10001;overflow:hidden;border:1.5px solid var(--border)">
  <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1.5px solid var(--border)">
    <i class="fas fa-search" style="color:var(--text3)"></i>
    <input id="cmd-input" placeholder="搜索页面、功能、操作..." style="flex:1;border:none;background:transparent;color:var(--text);font-size:15px;outline:none" oninput="_cmdFilter(this.value)" onkeydown="_cmdKeydown(event)">
    <kbd style="padding:2px 8px;border-radius:4px;background:var(--card2);color:var(--text3);font-size:11px;font-family:var(--font-num);border:1px solid var(--border)">ESC</kbd>
  </div>
  <div id="cmd-results" style="max-height:360px;overflow-y:auto;padding:8px"></div>
</div>
<script>
let _cmdOpen=false,_cmdIdx=0,_cmdItems=[];
function _cmdBuild(){
  _cmdItems=[];
  for(const[k,v]of Object.entries(PAGES)){
    if(v.roles.includes(ROLE))_cmdItems.push({type:'page',key:k,icon:v.icon,label:v.label,action:()=>navigate(k)});
  }
  _cmdItems.push({type:'action',key:'dark',icon:'fa-moon',label:'切换深色/浅色模式',action:toggleDark});
  _cmdItems.push({type:'action',key:'sim',icon:'fa-flask',label:'切换到模拟交易',action:()=>setEnv('sim')});
  if(RELEASE_REAL_TRADING)_cmdItems.push({type:'action',key:'real',icon:'fa-bolt',label:'切换到真实交易',action:()=>setEnv('real')});
  _cmdItems.push({type:'action',key:'logout',icon:'fa-sign-out-alt',label:'退出登录',action:doLogout});
  _cmdItems.push({type:'action',key:'ai',icon:'fa-robot',label:'打开 AI 助手',action:toggleAiPanel});
}
function _cmdToggle(){
  _cmdOpen=!_cmdOpen;
  document.getElementById('cmd-palette').style.display=_cmdOpen?'block':'none';
  document.getElementById('cmd-palette-overlay').style.display=_cmdOpen?'block':'none';
  if(_cmdOpen){_cmdBuild();_cmdIdx=0;_cmdFilter('');setTimeout(()=>document.getElementById('cmd-input').focus(),50);}
}
function _cmdClose(){_cmdOpen=false;document.getElementById('cmd-palette').style.display='none';document.getElementById('cmd-palette-overlay').style.display='none';}
function _cmdFilter(q){
  const box=document.getElementById('cmd-results');
  const ql=q.toLowerCase();
  const filtered=ql?_cmdItems.filter(i=>i.label.toLowerCase().includes(ql)||i.key.includes(ql)):_cmdItems;
  _cmdIdx=0;
  if(filtered.length===0){box.innerHTML=`<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">没有找到匹配的命令</div>`;return;}
  box.innerHTML=filtered.map((item,i)=>`<div class="cmd-item${i===_cmdIdx?' cmd-active':''}" data-idx="${i}" onclick="_cmdExec(${i})" onmouseenter="_cmdIdx=${i};_cmdHighlight()" style="display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;cursor:pointer;transition:background .1s;${i===_cmdIdx?'background:var(--primary-bg)':''}"><i class="fas ${item.icon}" style="width:20px;text-align:center;color:${item.type==='page'?'var(--primary)':'var(--text3)'}"></i><div style="flex:1"><div style="font-size:14px;font-weight:500">${item.label}</div><div style="font-size:11px;color:var(--text3)">${item.type==='page'?'页面':'操作'}</div></div>${item.type==='page'?'<i class="fas fa-arrow-right" style="font-size:10px;color:var(--text3)"></i>':''}</div>`).join('');
  window._cmdFiltered=filtered;
}
function _cmdHighlight(){
  document.querySelectorAll('.cmd-item').forEach((el,i)=>{el.style.background=i===_cmdIdx?'var(--primary-bg)':'';el.classList.toggle('cmd-active',i===_cmdIdx);});
}
function _cmdKeydown(e){
  const filtered=window._cmdFiltered||_cmdItems;
  if(e.key==='ArrowDown'){e.preventDefault();_cmdIdx=Math.min(_cmdIdx+1,filtered.length-1);_cmdHighlight();}
  else if(e.key==='ArrowUp'){e.preventDefault();_cmdIdx=Math.max(_cmdIdx-1,0);_cmdHighlight();}
  else if(e.key==='Enter'){e.preventDefault();_cmdExec(_cmdIdx);}
  else if(e.key==='Escape'){_cmdClose();}
}
function _cmdExec(idx){const filtered=window._cmdFiltered||_cmdItems;const item=filtered[idx];if(item){_cmdClose();item.action();}}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();_cmdToggle();}});
</script>
