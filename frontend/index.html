/* ===== 交互式K线图系统 ===== */

/* 初始化K线图：创建状态 -> 绑定事件 -> 首次绘制 */
function _initBtKlineChart(canvasId,volCanvasId,infoId,klines,trades){
  const canvas=document.getElementById(canvasId);
  const volCanvas=document.getElementById(volCanvasId);
  if(!canvas||klines.length===0)return;
  /* 构建交易映射 */
  const tradeMap={};
  trades.forEach(t=>{if(!tradeMap[t.date])tradeMap[t.date]=[];tradeMap[t.date].push(t);});
  /* 状态对象 */
  const state={
    canvas, volCanvas, infoId,
    klines, tradeMap,
    startIdx:0, endIdx:klines.length-1,
    hovIdx:-1,
    /* 拖拽状态 */
    dragging:false, dragStartX:0, dragStartIdx:0, dragEndIdx:0,
    /* 触摸状态 */
    lastPinchDist:0, touchStartX:0, touchStartStart:0, touchStartEnd:0,
    /* 边距常量 */
    mL:48, mR:10, mT:18, mB:26, volH:50
  };
  _bindKlineEvents(state);
  _redrawKline(state);
}

/* 纯绘制函数：根据 state.startIdx / endIdx 绘制视窗范围 */
function _redrawKline(state){
  const {canvas,volCanvas,mL,mR,mT,mB}=state;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*dpr;
  canvas.height=canvas.clientHeight*dpr;
  ctx.scale(dpr,dpr);
  const cw=canvas.clientWidth,ch=canvas.clientHeight;

  /* 视窗数据 */
  const bars=state.klines.slice(state.startIdx,state.endIdx+1);
  if(bars.length===0)return;
  const bW=Math.max(2,(cw-mL-mR)/bars.length);
  state._bW=bW;state._cw=cw;state._ch=ch;state._bars=bars;

  /* 价格范围 */
  let pMin=Infinity,pMax=-Infinity;
  bars.forEach(d=>{if(d.low<pMin)pMin=d.low;if(d.high>pMax)pMax=d.high;});
  const pad=(pMax-pMin)*0.05||0.5;
  pMin-=pad;pMax+=pad;
  const pRange=pMax-pMin||1;
  state._pMin=pMin;state._pMax=pMax;state._pRange=pRange;
  const pY=v=>mT+(1-(v-pMin)/pRange)*(ch-mT-mB);
  state._pY=pY;

  /* 主题 */
  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  const bgC=isDark?'#1a1a2e':'#ffffff';
  const gc=isDark?'rgba(255,255,255,0.06)':'rgba(0,0,0,0.04)';
  const tc=isDark?'rgba(255,255,255,0.5)':'rgba(0,0,0,0.45)';
  state._tc=tc;state._bgC=bgC;

  /* 背景 */
  ctx.fillStyle=bgC;ctx.fillRect(0,0,cw,ch);

  /* 网格线 + Y轴刻度 */
  const gridN=4;
  ctx.strokeStyle=gc;ctx.lineWidth=0.5;
  for(let i=0;i<=gridN;i++){
    const y=mT+(ch-mT-mB)*i/gridN;
    ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(cw-mR,y);ctx.stroke();
    const pv=pMax-pRange*i/gridN;
    ctx.fillStyle=tc;ctx.font='10px system-ui';ctx.textAlign='right';
    ctx.fillText(pv.toFixed(2),mL-4,y+3);
  }

  /* K线蜡烛 */
  bars.forEach((d,i)=>{
    const x=mL+i*bW+bW/2;
    const up=d.close>=d.open;
    const clr=up?'#ef4444':'#22c55e';
    ctx.strokeStyle=clr;ctx.fillStyle=clr;
    ctx.beginPath();ctx.moveTo(x,pY(d.high));ctx.lineTo(x,pY(d.low));ctx.lineWidth=1;ctx.stroke();
    const bt=pY(Math.max(d.open,d.close)),bb=pY(Math.min(d.open,d.close));
    const bodyH=Math.max(bb-bt,1);
    if(bW>4){
      ctx.fillRect(x-bW*.35,bt,bW*.7,bodyH);
    } else {
      ctx.fillRect(x-0.5,bt,1,bodyH);
    }
  });

  /* 日期标签 */
  ctx.fillStyle=tc;ctx.font='9px system-ui';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(bars.length/Math.min(8,bars.length)));
  for(let i=0;i<bars.length;i+=step){
    const x=mL+i*bW+bW/2;
    ctx.fillText(bars[i].date.slice(5),x,ch-6);
  }

  /* 买卖标记 */
  bars.forEach((d,i)=>{
    const ts=state.tradeMap[d.date];
    if(!ts)return;
    const x=mL+i*bW+bW/2;
    ts.forEach(t=>{
      const isBuy=t.action==='买入';
      const y=isBuy?pY(d.low)+10:pY(d.high)-10;
      ctx.fillStyle=isBuy?'#ef4444':'#22c55e';
      ctx.beginPath();
      if(isBuy){ctx.moveTo(x,y-8);ctx.lineTo(x-5,y);ctx.lineTo(x+5,y);}
      else{ctx.moveTo(x,y+8);ctx.lineTo(x-5,y);ctx.lineTo(x+5,y);}
      ctx.closePath();ctx.fill();
      if(bW>5){
        ctx.fillStyle=isBuy?'#ef4444':'#22c55e';
        ctx.font='bold 9px system-ui';ctx.textAlign='center';
        ctx.fillText((isBuy?'买':'卖')+' '+t.price.toFixed(1),x,isBuy?y+10:y-4);
      }
    });
  });

  /* 十字光标 */
  if(state.hovIdx>=0&&state.hovIdx<bars.length){
    const hi=state.hovIdx;
    const x=mL+hi*bW+bW/2;
    ctx.save();
    ctx.setLineDash([3,3]);
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.2)';
    ctx.lineWidth=0.8;
    /* 竖线 */
    ctx.beginPath();ctx.moveTo(x,mT);ctx.lineTo(x,ch-mB);ctx.stroke();
    /* 横线 */
    if(state._hovY!==undefined){
      ctx.beginPath();ctx.moveTo(mL,state._hovY);ctx.lineTo(cw-mR,state._hovY);ctx.stroke();
      /* 右侧价格标签 */
      const hovPrice=pMin+(1-(state._hovY-mT)/(ch-mT-mB))*pRange;
      ctx.setLineDash([]);
      ctx.fillStyle=isDark?'rgba(80,80,120,0.85)':'rgba(50,50,80,0.85)';
      const lblW=52,lblH=16;
      ctx.fillRect(cw-mR,state._hovY-lblH/2,lblW,lblH);
      ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='left';
      ctx.fillText(hovPrice.toFixed(2),cw-mR+3,state._hovY+4);
    }
    ctx.restore();
  }

  /* 成交量副图 */
  _redrawVolume(state);
}

/* 成交量副图绘制 */
function _redrawVolume(state){
  const {volCanvas,mL,mR}=state;
  if(!volCanvas)return;
  const ctx=volCanvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  volCanvas.width=volCanvas.clientWidth*dpr;
  volCanvas.height=volCanvas.clientHeight*dpr;
  ctx.scale(dpr,dpr);
  const cw=volCanvas.clientWidth,ch=volCanvas.clientHeight;
  const bars=state._bars;
  if(!bars||bars.length===0)return;
  const bW=state._bW;

  const isDark=document.documentElement.getAttribute('data-theme')==='dark';
  ctx.fillStyle=isDark?'#1a1a2e':'#ffffff';
  ctx.fillRect(0,0,cw,ch);

  /* 最大成交量 */
  let vMax=0;
  bars.forEach(d=>{if((d.volume||0)>vMax)vMax=d.volume||0;});
  if(vMax===0)vMax=1;

  /* 柱状图 */
  const vMT=2,vMB=4;
  bars.forEach((d,i)=>{
    const x=mL+i*bW+bW/2;
    const up=d.close>=d.open;
    ctx.fillStyle=up?'rgba(239,68,68,0.5)':'rgba(34,197,94,0.5)';
    const h=((d.volume||0)/vMax)*(ch-vMT-vMB);
    ctx.fillRect(x-bW*.35,ch-vMB-h,bW*.7,h);
  });

  /* 十字光标竖线延伸 */
  if(state.hovIdx>=0&&state.hovIdx<bars.length){
    const x=mL+state.hovIdx*bW+bW/2;
    ctx.save();ctx.setLineDash([3,3]);
    ctx.strokeStyle=isDark?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.2)';
    ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,ch);ctx.stroke();
    ctx.restore();
  }
}

/* 绑定交互事件：缩放、拖拽、十字光标、双击重置、触摸 */
function _bindKlineEvents(state){
  const {canvas,volCanvas}=state;

  /* — 滚轮缩放 — */
  const onWheel=e=>{
    e.preventDefault();
    const rect=canvas.getBoundingClientRect();
    const mouseX=e.clientX-rect.left;
    const totalBars=state.endIdx-state.startIdx+1;
    const minBars=10;
    /* 鼠标位置对应的比例 */
    const ratio=Math.max(0,Math.min(1,(mouseX-state.mL)/(rect.width-state.mL-state.mR)));
    const zoomFactor=e.deltaY>0?1.15:0.87; /* 向下滚=缩小(看更多), 向上滚=放大 */
    let newTotal=Math.round(totalBars*zoomFactor);
    newTotal=Math.max(minBars,Math.min(state.klines.length,newTotal));
    if(newTotal===totalBars)return;
    /* 以鼠标位置为锚点 */
    const anchorIdx=state.startIdx+Math.round(ratio*totalBars);
    let newStart=anchorIdx-Math.round(ratio*newTotal);
    let newEnd=newStart+newTotal-1;
    /* 边界校正 */
    if(newStart<0){newStart=0;newEnd=newTotal-1;}
    if(newEnd>=state.klines.length){newEnd=state.klines.length-1;newStart=Math.max(0,newEnd-newTotal+1);}
    state.startIdx=newStart;state.endIdx=newEnd;
    state.hovIdx=-1;
    _redrawKline(state);
  };
  canvas.addEventListener('wheel',onWheel,{passive:false});
  if(volCanvas)volCanvas.addEventListener('wheel',onWheel,{passive:false});

  /* — 鼠标拖拽平移 — */
  const onMouseDown=e=>{
    if(e.button!==0)return;
    state.dragging=true;
    state.dragStartX=e.clientX;
    state.dragStartIdx=state.startIdx;
    state.dragEndIdx=state.endIdx;
    canvas.style.cursor='grabbing';
  };
  const onMouseMove=e=>{
    const rect=canvas.getBoundingClientRect();
    const mouseX=e.clientX-rect.left;
    const mouseY=e.clientY-rect.top;

    if(state.dragging){
      /* 拖拽逻辑 */
      const dx=e.clientX-state.dragStartX;
      const totalBars=state.dragEndIdx-state.dragStartIdx+1;
      const bW=(rect.width-state.mL-state.mR)/totalBars;
      const shift=Math.round(-dx/bW);
      let ns=state.dragStartIdx+shift;
      let ne=state.dragEndIdx+shift;
      if(ns<0){ns=0;ne=totalBars-1;}
      if(ne>=state.klines.length){ne=state.klines.length-1;ns=ne-totalBars+1;}
      if(ns!==state.startIdx||ne!==state.endIdx){
        state.startIdx=ns;state.endIdx=ne;
        state.hovIdx=-1;
        _redrawKline(state);
      }
      return;
    }

    /* 十字光标 hover */
    const bars=state._bars;
    if(!bars||bars.length===0)return;
    const bW=state._bW;
    const barIdx=Math.floor((mouseX-state.mL)/bW);
    if(barIdx>=0&&barIdx<bars.length){
      state.hovIdx=barIdx;
      state._hovY=mouseY;
      _redrawKline(state);
      _updateKlineInfo(state);
    } else if(state.hovIdx!==-1){
      state.hovIdx=-1;
      _redrawKline(state);
      _hideKlineInfo(state);
    }
  };
  const onMouseUp=()=>{
    if(state.dragging){
      state.dragging=false;
      canvas.style.cursor='crosshair';
    }
  };
  const onMouseLeave=()=>{
    state.dragging=false;
    canvas.style.cursor='crosshair';
    if(state.hovIdx!==-1){
      state.hovIdx=-1;
      _redrawKline(state);
      _hideKlineInfo(state);
    }
  };
  canvas.addEventListener('mousedown',onMouseDown);
  canvas.addEventListener('mousemove',onMouseMove);
  canvas.addEventListener('mouseup',onMouseUp);
  canvas.addEventListener('mouseleave',onMouseLeave);
  document.addEventListener('mouseup',onMouseUp);

  /* — 双击重置 — */
  canvas.addEventListener('dblclick',()=>{
    state.startIdx=0;state.endIdx=state.klines.length-1;
    state.hovIdx=-1;
    _redrawKline(state);
    _hideKlineInfo(state);
  });

  /* — 触摸支持 — */
  let touchTimer=null;
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===1){
      /* 单指拖拽 */
      state.dragging=true;
      state.dragStartX=e.touches[0].clientX;
      state.dragStartIdx=state.startIdx;
      state.dragEndIdx=state.endIdx;
      state.touchStartX=e.touches[0].clientX;
      state.touchStartStart=state.startIdx;
      state.touchStartEnd=state.endIdx;
    } else if(e.touches.length===2){
      /* 双指缩放 */
      state.dragging=false;
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      state.lastPinchDist=Math.sqrt(dx*dx+dy*dy);
      state.touchStartStart=state.startIdx;
      state.touchStartEnd=state.endIdx;
    }
  },{passive:false});

  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===1&&state.dragging){
      const dx=e.touches[0].clientX-state.touchStartX;
      const totalBars=state.touchStartEnd-state.touchStartStart+1;
      const rect=canvas.getBoundingClientRect();
      const bW=(rect.width-state.mL-state.mR)/totalBars;
      const shift=Math.round(-dx/bW);
      let ns=state.touchStartStart+shift;
      let ne=state.touchStartEnd+shift;
      if(ns<0){ns=0;ne=totalBars-1;}
      if(ne>=state.klines.length){ne=state.klines.length-1;ns=ne-totalBars+1;}
      state.startIdx=ns;state.endIdx=ne;
      state.hovIdx=-1;
      _redrawKline(state);
    } else if(e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX;
      const dy=e.touches[0].clientY-e.touches[1].clientY;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if(state.lastPinchDist===0){state.lastPinchDist=dist;return;}
      const scale=state.lastPinchDist/dist; /* pinch out = 放大 */
      const origTotal=state.touchStartEnd-state.touchStartStart+1;
      let newTotal=Math.round(origTotal*scale);
      newTotal=Math.max(10,Math.min(state.klines.length,newTotal));
      const mid=Math.round((state.touchStartStart+state.touchStartEnd)/2);
      let ns=mid-Math.round(newTotal/2);
      let ne=ns+newTotal-1;
      if(ns<0){ns=0;ne=newTotal-1;}
      if(ne>=state.klines.length){ne=state.klines.length-1;ns=Math.max(0,ne-newTotal+1);}
      state.startIdx=ns;state.endIdx=ne;
      state.hovIdx=-1;
      _redrawKline(state);
    }
  },{passive:false});

  canvas.addEventListener('touchend',e=>{
    if(e.touches.length===0){
      state.dragging=false;
      state.lastPinchDist=0;
    } else if(e.touches.length===1){
      /* 从双指回到单指 */
      state.dragging=true;
      state.touchStartX=e.touches[0].clientX;
      state.touchStartStart=state.startIdx;
      state.touchStartEnd=state.endIdx;
      state.lastPinchDist=0;
    }
  },{passive:false});
}

/* 更新浮动 OHLCV 信息栏 */
function _updateKlineInfo(state){
  const el=document.getElementById(state.infoId);
  if(!el)return;
  const bars=state._bars;
  if(!bars||state.hovIdx<0||state.hovIdx>=bars.length){_hideKlineInfo(state);return;}
  const d=bars[state.hovIdx];
  const up=d.close>=d.open;
  const clr=up?'#ef4444':'#22c55e';
  const chg=d.open?((d.close-d.open)/d.open*100).toFixed(2):'0.00';
  el.style.opacity='1';
  el.innerHTML=`<span style="color:var(--text2)">${d.date}</span>
    <span style="color:var(--text3)">开</span><span style="color:${clr}">${d.open.toFixed(2)}</span>
    <span style="color:var(--text3)">高</span><span style="color:${clr}">${d.high.toFixed(2)}</span>
    <span style="color:var(--text3)">低</span><span style="color:${clr}">${d.low.toFixed(2)}</span>
    <span style="color:var(--text3)">收</span><span style="color:${clr}">${d.close.toFixed(2)}</span>
    <span style="color:${clr}">${chg>0?'+':''}${chg}%</span>
    <span style="color:var(--text3)">量 ${((d.volume||0)/10000).toFixed(0)}万</span>`;
}
function _hideKlineInfo(state){
  const el=document.getElementById(state.infoId);
  if(el)el.style.opacity='0';
}

    <p style="font-size:13px;color:var(--text2);margin:8px 0">选择连接网关</p>

      <input type="checkbox" id="deploy-own-account" ${_deployUseOwnAccount?'checked':''} onchange="_deployUseOwnAccount=this.checked;renderDeployWizard()">

async function openDeployWizard(sid,target){
  _deploySid=sid;_deployTarget=target;_deployStep=1;
  _deployGatewayId='';_deployGatewayList=[];_deployUseOwnAccount=false;_deployAccount='';_deployPassword='';
  renderDeployWizard();
  openModal('gm');
}

async function deployWizardNext(){
  if(_deployStep===1){
    _deployStep=2;
    const res=await api('/trade/deploy-gateways?target='+encodeURIComponent(_deployTarget));
    _deployGatewayList=(res&&res.data) ? (Array.isArray(res.data)?res.data:[]) : [];
    if(_deployGatewayList.length===1)_deployGatewayId=String(_deployGatewayList[0].index);
    renderDeployWizard();
  }else if(_deployStep===2){
    if(!_deployGatewayId&&_deployGatewayList.length>0){toast('请选择网关','error');return;}
    _deployStep=3;renderDeployWizard();
  }else if(_deployStep===3){
    if(_deployUseOwnAccount){
      const acc=document.getElementById('deploy-account');const pwd=document.getElementById('deploy-password');
      if(acc)_deployAccount=acc.value;if(pwd)_deployPassword=pwd.value;
    }
    _deployStep=4;renderDeployWizard();
  }
}

function deployWizardPrev(){
  if(_deployStep>1){_deployStep--;renderDeployWizard();}
}

async function confirmDeploy(){
  if(_deployTarget==='live'){
    const cb=document.getElementById('deploy-risk-ack');
    if(!cb||!cb.checked){toast('请先勾选风险确认','error');return;}
  }
  const payload={target:_deployTarget};
  if(_deployGatewayId!=='')payload.gateway_id=_deployGatewayId;
  if(_deployUseOwnAccount&&_deployAccount){payload.gateway_account=_deployAccount;if(_deployPassword)payload.gateway_password=_deployPassword;}
  const btn=document.getElementById('deploy-confirm-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> 部署中...';}
  const d=await api('/strategy/'+_deploySid+'/deploy',{method:'POST',body:JSON.stringify(payload)});
  if(btn){btn.disabled=false;btn.innerHTML='<i class="fas fa-check"></i> 确认部署';}
  if(d&&d.code===0){
    closeModal('gm');
    toast(_deployTarget==='sim'?'已部署到模拟盘':'已部署到实盘','success');
    const s=_stList.find(x=>String(x.id)===String(_deploySid));
    if(s){s.status='running';s.params_json=s.params_json||{};s.params_json.run_env=_deployTarget;}
    rStrategy(document.getElementById('main-content'));
    const dr=document.getElementById('st-drawer');if(dr)renderDrawer(dr,_deploySid,'trade');
  }else{
    const code=d?.detail?.code;const msg=d?.detail?.message||apiErrMsg(d);
    if(code==='backtest_required')toast('请先完成回测验证','error');
    else if(code==='live_disabled')toast('实盘交易未开放，请联系管理员','error');
    else if(code==='gateway_required'||code==='gateway_unavailable')toast(msg,'error');
    else if(code==='invalid_gateway')toast('所选网关无效或不可用','error');
    else toast(msg,'error');
  }
}

    logs.push({time:'',type:'signal',msg:'策略运行中，信号将在'+envLabel+'触发时记录'});

  if(logs.length===0) logs.push({time:'',type:'info',msg:'暂无运行日志'});
  h+=`<div style="display:flex;flex-direction:column;gap:6px">`;

      <div style="flex:1"><div style="color:var(--text)">${l.msg}</div><div style="color:var(--text3);font-size:10px;margin-top:2px">${l.time}</div></div>
    </div>`;
  });
  h+=`</div>`;
  h+=`<div style="text-align:center;margin-top:16px;font-size:12px;color:var(--text3)">
    <i class="fas fa-info-circle"></i> 日志功能将在策略${envLabel}运行后自动记录所有信号和交易
  </div></div>`;
  return h;
}

/* 轮询回测详情直至完成或超时 */
async function pollBacktestResult(sid,backtestId,maxWaitMs=120000){
  const step=2000;let elapsed=0;
  while(elapsed<maxWaitMs){
    const r=await api(`/strategy/${sid}/backtest/${backtestId}`);
    // #region agent log
    if(r&&r.code===0&&r.data){fetch('http://127.0.0.1:7242/ingest/cb253309-61c4-4916-855c-4a3c1e1905a5',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hypothesisId:'H5',location:'pollBacktestResult',message:'poll_response',data:{status:r.data.status||'',elapsed},timestamp:Date.now()})}).catch(()=>{});}
    // #endregion
    if(r&&r.code===0&&r.data){
      const st=r.data.status||'completed';
      if(st==='completed')return r.data;
      if(st==='failed')throw new Error(r.data.error_detail||'回测失败');
    }
    await new Promise(x=>setTimeout(x,step));elapsed+=step;
  }
  throw new Error('回测超时，请稍后在回测历史中查看');
}

async function wsSaveStrategy(sid){

  /* 如果是个股手动输入，读取 input */
  if(targets.type==='stock'){
    const inp=document.getElementById('ws-target-input-'+sid);
    if(inp)targets.items=inp.value.split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean);

const body={name:name,logic_desc:logicDesc,logic_code:logicCode,params_json:{take_profit:tp,stop_loss:sl,indicators:_selInds,targets:targets}};
  if(sid==='new'){

      else toast('创建失败：'+msg,'error');
    }
    return;
  }
  const d=await api('/strategy/'+sid,{method:'PUT',body:JSON.stringify(body)});
  if(d&&d.code===0){
    toast('策略已保存','success');
    if(sid!=='new') stLoadStrategyVersions(sid);

    if(msg.includes('同名')||msg.includes('已存在'))toast('该策略名称已存在，请更换名称','error');

  }

    else if(s.code.startsWith(ql))prefix.push(s);
    else if(s.name.toLowerCase().includes(ql))nameMatch.push(s);
    if(exact.length+prefix.length+nameMatch.length>=20)break;
  }
  const all=[...exact,...prefix,...nameMatch];
  return all.length>0?all.slice(0,20):null;
}

async function _mktApiSearch(q){
  if(!q||q.length<1){_mktApiResults=[];_mktApiSearchQuery='';return;}
  _mktApiSearching=true;_mktApiSearchQuery=q;
  /* 先试本地过滤 */
  const local=_mktLocalSearch(q);
  if(local){
    _mktApiResults=local;
    _mktApiSearching=false;
    _mktRender(document.getElementById('main-content'),true);
    return;
  }
  /* 远程搜索 */
  try{
    const r=await api('/market/search?q='+encodeURIComponent(q)+'&limit=20');
    if(_mktApiSearchQuery!==q)return;
    _mktApiResults=r?.data||[];
    /* 缓存到本地 (首次获得数据时) */
    if(!_mktLocalStockList&&_mktApiResults.length>0){
      try{
        const fullR=await api('/market/search?q=&limit=50');
        /* 拉不到全量，就先用搜索结果 */
      }catch(e){}
    }
  }catch(e){_mktApiResults=[];}
  _mktApiSearching=false;
  _mktRender(document.getElementById('main-content'),true);
}
function _mktTriggerApiSearch(q){
  if(_mktApiSearchTimer)clearTimeout(_mktApiSearchTimer);
  if(!q||q.length<1){_mktApiResults=[];_mktApiSearchQuery='';return;}
  /* 本地缓存可即时响应 */
  const local=_mktLocalSearch(q);
  if(local){
    _mktApiResults=local;_mktApiSearching=false;
    _mktRender(document.getElementById('main-content'),true);
    return;
  }
  _mktApiSearchTimer=setTimeout(()=>_mktApiSearch(q),200);
}

  }
  /* 合并所有分组到 _mktFavorites */
  const all=new Set();Object.values(_mktFavGroups).forEach(arr=>(arr||[]).forEach(s=>all.add(s)));

}

/* --- 主入口 --- */
async function rMarket(c){
  /* 骨架屏 */
  c.innerHTML=`<div style="padding:16px"><div class="mkt-idx-bar">${'<div class="mkt-idx-item" style="opacity:.5"><div style="height:14px;width:60px;background:var(--card2);border-radius:4px;margin-bottom:6px"></div><div style="height:22px;width:100px;background:var(--card2);border-radius:4px"></div></div>'.repeat(5)}</div><div style="height:44px;background:var(--card2);border-radius:10px;margin:12px 0"></div>${'<div style="height:44px;background:var(--card2);border-radius:8px;margin-bottom:4px"></div>'.repeat(10)}</div>`;

  /* 并行加载 indices + sectors，hot 异步加载（与首页一致，避免冷启动阻塞） */
  window._mktData.hot=[];
  const [idxRes,secRes]=await Promise.all([
    api('/market/indices'),
    api('/market/sectors'),
  ]);
  maybeTriggerWarmupIfStale(idxRes);
  maybeTriggerWarmupIfStale(secRes);
  window._mktData.indices=idxRes?.data||[];
  window._mktData.sectors=secRes?.data||[];

  _mktRender(c);

  /* hot 异步加载：用 fetch 避免 401 触发 doLogout */
  (function(){const hd={'Content-Type':'application/json'};if(TK)hd['Authorization']='Bearer '+TK;fetch(API+'/market/hot',{headers:hd}).then(r=>r.json()).then(r=>{maybeTriggerWarmupIfStale(r);const list=r?.data||r?.items||[];if(r&&r.code===0&&list.length>0){window._mktData.hot=list;if(CUR==='market'){const mc=document.getElementById('main-content');if(mc)_mktRender(mc,true);}}}).catch(()=>{});})();
  /* 排行 Tab 默认展示，首屏必须请求一次 /market/ranking，否则仅依赖 30s 轮询会一直无数据 */
  (function(){const hd={'Content-Type':'application/json'};if(TK)hd['Authorization']='Bearer '+TK;fetch(API+'/market/ranking?sort_by=change_pct&order=desc&limit=30',{headers:hd}).then(r=>r.json()).then(r=>{const list=r?.data||r?.items||[];if(r&&r.code===0&&list.length>0){window._mktData.ranking=list;if(CUR==='market'){const mc=document.getElementById('main-content');if(mc)_mktRender(mc,true);}}}).catch(()=>{});})();
  /* 自动刷新 30s */
  if(_mktRefreshTimer)clearInterval(_mktRefreshTimer);
  _mktRefreshTimer=setInterval(async()=>{
    if(CUR!=='market'){clearInterval(_mktRefreshTimer);return;}
    const fetches=[api('/market/indices')];
    /* 排行 Tab 刷新 */
    if(_mktTab==='ranking')fetches.push(api('/market/ranking?sort_by=change_pct&order=desc&limit=30'));
    /* 龙虎榜/机构持仓 Tab 也同步刷新 */
    if(_mktTab==='lhb'&&_mktLhbLoaded)fetches.push(api('/market/lhb?days=3'));
    if(_mktTab==='institutional'&&_mktInstLoaded)fetches.push(api('/market/institutional?market=北向&indicator=今日排行'));
    const results=await Promise.all(fetches);
    maybeTriggerWarmupIfStale(results[0]);
    if(_mktTab==='ranking'&&results[1])maybeTriggerWarmupIfStale(results[1]);
    if(results[0]?.data)window._mktData.indices=results[0].data;
    let idx=1;
    if(_mktTab==='ranking'&&results[idx]?.data){window._mktData.ranking=results[idx].data;idx++;}
    if(_mktTab==='lhb'&&_mktLhbLoaded&&results[idx]?.data){window._mktData.lhb=results[idx].data;idx++;}
    if(_mktTab==='institutional'&&_mktInstLoaded&&results[idx]?.data){window._mktData.institutional=results[idx].data;}
    _mktRender(document.getElementById('main-content'),true);
  },30000);
}

/* --- 格式化辅助 --- */
function _mktFmtVol(n){if(!n||isNaN(n))return '-';n=Number(n);if(Math.abs(n)>=100000000)return(n/100000000).toFixed(2)+'亿';if(Math.abs(n)>=10000)return(n/10000).toFixed(1)+'万';return n.toLocaleString();}
function _mktFmtPrice(n){if(!n||isNaN(n))return '-';return Number(n).toFixed(2);}
function _mktChgColor(v){return v>=0?'var(--red)':'var(--green)';}
function _mktChgBg(v){return v>=0?'var(--red-bg)':'var(--green-bg)';}
function _mktChgSign(v){return v>=0?'+'+Number(v).toFixed(2)+'%':Number(v).toFixed(2)+'%';}

/* --- 热力图颜色 --- */
function _mktHeatColor(pct){
  if(pct>=4)return 'linear-gradient(135deg,#b91c1c,#dc2626)';
  if(pct>=2)return 'linear-gradient(135deg,#dc2626,#ef4444)';
  if(pct>=0.5)return 'linear-gradient(135deg,#ef4444,#f87171)';
  if(pct>=-0.5)return 'linear-gradient(135deg,#6b7280,#9ca3af)';
  if(pct>=-2)return 'linear-gradient(135deg,#34d399,#10b981)';
  if(pct>=-4)return 'linear-gradient(135deg,#10b981,#059669)';
  return 'linear-gradient(135deg,#059669,#047857)';
}

/* --- 搜索匹配 (支持拼音首字母) --- */
function _mktMatchSearch(item,q){
  if(!q)return true;
  q=q.toLowerCase();
  const name=(item.name||'').toLowerCase();
  const code=(item.symbol||item.code||'').toLowerCase();
  if(name.includes(q)||code.includes(q))return true;
  /* 拼音首字母 */
  const py=_PINYIN_MAP[item.name]||'';
  if(py&&py.includes(q))return true;
  return false;
}

/* --- 股票表格渲染 --- */
function _mktRenderStockTable(data,source){
  let list=data||[];
  if(_mktSearch)list=list.filter(s=>_mktMatchSearch(s,_mktSearch));

  /* 排序 */
  if(_mktSort){
    const dir=_mktSortDir==='desc'?-1:1;
    list=[...list].sort((a,b)=>{
      const va=a[_mktSort]||0,vb=b[_mktSort]||0;
      return (va-vb)*dir;
    });
  }

  if(list.length===0){
    /* 本地无结果 → 显示 API 全市场搜索结果 */
    if(_mktSearch&&_mktApiResults.length>0){
      let ah=`<div class="card" style="padding:16px"><div style="font-weight:600;margin-bottom:12px;color:var(--primary)"><i class="fas fa-globe"></i> 全市场搜索结果 (${_mktApiResults.length})</div>`;
      ah+=`<div style="display:grid;gap:6px">`;
      _mktApiResults.forEach(s=>{
        const code=s.code||s.symbol||'';
        const name=s.name||'';
        const isFav=_mktFavorites.includes(code);
        ah+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card2);border-radius:8px;cursor:pointer;transition:background .15s" onmouseover="this.style.background='var(--primary-bg)'" onmouseout="this.style.background='var(--card2)'" onclick="goStockDetail('${code}','${name}')">`;
        ah+=`<div style="font-weight:700;color:var(--primary);font-family:var(--font-num);min-width:70px">${code}</div>`;
        ah+=`<div style="flex:1;font-weight:500">${name}</div>`;
        ah+=`<button class="btn btn-sm btn-ghost" style="color:${isFav?'var(--orange)':'var(--text3)'}" onclick="event.stopPropagation();_mktToggleFav('${code}')"><i class="fas fa-star"></i></button>`;
        ah+=`</div>`;
      });
      ah+=`</div></div>`;
      return ah;
    }
    if(_mktSearch&&_mktApiSearching){
      return `<div class="card" style="text-align:center;padding:40px"><i class="fas fa-spinner fa-spin" style="font-size:24px;color:var(--primary);display:block;margin-bottom:12px"></i><p style="color:var(--text2)">正在搜索全市场...</p></div>`;
    }
    return `<div class="card" style="text-align:center;padding:40px"><i class="fas ${_mktSearch?'fa-search':'fa-database'}" style="font-size:32px;opacity:.12;display:block;margin-bottom:12px"></i><p style="color:var(--text2)">${_mktSearch?'没有找到匹配结果':'暂无实时行情数据'}</p>${_mktSearch?'':'<p style="font-size:12px;color:var(--text3);margin-top:4px">请检查数据源配置或到管理后台「配置中心 → 数据拉取」执行全量同步</p>'}</div>`;
  }

  let h=`<div class="mkt-list-wrap"><table class="mkt-table"><thead><tr>`;
  /* 表头列 */
  const cols=[
    {k:'name',l:'名称',align:'left',sort:false},
    {k:'price',l:'最新价',align:'right',sort:true},
    {k:'change_pct',l:'涨跌幅',align:'right',sort:true},
    {k:'change_amt',l:'涨跌额',align:'right',sort:true},
    {k:'volume',l:'成交量',align:'right',sort:true},
    {k:'turnover',l:'成交额',align:'right',sort:true},
    {k:'turnover_rate',l:'换手率',align:'right',sort:true},
    {k:'fav',l:'',align:'center',sort:false},
  ];
  cols.forEach(col=>{
    const sorted=_mktSort===col.k;
    const arrow=sorted?(_mktSortDir==='desc'?'▼':'▲'):'⇅';
    if(col.k==='fav'){
      h+=`<th style="width:36px"><i class="fas fa-star" style="font-size:10px;color:var(--text3)"></i></th>`;
    } else if(col.sort){
      h+=`<th class="${sorted?'sorted':''}" style="text-align:${col.align}" onclick="_mktSetSort('${col.k}')">${col.l} <span class="sort-arrow">${arrow}</span></th>`;
    } else {
      h+=`<th style="text-align:${col.align}">${col.l}</th>`;
    }
  });
  h+=`</tr></thead><tbody>`;

  list.forEach(s=>{
    const chg=s.change_pct||0;const up=chg>=0;const sym=s.symbol||s.code||'';const isFav=_mktFavorites.includes(sym);

    h+=`</tr>`;
  });

  h+=`</tbody></table></div>`;
  return h;
}

/* --- 板块/概念 Tab (热力图 + 列表) --- */
function _mktRenderSectorTab(type){
  const all=window._mktData.sectors||[];
  let items=all.filter(s=>s.type===type);
  if(_mktSearch)items=items.filter(s=>_mktMatchSearch(s,_mktSearch));

  /* 排序: 按涨跌幅绝对值从大到小 */
  items=[...items].sort((a,b)=>Math.abs(b.change_pct||0)-Math.abs(a.change_pct||0));

  let h='';
  /* 热力图 */
  if(items.length>0&&!_mktSearch){
    h+=`<div style="font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px"><i class="fas fa-th-large" style="color:var(--primary)"></i> ${type==='industry'?'行业板块':'概念板块'}热力图</div>`;
    h+=`<div class="mkt-heatmap">`;
    items.forEach(s=>{
      const bg=_mktHeatColor(s.change_pct||0);
      h+=`<div class="mkt-hm-cell" style="background:${bg}" onclick="goSectorDetail('${s.code}','${(s.name||'').replace(/'/g,"\\'")}','${s.type||type}')">`;
      h+=`<div class="hm-name">${s.name}</div>`;
      h+=`<div class="hm-pct">${_mktChgSign(s.change_pct)}</div>`;
      if(s.leader)h+=`<div class="hm-leader">${s.leader} ${_mktChgSign(s.leader_pct)}</div>`;
      h+=`</div>`;
    });
    h+=`</div>`;
  }

  /* 板块列表 */
  h+=`<div style="font-size:13px;font-weight:600;margin:12px 0 8px;display:flex;align-items:center;gap:6px"><i class="fas fa-list" style="color:var(--primary)"></i> 板块排行</div>`;
  if(items.length===0){
    h+=`<div class="card" style="text-align:center;padding:30px;color:var(--text3)"><i class="fas fa-layer-group" style="font-size:24px;display:block;margin-bottom:8px;opacity:.3"></i>${_mktSearch?'没有匹配结果':'暂无板块数据'}<p style="font-size:11px;margin-top:6px;opacity:.6">若持续为空，请到管理后台「配置中心 → 数据拉取」执行全量同步</p></div>`;
  } else {
    h+=`<div class="mkt-list-wrap"><table class="mkt-table"><thead><tr>`;
    h+=`<th style="text-align:left">板块名称</th><th style="text-align:right">涨跌幅</th><th style="text-align:right">成交额</th><th style="text-align:left">领涨股</th><th style="text-align:right">领涨幅</th>`;
    h+=`</tr></thead><tbody>`;
    items.forEach(s=>{
      const chg=s.change_pct||0;
      h+=`<tr onclick="goSectorDetail('${s.code}','${(s.name||'').replace(/'/g,"\\'")}','${s.type||type}')">`;
      h+=`<td><div class="col-name">${s.name}</div><div class="col-code">${s.code}</div></td>`;
      h+=`<td style="text-align:right"><span class="col-pct" style="background:${_mktChgBg(chg)};color:${_mktChgColor(chg)}">${_mktChgSign(chg)}</span></td>`;
      h+=`<td class="col-num">${_mktFmtVol(s.turnover)}</td>`;
      h+=`<td style="font-size:12px">${s.leader||'-'}</td>`;
      h+=`<td class="col-num" style="color:${_mktChgColor(s.leader_pct||0)}">${s.leader_pct!=null?_mktChgSign(s.leader_pct):'-'}</td>`;
      h+=`</tr>`;

  }
  return h;
}

function _mktToggleFav(sym){

  const arr=_mktFavGroups[group];
  const idx=arr.indexOf(sym);
  if(idx>=0){arr.splice(idx,1);toast('已从"'+group+'"移出','success');}
  else{arr.push(sym);toast('已加入"'+group+'"','success');}

}

function _mktAddFavGroup(){

/* --- 详情抽屉 --- */
async function _mktShowDrawer(sym){
  const drawer=document.getElementById('mkt-drawer');const overlay=document.getElementById('mkt-drawer-overlay');
  if(!drawer)return;
  drawer.innerHTML=`<div style="text-align:center;padding:60px"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--text3)"></i></div>`;
  drawer.classList.add('open');overlay.classList.add('open');

  /* 查找本地缓存的数据 */
  const local=[...window._mktData.hot,...window._mktData.sectors].find(s=>(s.symbol||s.code)===sym);
  const [q,dep]=await Promise.all([
    api('/market/quote?symbol='+encodeURIComponent(sym)),
    ROLE!=='beginner'?api('/market/depth?symbol='+encodeURIComponent(sym)):Promise.resolve(null)
  ]);
  const qd=q?.data||{};const dd=dep?.data||{};
  const price=qd.price||local?.price||0;
  const chg=qd.change||local?.change_pct||0;const up=chg>=0;
  const name=local?.name||SYM_NAMES[sym]||qd.name||sym;

  let d=`<div class="d-header"><div><div style="font-size:20px;font-weight:700">${name}</div><div style="font-size:12px;color:var(--text3);font-family:var(--font-num);margin-top:2px">${sym}</div></div>`;
  d+=`<button style="border:none;background:var(--card2);width:32px;height:32px;border-radius:8px;cursor:pointer;color:var(--text3)" onclick="_mktCloseDrawer()"><i class="fas fa-times"></i></button></div>`;

  d+=`<div class="d-body">`;
  /* 大价格 */
  d+=`<div style="margin-bottom:12px"><div class="d-price" style="color:${_mktChgColor(chg)}">¥${_mktFmtPrice(price)}</div>`;
  d+=`<div style="margin-top:4px"><span class="d-chg-tag" style="background:${_mktChgBg(chg)};color:${_mktChgColor(chg)}">${_mktChgSign(chg)}</span>`;
  if(local?.change_amt!=null)d+=` <span style="font-size:12px;color:${_mktChgColor(chg)};font-family:var(--font-num);margin-left:6px">${chg>=0?'+':''}${_mktFmtPrice(local.change_amt)}</span>`;
  d+=`</div></div>`;

  /* K线 Canvas */
  if(ROLE!=='beginner'){
    d+=`<div style="margin-bottom:14px"><div style="display:flex;gap:6px;margin-bottom:6px">`;
    ['分时','日K','周K','月K'].forEach((t,i)=>{d+=`<span style="font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;${i===1?'background:var(--primary-bg);color:var(--primary)':'color:var(--text3)'}">${t}</span>`;});
    d+=`</div><canvas id="mkt-kline" width="400" height="180" style="width:100%;border-radius:8px;background:var(--card2)"></canvas></div>`;
  } else {
    d+=`<div style="padding:16px;background:var(--card2);border-radius:8px;margin-bottom:14px;text-align:center"><div style="font-size:48px;margin-bottom:8px">${up?'📈':'📉'}</div>`;
    d+=`<div style="font-size:14px;color:var(--text2)">${up?'今日上涨，行情不错':'今日下跌，别着急'}</div></div>`;
  }

  /* 基本面 4格 */
  d+=`<div class="d-grid">`;
  [{l:'开盘',v:qd.open||price*0.99,fmt:'price'},{l:'最高',v:qd.high||price*1.01,fmt:'price'},{l:'最低',v:qd.low||price*0.98,fmt:'price'},{l:'成交量',v:local?.volume||qd.volume||0,fmt:'vol'}].forEach(item=>{
    d+=`<div class="d-grid-item"><div class="gi-label">${item.l}</div><div class="gi-val">${item.fmt==='vol'?_mktFmtVol(item.v):'¥'+_mktFmtPrice(item.v)}</div></div>`;
  });
  d+=`</div>`;

  /* 更多数据 (进阶+) */
  if(ROLE!=='beginner'&&local){
    d+=`<div class="d-grid">`;
    [{l:'成交额',v:local.turnover,fmt:'vol'},{l:'换手率',v:local.turnover_rate,fmt:'pct'},{l:'市盈率',v:local.pe,fmt:'num'},{l:'总市值',v:local.market_cap,fmt:'cap'}].forEach(item=>{
      let vStr='-';
      if(item.fmt==='vol')vStr=_mktFmtVol(item.v);
      else if(item.fmt==='pct')vStr=item.v!=null?Number(item.v).toFixed(2)+'%':'-';
      else if(item.fmt==='cap')vStr=item.v!=null?Number(item.v).toFixed(0)+'亿':'-';
      else if(item.fmt==='num')vStr=item.v!=null?Number(item.v).toFixed(1):'-';
      d+=`<div class="d-grid-item"><div class="gi-label">${item.l}</div><div class="gi-val">${vStr}</div></div>`;
    });
    d+=`</div>`;
  }

  /* 5档盘口 (进阶+) */
  if(ROLE!=='beginner'&&(dd.asks||dd.bids)){
    const asks=(dd.asks||[]).slice(0,5).reverse();
    const bids=(dd.bids||[]).slice(0,5);
    const maxVol=Math.max(...[...asks,...bids].map(x=>x[1]||0),1);
    d+=`<div style="margin:14px 0"><div style="font-size:13px;font-weight:600;margin-bottom:8px"><i class="fas fa-layer-group" style="color:var(--primary)"></i> 五档盘口</div>`;
    /* 卖盘 (从卖5到卖1) */
    asks.forEach((a,i)=>{
      const pct=((a[1]||0)/maxVol*100);

async function _mktDrawKline(id,basePrice,sym){
  const canvas=document.getElementById(id);if(!canvas)return;const ctx=canvas.getContext('2d');
  const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);
  /* 尝试从 API 获取真实 K 线数据 */
  let bars=[];
  if(sym){
    try{
      const resp=await api('/market/kline?symbol='+encodeURIComponent(sym)+'&period=daily&limit=30');
      const kdata=resp?.data||resp||[];
      if(Array.isArray(kdata)&&kdata.length>0){
        bars=kdata.map(k=>({o:Number(k.open||0),c:Number(k.close||0),h:Number(k.high||0),l:Number(k.low||0)}));
      }
    }catch(e){console.warn('kline api error:',e);}
  }
  /* 无真实数据时使用估算 */
  if(bars.length===0){
    let p=basePrice*0.95;
    for(let i=0;i<30;i++){const o=p;const c=o*(1+(Math.random()-0.48)*0.04);const hi=Math.max(o,c)*(1+Math.random()*0.015);const lo=Math.min(o,c)*(1-Math.random()*0.015);bars.push({o,c,h:hi,l:lo});p=c;}
  }
  const allP=bars.flatMap(b=>[b.h,b.l]);const minP=Math.min(...allP);const maxP=Math.max(...allP);const range=maxP-minP||1;
  const barW=W/bars.length*0.7;const gap=W/bars.length*0.3;
  /* 网格线 */
  ctx.strokeStyle='rgba(148,163,184,.1)';ctx.lineWidth=0.5;
  for(let i=0;i<4;i++){const y=H*0.05+H*0.9/3*i;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  bars.forEach((b,i)=>{
    const x=i*(barW+gap)+gap/2;const up=b.c>=b.o;ctx.fillStyle=up?'#ef4444':'#22c55e';ctx.strokeStyle=ctx.fillStyle;
    const cx=x+barW/2;ctx.beginPath();ctx.moveTo(cx,H-(b.h-minP)/range*H*0.9-H*0.05);ctx.lineTo(cx,H-(b.l-minP)/range*H*0.9-H*0.05);ctx.lineWidth=1;ctx.stroke();
    const top=H-(Math.max(b.o,b.c)-minP)/range*H*0.9-H*0.05;const bot=H-(Math.min(b.o,b.c)-minP)/range*H*0.9-H*0.05;
    ctx.fillRect(x,top,barW,Math.max(bot-top,1));
  });
  /* 均线 MA5 */
  ctx.beginPath();ctx.strokeStyle='rgba(245,158,11,.6)';ctx.lineWidth=1.5;
  for(let i=4;i<bars.length;i++){
    const avg=(bars[i-4].c+bars[i-3].c+bars[i-2].c+bars[i-1].c+bars[i].c)/5;
    const x=i*(barW+gap)+gap/2+barW/2;const y=H-(avg-minP)/range*H*0.9-H*0.05;
    if(i===4)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

  /* 并行请求数据，最多等 2.8 秒即用已有数据渲染（与行情页一致：有什么用什么，不卡住） */
  const quoteUrl='/market/quote?symbol='+encodeURIComponent(_sdSymbol)+(_sdQuoteRefresh?'&refresh=1':'');
  if(_sdQuoteRefresh)_sdQuoteRefresh=false;
  const _sdOut = { 0: null, 1: null, 2: null, 3: null, 4: null };
  const _sdSet = (i, v) => { _sdOut[i] = v; };
  const _sdP0 = api(quoteUrl).then(r => { _sdSet(0, r); return r; });
  const _sdP1 = (ROLE !== 'beginner' ? api('/market/depth?symbol=' + encodeURIComponent(_sdSymbol)) : Promise.resolve(null)).then(r => { _sdSet(1, r); return r; });
  const _sdP2 = api('/market/kline?symbol=' + encodeURIComponent(_sdSymbol) + '&period=' + _sdKlinePeriod + '&count=80').then(r => { _sdSet(2, r); return r; });

  const _sdP4 = api('/market/fundamental?symbol=' + encodeURIComponent(_sdSymbol)).then(r => { _sdSet(4, r); return r; });
  await Promise.race([
    Promise.all([_sdP0, _sdP1, _sdP2, _sdP3, _sdP4]),

/* 图表类型切换 — 只加载需要的数据，仅更新图表区 */
async function _sdSwitchChart(type){
  const prevType=_sdChartType,prevPeriod=_sdKlinePeriod;
  if(type==='minute'){_sdChartType='minute';}
  else if(type==='5day'){_sdChartType='5day';}
  else if(type==='kline'){_sdChartType='kline';_sdKlinePeriod='daily';}
  else if(type==='kline_weekly'){_sdChartType='kline';_sdKlinePeriod='weekly';}
  else if(type==='kline_monthly'){_sdChartType='kline';_sdKlinePeriod='monthly';}
  else if(type.endsWith('min')){_sdChartType='kline';_sdKlinePeriod=type;}
  _sdZoom={startIdx:0,endIdx:-1};
  const needsFetch=_sdChartType!==prevType||_sdKlinePeriod!==prevPeriod;
  if(needsFetch&&_sdSymbol){
    if(_sdChartType==='minute'){
      const r=await api('/market/minute?symbol='+encodeURIComponent(_sdSymbol)+'&count=240&days=1');
      if(r?.data)_sdMinuteData=r.data;
    } else if(_sdChartType==='5day'){
      const r=await api('/market/minute?symbol='+encodeURIComponent(_sdSymbol)+'&count=240&days=5');
      if(r?.data)_sdMinuteData=r.data;
    } else {
      const r=await api('/market/kline?symbol='+encodeURIComponent(_sdSymbol)+'&period='+_sdKlinePeriod+'&count=120');
      if(r?.data)_sdKlineData=r.data;
    }
  }
  const card=document.getElementById('sd-chart-card');
  if(card){card.outerHTML=_sdRenderChartCard();setTimeout(()=>_sdDrawChart(),50);}
  else rStockDetail(document.getElementById('main-content'));
}

/* 技术指标渲染 */
function _sdRenderTechIndicators(){
  const bars=(_sdKlineData?.bars||[]);
  if(bars.length<5)return `<div style="text-align:center;padding:24px;color:var(--text3)">数据不足，无法计算技术指标</div>`;
  const closes=bars.map(b=>b.close);
  const ma=(n)=>{const s=closes.slice(-n);return s.length>=n?(s.reduce((a,b)=>a+b,0)/n).toFixed(2):'-';};
  const last=closes[closes.length-1];
  const prev=closes[closes.length-2]||last;
  const rsi=(n)=>{
    let gains=0,losses=0;
    for(let i=closes.length-n;i<closes.length;i++){
      const d=closes[i]-(closes[i-1]||closes[i]);
      if(d>0)gains+=d;else losses-=d;
    }
    const rs=losses===0?100:gains/losses;
    return (100-100/(1+rs)).toFixed(1);
  };
  /* MACD */
  let dif='-',dea='-',macdVal='-',macdSignal='';
  if(closes.length>=26){
    const ema=(n)=>{let e=closes[0];const k=2/(n+1);for(let i=1;i<closes.length;i++)e=closes[i]*k+e*(1-k);return e;};
    const emaArr=(n)=>{const arr=[closes[0]];const k=2/(n+1);for(let i=1;i<closes.length;i++)arr.push(closes[i]*k+arr[i-1]*(1-k));return arr;};
    const e12=emaArr(12),e26=emaArr(26);
    const difArr=e12.map((v,i)=>v-e26[i]);
    const deaArr=[difArr[0]];const dk=2/10;
    for(let i=1;i<difArr.length;i++)deaArr.push(difArr[i]*dk+deaArr[i-1]*(1-dk));
    dif=difArr[difArr.length-1].toFixed(3);
    dea=deaArr[deaArr.length-1].toFixed(3);
    macdVal=((difArr[difArr.length-1]-deaArr[deaArr.length-1])*2).toFixed(3);
    const prevDif=difArr.length>=2?difArr[difArr.length-2]:0;
    const prevDea=deaArr.length>=2?deaArr[deaArr.length-2]:0;
    if(prevDif<=prevDea&&difArr[difArr.length-1]>deaArr[deaArr.length-1])macdSignal='🔺 金叉';
    else if(prevDif>=prevDea&&difArr[difArr.length-1]<deaArr[deaArr.length-1])macdSignal='🔻 死叉';
  }

  /* KDJ */
  let kVal='-',dVal='-',jVal='-',kdjSignal='';
  if(bars.length>=9){
    let kk=50,dd=50;
    for(let i=8;i<bars.length;i++){
      const h9=Math.max(...bars.slice(i-8,i+1).map(b=>b.high));
      const l9=Math.min(...bars.slice(i-8,i+1).map(b=>b.low));
      const rsv=h9===l9?50:(bars[i].close-l9)/(h9-l9)*100;
      kk=2/3*kk+1/3*rsv;dd=2/3*dd+1/3*kk;
    }
    const jj=3*kk-2*dd;
    kVal=kk.toFixed(1);dVal=dd.toFixed(1);jVal=jj.toFixed(1);
    if(kk>80&&dd>80)kdjSignal='⚠️ 超买区';
    else if(kk<20&&dd<20)kdjSignal='💡 超卖区';
  }

  /* BOLL */
  let bollUp='-',bollMid='-',bollDn='-';
  if(closes.length>=20){
    const s20=closes.slice(-20);
    const avg=s20.reduce((a,b)=>a+b,0)/20;
    const std=Math.sqrt(s20.reduce((a,b)=>a+(b-avg)**2,0)/20);
    bollMid=avg.toFixed(2);bollUp=(avg+2*std).toFixed(2);bollDn=(avg-2*std).toFixed(2);
  }

  /* EMA 计算 */
  const emaCalc=(n)=>{
    if(closes.length<2)return '-';
    const k=2/(n+1);let e=closes[0];
    for(let i=1;i<closes.length;i++)e=closes[i]*k+e*(1-k);
    return e.toFixed(2);
  };

  let h=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px">`;
  const items=[
    {l:'MA5',v:ma(5)},{l:'MA10',v:ma(10)},{l:'MA20',v:ma(20)},{l:'MA60',v:ma(60)},
    {l:'EMA5',v:emaCalc(5)},{l:'EMA10',v:emaCalc(10)},{l:'EMA20',v:emaCalc(20)},{l:'EMA30',v:emaCalc(30)},{l:'EMA60',v:emaCalc(60)},
    {l:'RSI(14)',v:rsi(14),tag:Number(rsi(14))>70?'超买':Number(rsi(14))<30?'超卖':''},
    {l:'涨跌幅',v:((last-prev)/prev*100).toFixed(2)+'%'},
    {l:'振幅',v:bars.length>0?((bars[bars.length-1].high-bars[bars.length-1].low)/prev*100).toFixed(2)+'%':'-'},
    {l:'最新收盘',v:'¥'+last.toFixed(2)},
    {l:'MACD-DIF',v:dif},{l:'MACD-DEA',v:dea},{l:'MACD',v:macdVal,tag:macdSignal},
    {l:'KDJ-K',v:kVal},{l:'KDJ-D',v:dVal},{l:'KDJ-J',v:jVal,tag:kdjSignal},
    {l:'BOLL上轨',v:bollUp},{l:'BOLL中轨',v:bollMid},{l:'BOLL下轨',v:bollDn},
  ];
  items.forEach(item=>{
    h+=`<div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--card2);border-radius:8px;font-size:12px"><span style="color:var(--text3)">${item.l}</span><span style="font-weight:600;font-family:var(--font-num)">${item.v}${item.tag?' <span style=\"font-size:10px;color:var(--orange)\">' +item.tag+'</span>':''}</span></div>`;
  });
  h+=`</div>`;
  return h;
}

/* --- 资讯/公告 Tab --- */
let _sdNewsLoading=false;
async function _sdLoadNews(){
  if(_sdNewsLoading||!_sdSymbol)return;
  _sdNewsLoading=true;
  /* 15 秒超时, 防止无限 loading */
  const _newsTimeout=setTimeout(()=>{
    if(_sdNewsLoading){_sdNewsLoading=false;_sdNewsData=[];
      const el=document.getElementById('sd-bottom-content');
      if(el)el.innerHTML='<div style="text-align:center;padding:24px;color:var(--text3)"><i class="fas fa-exclamation-circle" style="font-size:24px;margin-bottom:8px;display:block"></i>资讯加载超时，请稍后重试</div>';
    }
  },15000);
  try{
    const r=await api('/market/news?symbol='+encodeURIComponent(_sdSymbol));
    _sdNewsData=r?.data||[];
  }catch(e){_sdNewsData=[];}
  clearTimeout(_newsTimeout);
  _sdNewsLoading=false;
  const el=document.getElementById('sd-bottom-content');
  if(el)el.innerHTML=_sdRenderNewsTab();
}

function _sdRenderNewsTab(){
  if(!_sdNewsData&&!_sdNewsLoading){_sdLoadNews();return `<div style="text-align:center;padding:24px"><i class="fas fa-spinner fa-spin" style="font-size:20px;opacity:.5"></i><p style="color:var(--text2);margin-top:8px">正在加载资讯...</p></div>`;}
  if(_sdNewsLoading)return `<div style="text-align:center;padding:24px"><i class="fas fa-spinner fa-spin" style="font-size:20px;opacity:.5"></i><p style="color:var(--text2);margin-top:8px">正在加载资讯...</p></div>`;
  const items=_sdNewsData||[];
  if(items.length===0)return `<div style="text-align:center;padding:24px;color:var(--text3)"><i class="fas fa-newspaper" style="font-size:24px;margin-bottom:8px;display:block"></i>暂无资讯数据</div>`;
  let h='<div style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto">';
  items.forEach(n=>{
    h+=`<div style="padding:10px 12px;background:var(--card2);border-radius:8px;cursor:pointer;transition:background .15s" onmouseover="this.style.background='var(--primary-bg)'" onmouseout="this.style.background='var(--card2)'"${n.url?' onclick="window.open(\''+n.url.replace(/'/g,"\\'")+"','_blank')\"":''}>`;
    h+=`<div style="font-weight:500;font-size:13px;margin-bottom:4px;line-height:1.4">${n.title||'无标题'}</div>`;
    if(n.content)h+=`<div style="font-size:11px;color:var(--text3);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${n.content}</div>`;
    h+=`<div style="display:flex;gap:8px;margin-top:4px;font-size:10px;color:var(--text3)">`;
    if(n.date)h+=`<span><i class="fas fa-clock"></i> ${n.date}</span>`;
    if(n.source)h+=`<span><i class="fas fa-newspaper"></i> ${n.source}</span>`;
    h+=`</div></div>`;
  });
  h+='</div>';
  return h;
}

/* ===== 个股详情图表绘制 (支持缩放/拖拽) ===== */
let _sdDragging=false,_sdDragStartX=0,_sdDragStartIdx=0,_sdDragEndIdx=0;

function _sdDrawChart(){
  const cv=document.getElementById('sd-chart');if(!cv)return;
  const volCv=document.getElementById('sd-vol');
  const dpr=window.devicePixelRatio||1;
  const rc=cv.parentElement.getBoundingClientRect();
  const W=rc.width-24;const H=380;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  const dk=document.documentElement.classList.contains('dark');
  const gc=dk?'rgba(148,163,184,.1)':'rgba(0,0,0,.06)';
  const tc=dk?'#94a3b8':'#64748b';

  if(_sdChartType==='minute'||_sdChartType==='5day'){
    _sdDrawMinuteChart(ctx,W,H,gc,tc);
  } else {
    _sdDrawKlineChart(ctx,W,H,gc,tc);
  }

  /* 副图区域 */
  if(volCv){
    const vW=W;const vH=(_sdChartType==='kline')?116:56;
    volCv.width=vW*dpr;volCv.height=vH*dpr;volCv.style.width=vW+'px';volCv.style.height=vH+'px';
    const vCtx=volCv.getContext('2d');vCtx.scale(dpr,dpr);
    if(_sdChartType!=='kline'||_sdSubChartMode==='vol'){
      _sdDrawVolumeChart(vCtx,vW,vH,gc,tc);
    } else if(_sdSubChartMode==='kdj'){
      _sdDrawKDJChart(vCtx,vW,vH,gc,tc);
    } else if(_sdSubChartMode==='macd'){
      _sdDrawMACDChart(vCtx,vW,vH,gc,tc);
    } else if(_sdSubChartMode==='rsi'){
      _sdDrawRSIChart(vCtx,vW,vH,gc,tc);
    }
  }

  /* 绑定缩放/拖拽/十字光标事件 (只绑一次) */
  if(!cv._sdEventsBound){
    cv._sdEventsBound=true;
    const mL=55,mR=20;
    /* 滚轮缩放 */
    cv.addEventListener('wheel',e=>{
      e.preventDefault();
      const allBars=_sdChartType==='minute'||_sdChartType==='5day'?(_sdMinuteData?.bars||[]):(_sdKlineData?.bars||[]);
      if(allBars.length<2)return;
      let s=_sdZoom.startIdx,en=_sdZoom.endIdx<0?allBars.length-1:_sdZoom.endIdx;
      const total=en-s+1;const minBars=10;
      const rect=cv.getBoundingClientRect();
      const mouseX=e.clientX-rect.left;
      const ratio=Math.max(0,Math.min(1,(mouseX-mL)/(rect.width-mL-mR)));
      const factor=e.deltaY>0?1.15:0.87;
      let newTotal=Math.round(total*factor);
      newTotal=Math.max(minBars,Math.min(allBars.length,newTotal));
      if(newTotal===total)return;
      const anchor=s+Math.round(ratio*total);
      let ns=anchor-Math.round(ratio*newTotal);
      let ne=ns+newTotal-1;
      if(ns<0){ns=0;ne=newTotal-1;}
      if(ne>=allBars.length){ne=allBars.length-1;ns=Math.max(0,ne-newTotal+1);}
      _sdZoom.startIdx=ns;_sdZoom.endIdx=ne;
      _sdDrawChart();
    },{passive:false});
    /* 拖拽平移 */
    cv.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      _sdDragging=true;_sdDragStartX=e.clientX;
      _sdDragStartIdx=_sdZoom.startIdx;
      const allBars=_sdChartType==='minute'||_sdChartType==='5day'?(_sdMinuteData?.bars||[]):(_sdKlineData?.bars||[]);
      _sdDragEndIdx=_sdZoom.endIdx<0?allBars.length-1:_sdZoom.endIdx;
      cv.style.cursor='grabbing';
    });
    cv.addEventListener('mousemove',e=>{
      if(_sdDragging){
        const allBars=_sdChartType==='minute'||_sdChartType==='5day'?(_sdMinuteData?.bars||[]):(_sdKlineData?.bars||[]);
        const rect=cv.getBoundingClientRect();
        const total=_sdDragEndIdx-_sdDragStartIdx+1;
        const bW=(rect.width-mL-mR)/total;
        const shift=Math.round(-(e.clientX-_sdDragStartX)/bW);
        let ns=_sdDragStartIdx+shift;let ne=_sdDragEndIdx+shift;
        if(ns<0){ns=0;ne=total-1;}
        if(ne>=allBars.length){ne=allBars.length-1;ns=ne-total+1;}
        if(ns!==_sdZoom.startIdx||ne!==_sdZoom.endIdx){
          _sdZoom.startIdx=ns;_sdZoom.endIdx=ne;_sdDrawChart();
        }
        return;
      }
      /* 十字光标 */
      const rect=cv.getBoundingClientRect();
      _sdCrosshair={visible:true,x:e.clientX-rect.left,y:e.clientY-rect.top};
      _sdDrawChart();_sdDrawCrosshair(ctx,W,H,tc);
    });
    const endDrag=()=>{if(_sdDragging){_sdDragging=false;cv.style.cursor='crosshair';}};
    cv.addEventListener('mouseup',endDrag);
    document.addEventListener('mouseup',endDrag);
    cv.addEventListener('mouseleave',()=>{endDrag();_sdCrosshair.visible=false;_sdDrawChart();});
    /* 双击重置缩放 */
    cv.addEventListener('dblclick',()=>{_sdZoom={startIdx:0,endIdx:-1};_sdDrawChart();});
  }
}

function _sdDrawCrosshair(ctx,W,H,tc){
  if(!_sdCrosshair.visible)return;
  const x=_sdCrosshair.x,y=_sdCrosshair.y;
  ctx.save();
  ctx.strokeStyle=tc;ctx.lineWidth=0.5;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* K线图 (支持视口裁剪/缩放) */
function _sdDrawKlineChart(ctx,W,H,gc,tc){
  const allBars=(_sdKlineData?.bars||[]);
  if(allBars.length===0){ctx.fillStyle=tc;ctx.font='14px var(--font)';ctx.textAlign='center';ctx.fillText('暂无K线数据',W/2,H/2);return;}
  const s=_sdZoom.startIdx;const e=_sdZoom.endIdx<0?allBars.length-1:Math.min(_sdZoom.endIdx,allBars.length-1);
  const bars=allBars.slice(s,e+1);
  if(bars.length===0)return;
  const mT=30,mB=30,mL=55,mR=20;
  const ps=bars.flatMap(b=>[b.high,b.low]);
  const pMn=Math.min(...ps),pMx=Math.max(...ps);
  const range=pMx-pMn||1;
  const bW=(W-mL-mR)/bars.length;

  function pY(p){return mT+(1-(p-pMn)/range)*(H-mT-mB);}

  /* 网格 + 价格标尺 */
  ctx.strokeStyle=gc;ctx.lineWidth=0.5;
  for(let i=0;i<5;i++){
    const y=mT+(H-mT-mB)*i/4;
    ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(W-mR,y);ctx.stroke();
    ctx.fillStyle=tc;ctx.font='11px var(--font-num)';ctx.textAlign='right';
    ctx.fillText((pMx-range*i/4).toFixed(2),mL-6,y+4);
  }

  /* K线蜡烛 */
  bars.forEach((d,i)=>{
    const x=mL+i*bW+bW/2;const up=d.close>=d.open;
    ctx.strokeStyle=up?'#ef4444':'#22c55e';ctx.fillStyle=up?'#ef4444':'#22c55e';
    ctx.beginPath();ctx.moveTo(x,pY(d.high));ctx.lineTo(x,pY(d.low));ctx.lineWidth=1;ctx.stroke();
    const bt=pY(Math.max(d.open,d.close)),bb=pY(Math.min(d.open,d.close));
    ctx.fillRect(x-bW*.35,bt,bW*.7,Math.max(bb-bt,1));
  });

  /* === 主图叠加指标 (MA/EMA/BOLL) === */
  /* MA均线 */
  function drawMA(n,color){
    if(allBars.length<n)return;
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.5;
    let first=true;
    for(let ai=s;ai<=e;ai++){
      if(ai<n-1)continue;
      let sum=0;for(let j=ai-n+1;j<=ai;j++)sum+=allBars[j].close;
      const a=sum/n,x=mL+(ai-s)*bW+bW/2,y=pY(a);
      first?(ctx.moveTo(x,y),first=false):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  /* EMA 均线 */
  function drawEMA(n,color){
    if(allBars.length<2)return;
    const k=2/(n+1);
    let ema=allBars[0].close;
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.5;
    let first=true;
    for(let ai=0;ai<allBars.length;ai++){
      ema=allBars[ai].close*k+ema*(1-k);
      if(ai>=s&&ai<=e){
        const x=mL+(ai-s)*bW+bW/2,y=pY(ema);
        first?(ctx.moveTo(x,y),first=false):ctx.lineTo(x,y);
      }
    }
    ctx.stroke();
  }
  /* BOLL 布林带 */
  function drawBOLL(n,mult){
    if(allBars.length<n)return;
    const upPts=[],midPts=[],dnPts=[];
    for(let ai=s;ai<=e;ai++){
      if(ai<n-1)continue;
      let sum=0;for(let j=ai-n+1;j<=ai;j++)sum+=allBars[j].close;
      const mid=sum/n;
      let sqSum=0;for(let j=ai-n+1;j<=ai;j++)sqSum+=(allBars[j].close-mid)**2;
      const std=Math.sqrt(sqSum/n);
      const x=mL+(ai-s)*bW+bW/2;
      upPts.push({x,y:pY(mid+mult*std)});
      midPts.push({x,y:pY(mid)});
      dnPts.push({x,y:pY(mid-mult*std)});
    }
    function drawLine(pts,color,dash){
      if(pts.length<2)return;
      ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.5;
      if(dash)ctx.setLineDash(dash);
      pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      ctx.stroke();if(dash)ctx.setLineDash([]);
    }
    drawLine(upPts,'#ef4444',[5,3]);
    drawLine(midPts,'#eab308',null);
    drawLine(dnPts,'#22c55e',[5,3]);
    /* 半透明填充 */
    if(upPts.length>1&&dnPts.length>1){
      ctx.beginPath();ctx.fillStyle='rgba(234,179,8,0.06)';
      upPts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
      for(let i=dnPts.length-1;i>=0;i--)ctx.lineTo(dnPts[i].x,dnPts[i].y);
      ctx.closePath();ctx.fill();
    }
  }
  /* 根据模式绘制叠加指标 */
  if(_sdOverlayMode==='ma'){
    drawMA(5,'#3b82f6');drawMA(10,'#f59e0b');drawMA(20,'#a855f7');drawMA(60,'#22c55e');
  } else if(_sdOverlayMode==='ema'){
    drawEMA(5,'#3b82f6');drawEMA(10,'#f59e0b');drawEMA(20,'#a855f7');drawEMA(30,'#22c55e');drawEMA(60,'#ec4899');
  } else if(_sdOverlayMode==='boll'){
    drawBOLL(20,2);
  }

  /* 日期标签 */
  ctx.fillStyle=tc;ctx.font='10px var(--font-num)';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(bars.length/6));
  for(let i=0;i<bars.length;i+=step){
    const x=mL+i*bW+bW/2;
    const label=bars[i].date||'';
    ctx.fillText(label.length>10?label.slice(5,16):label.slice(5),x,H-8);
  }

  /* 缩放提示 */
  if(s>0||e<allBars.length-1){
    ctx.fillStyle=tc;ctx.font='10px var(--font)';ctx.textAlign='right';
    ctx.fillText(`${bars.length}/${allBars.length} 双击重置`,W-mR,mT-8);
  }
}

/* 分时图 (当日/五日) */
function _sdDrawMinuteChart(ctx,W,H,gc,tc){
  const data=_sdMinuteData;
  if(!data||!data.bars||data.bars.length===0){ctx.fillStyle=tc;ctx.font='14px var(--font)';ctx.textAlign='center';ctx.fillText('暂无分时数据',W/2,H/2);return;}
  const bars=data.bars;const preClose=data.pre_close||bars[0].price;
  const mT=20,mB=30,mL=55,mR=20;
  const prices=bars.map(b=>b.price);
  const avgPrices=bars.map(b=>b.avg_price||b.price);
  const allP=[...prices,...avgPrices,preClose];
  const pMn=Math.min(...allP),pMx=Math.max(...allP);
  const range=Math.max(pMx-pMn,0.01);

  function pY(p){return mT+(1-(p-pMn)/range)*(H-mT-mB);}

  /* 网格 */
  ctx.strokeStyle=gc;ctx.lineWidth=0.5;
  for(let i=0;i<5;i++){
    const y=mT+(H-mT-mB)*i/4;
    ctx.beginPath();ctx.moveTo(mL,y);ctx.lineTo(W-mR,y);ctx.stroke();
    ctx.fillStyle=tc;ctx.font='11px var(--font-num)';ctx.textAlign='right';
    const pVal=pMx-range*i/4;
    ctx.fillText(pVal.toFixed(2),mL-6,y+4);
    const chgPct=((pVal-preClose)/preClose*100);
    ctx.textAlign='left';
    ctx.fillStyle=chgPct>=0?'#ef4444':'#22c55e';
    ctx.fillText((chgPct>=0?'+':'')+chgPct.toFixed(2)+'%',W-mR+4,y+4);
  }

  /* 昨收线 */
  const pcY=pY(preClose);
  ctx.strokeStyle=tc;ctx.lineWidth=0.5;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(mL,pcY);ctx.lineTo(W-mR,pcY);ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=tc;ctx.font='10px var(--font-num)';ctx.textAlign='right';
  ctx.fillText('昨收 '+preClose.toFixed(2),mL-6,pcY-4);

  const bW=(W-mL-mR)/bars.length;

  /* 价格线 + 填充 */
  ctx.beginPath();
  bars.forEach((b,i)=>{
    const x=mL+i*bW;const y=pY(b.price);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;ctx.stroke();
  const lastX=mL+(bars.length-1)*bW;
  ctx.lineTo(lastX,pcY);ctx.lineTo(mL,pcY);ctx.closePath();
  ctx.fillStyle='rgba(59,130,246,.08)';ctx.fill();

  /* 均价线 */
  ctx.beginPath();
  bars.forEach((b,i)=>{
    const x=mL+i*bW;const y=pY(b.avg_price||b.price);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=1;ctx.stroke();

  /* 时间标签 */
  ctx.fillStyle=tc;ctx.font='10px var(--font-num)';ctx.textAlign='center';
  const step=Math.max(1,Math.floor(bars.length/8));
  for(let i=0;i<bars.length;i+=step){
    if(bars[i]?.time){ctx.fillText(bars[i].time,mL+i*bW,H-8);}
  }
}

/* 成交量柱状图 (跟随缩放视口) */
function _sdDrawVolumeChart(ctx,W,H,gc,tc){
  let allBars,bars;
  if(_sdChartType==='minute'||_sdChartType==='5day'){
    allBars=_sdMinuteData?.bars||[];bars=allBars;
  } else {
    allBars=_sdKlineData?.bars||[];
    const s=_sdZoom.startIdx;const e=_sdZoom.endIdx<0?allBars.length-1:Math.min(_sdZoom.endIdx,allBars.length-1);
    bars=allBars.slice(s,e+1);
  }
  if(!bars||bars.length===0)return;

  const mL=55,mR=20;
  const vols=bars.map(b=>b.volume||0);
  const vMx=Math.max(...vols,1);
  const bW=(W-mL-mR)/bars.length;

  bars.forEach((d,i)=>{
    const x=mL+i*bW+bW*0.15;
    const h=(d.volume/vMx)*(H-8);
    const up=(_sdChartType==='minute'||_sdChartType==='5day')?true:(d.close>=d.open);
    ctx.fillStyle=up?'rgba(239,68,68,.4)':'rgba(34,197,94,.4)';
    ctx.fillRect(x,H-h,bW*0.7,h);
  });
}

/* KDJ 副图 */
function _sdDrawKDJChart(ctx,W,H,gc,tc){
  const allBars=_sdKlineData?.bars||[];
  const s=_sdZoom.startIdx;const e=_sdZoom.endIdx<0?allBars.length-1:Math.min(_sdZoom.endIdx,allBars.length-1);
  if(allBars.length<9)return;
  const mL=55,mR=20,mT=8,mB=8;
  /* 计算全量 KDJ */
  const kArr=[],dArr=[],jArr=[];
  let kk=50,dd=50;
  for(let i=0;i<allBars.length;i++){
    if(i<8){kArr.push(50);dArr.push(50);jArr.push(50);continue;}
    const h9=Math.max(...allBars.slice(i-8,i+1).map(b=>b.high));
    const l9=Math.min(...allBars.slice(i-8,i+1).map(b=>b.low));
    const rsv=h9===l9?50:(allBars[i].close-l9)/(h9-l9)*100;
    kk=2/3*kk+1/3*rsv;dd=2/3*dd+1/3*kk;
    kArr.push(kk);dArr.push(dd);jArr.push(3*kk-2*dd);
  }
  const bars=allBars.slice(s,e+1);
  const bW=(W-mL-mR)/bars.length;
  function vY(v){return mT+(1-v/100)*(H-mT-mB);}
  /* 参考线 80/20 */
  ctx.strokeStyle=gc;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
  [80,50,20].forEach(v=>{ctx.beginPath();ctx.moveTo(mL,vY(v));ctx.lineTo(W-mR,vY(v));ctx.stroke();});
  ctx.setLineDash([]);
  ctx.fillStyle=tc;ctx.font='9px var(--font-num)';ctx.textAlign='right';
  ctx.fillText('80',mL-4,vY(80)+3);ctx.fillText('20',mL-4,vY(20)+3);
  /* K/D/J 线 */
  function drawLine(arr,color){
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.2;let f=true;
    for(let ai=s;ai<=e;ai++){
      const x=mL+(ai-s)*bW+bW/2,y=vY(Math.max(0,Math.min(100,arr[ai])));
      f?(ctx.moveTo(x,y),f=false):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  drawLine(kArr,'#eab308');drawLine(dArr,'#3b82f6');drawLine(jArr,'#a855f7');
  /* 图例 */
  ctx.font='10px var(--font-num)';const li=e<kArr.length?e:kArr.length-1;
  ctx.fillStyle='#eab308';ctx.textAlign='left';ctx.fillText('K:'+kArr[li].toFixed(1),mL+4,12);
  ctx.fillStyle='#3b82f6';ctx.fillText('D:'+dArr[li].toFixed(1),mL+60,12);
  ctx.fillStyle='#a855f7';ctx.fillText('J:'+jArr[li].toFixed(1),mL+116,12);
}

/* MACD 副图 */
function _sdDrawMACDChart(ctx,W,H,gc,tc){
  const allBars=_sdKlineData?.bars||[];
  const s=_sdZoom.startIdx;const e=_sdZoom.endIdx<0?allBars.length-1:Math.min(_sdZoom.endIdx,allBars.length-1);
  if(allBars.length<26)return;
  const mL=55,mR=20,mT=8,mB=8;
  /* 计算 MACD */
  const closes=allBars.map(b=>b.close);
  let ema12=closes[0],ema26=closes[0];
  const difArr=[],deaArr=[],macdArr=[];
  let dea=0;
  for(let i=0;i<closes.length;i++){
    ema12=closes[i]*2/13+ema12*11/13;
    ema26=closes[i]*2/27+ema26*25/27;
    const dif=ema12-ema26;
    difArr.push(dif);
    dea=dif*2/10+dea*8/10;
    deaArr.push(dea);
    macdArr.push((dif-dea)*2);
  }
  const viewMacd=macdArr.slice(s,e+1);
  const viewDif=difArr.slice(s,e+1);
  const viewDea=deaArr.slice(s,e+1);
  const allVals=[...viewDif,...viewDea,...viewMacd];
  const vMx=Math.max(...allVals.map(Math.abs),0.01);
  const bW=(W-mL-mR)/viewMacd.length;
  function vY(v){return mT+(H-mT-mB)/2*(1-v/vMx);}
  /* 零轴 */
  ctx.strokeStyle=gc;ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(mL,vY(0));ctx.lineTo(W-mR,vY(0));ctx.stroke();
  /* MACD 红绿柱 */
  viewMacd.forEach((v,i)=>{
    const x=mL+i*bW+bW*0.2;const h=Math.abs(v)/vMx*(H-mT-mB)/2;
    ctx.fillStyle=v>=0?'rgba(239,68,68,.5)':'rgba(34,197,94,.5)';
    ctx.fillRect(x,v>=0?vY(0)-h:vY(0),bW*0.6,h);
  });
  /* DIF/DEA 线 */
  function drawLine(arr,color){
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.2;let f=true;
    arr.forEach((v,i)=>{const x=mL+i*bW+bW/2,y=vY(v);f?(ctx.moveTo(x,y),f=false):ctx.lineTo(x,y);});
    ctx.stroke();
  }
  drawLine(viewDif,'#3b82f6');drawLine(viewDea,'#f59e0b');
  /* 图例 */
  ctx.font='10px var(--font-num)';const li=viewDif.length-1;
  ctx.fillStyle='#3b82f6';ctx.textAlign='left';ctx.fillText('DIF:'+viewDif[li].toFixed(3),mL+4,12);
  ctx.fillStyle='#f59e0b';ctx.fillText('DEA:'+viewDea[li].toFixed(3),mL+90,12);
  ctx.fillStyle=viewMacd[li]>=0?'#ef4444':'#22c55e';ctx.fillText('MACD:'+viewMacd[li].toFixed(3),mL+176,12);
}

/* RSI 副图 */
function _sdDrawRSIChart(ctx,W,H,gc,tc){
  const allBars=_sdKlineData?.bars||[];
  const s=_sdZoom.startIdx;const e=_sdZoom.endIdx<0?allBars.length-1:Math.min(_sdZoom.endIdx,allBars.length-1);
  if(allBars.length<25)return;
  const mL=55,mR=20,mT=8,mB=8;
  const closes=allBars.map(b=>b.close);
  /* 计算 RSI */
  function calcRSI(n){
    const rsi=new Array(closes.length).fill(50);
    let avgGain=0,avgLoss=0;
    for(let i=1;i<=n&&i<closes.length;i++){
      const d=closes[i]-closes[i-1];
      if(d>0)avgGain+=d;else avgLoss-=d;
    }
    avgGain/=n;avgLoss/=n;
    for(let i=n;i<closes.length;i++){
      const d=closes[i]-closes[i-1];
      avgGain=(avgGain*(n-1)+(d>0?d:0))/n;
      avgLoss=(avgLoss*(n-1)+(d<0?-d:0))/n;
      rsi[i]=avgLoss===0?100:100-100/(1+avgGain/avgLoss);
    }
    return rsi;
  }
  const rsi6=calcRSI(6),rsi12=calcRSI(12),rsi24=calcRSI(24);
  const bars=allBars.slice(s,e+1);
  const bW=(W-mL-mR)/bars.length;
  function vY(v){return mT+(1-v/100)*(H-mT-mB);}
  /* 参考线 70/30 */
  ctx.strokeStyle=gc;ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
  [70,50,30].forEach(v=>{ctx.beginPath();ctx.moveTo(mL,vY(v));ctx.lineTo(W-mR,vY(v));ctx.stroke();});
  ctx.setLineDash([]);
  ctx.fillStyle=tc;ctx.font='9px var(--font-num)';ctx.textAlign='right';
  ctx.fillText('70',mL-4,vY(70)+3);ctx.fillText('30',mL-4,vY(30)+3);
  /* RSI 线 */
  function drawLine(arr,color){
    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=1.2;let f=true;
    for(let ai=s;ai<=e;ai++){
      const x=mL+(ai-s)*bW+bW/2,y=vY(arr[ai]);
      f?(ctx.moveTo(x,y),f=false):ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  drawLine(rsi6,'#eab308');drawLine(rsi12,'#3b82f6');drawLine(rsi24,'#a855f7');
  /* 图例 */
  ctx.font='10px var(--font-num)';const li=e<rsi6.length?e:rsi6.length-1;
  ctx.fillStyle='#eab308';ctx.textAlign='left';ctx.fillText('RSI6:'+rsi6[li].toFixed(1),mL+4,12);
  ctx.fillStyle='#3b82f6';ctx.fillText('RSI12:'+rsi12[li].toFixed(1),mL+70,12);
  ctx.fillStyle='#a855f7';ctx.fillText('RSI24:'+rsi24[li].toFixed(1),mL+146,12);
}

          oh+=`</div>`;
        });
      }
      container.innerHTML=oh;
    }catch(e){
      const container=document.getElementById('order-list');
      if(container)container.innerHTML=`<div style="text-align:center;padding:32px;color:var(--text3)"><i class="fas fa-inbox" style="font-size:24px;opacity:.15;display:block;margin-bottom:8px"></i>暂无委托记录</div>`;
    }
  })();
  h+=`</div></div>`;
  h+=`</div>`; /* 右列结束 */
  h+=`</div>`; /* grid结束 */

  c.innerHTML=h;

}

function _tradeTabSwitch(tab){
  ['pending','filled','all'].forEach(t=>{
    const btn=document.getElementById('order-tab-'+t);if(!btn)return;
    btn.style.background=t===tab?'var(--card)':'transparent';
    btn.style.color=t===tab?'var(--primary)':'var(--text3)';
    btn.style.fontWeight=t===tab?'600':'400';
    btn.style.borderBottom=t===tab?'2px solid var(--primary)':'2px solid transparent';
  });
}

function _tradeBindFeeCalc(){
  const calc=()=>{
    const price=+(document.getElementById('o-price')?.value||0);
    let vol=0;
    if(ROLE==='beginner'){
      const amt=+(document.getElementById('o-amt')?.value||0);
      vol=price>0?Math.floor(amt/price/100)*100:0;
    } else vol=(+(document.getElementById('o-vol')?.value||0))*100;
    const amount=price*vol;
    const comm=Math.max(amount*0.00025,5);const tax=_tradeDir==='SELL'?amount*0.001:0;const transfer=amount*0.00002;
    const total=amount+comm+tax+transfer;
    const el=s=>document.getElementById(s);
    if(el('tf-amt'))el('tf-amt').textContent=amount>0?'¥'+fmtNum(amount):'--';
    if(el('tf-comm'))el('tf-comm').textContent=amount>0?'¥'+comm.toFixed(2):'--';
    if(el('tf-tax'))el('tf-tax').textContent=amount>0?'¥'+tax.toFixed(2):'--';
    if(el('tf-total'))el('tf-total').textContent=amount>0?'¥'+fmtNum(total):'--';
  };
  ['o-price','o-amt','o-vol'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('input',calc);});
}

  ma_cross_down:{name:'均线死叉',icon:'fa-exchange-alt',field:'period',unit:'日',desc:'短期均线下穿长期均线'},
  rsi_oversold:{name:'RSI超卖',icon:'fa-chart-line',field:'threshold',unit:'',desc:'RSI低于阈值（通常30），可能反弹'},
  rsi_overbought:{name:'RSI超买',icon:'fa-chart-line',field:'threshold',unit:'',desc:'RSI高于阈值（通常70），注意回调'},

  boll_break:{name:'布林突破',icon:'fa-arrows-alt-v',field:'band',unit:'',desc:'价格突破布林带上/下轨'},
  time_trigger:{name:'定时触发',icon:'fa-clock',field:'time',unit:'',desc:'每天固定时间触发'},
};
let _triggerConds=[];

function addTriggerCond(type){
  const preset=TRIGGER_PRESETS[type];if(!preset)return;
  _triggerConds.push({type,value:'',enabled:true});
  renderTriggerConds();
}
function removeTriggerCond(i){_triggerConds.splice(i,1);renderTriggerConds();}

function renderTriggerConds(){
  const ct=document.getElementById('trigger-conditions');if(!ct)return;
  if(_triggerConds.length===0){ct.innerHTML=`<div style="padding:16px;text-align:center;color:var(--text3);font-size:13px"><i class="fas fa-hand-pointer"></i> 点击下方按钮添加触发条件</div>`;return;}
  let h='';
  _triggerConds.forEach((cond,i)=>{
    const p=TRIGGER_PRESETS[cond.type]||{name:cond.type,icon:'fa-cog'};
    h+=`<div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card2);border-radius:8px;margin-bottom:6px">
      <i class="fas ${p.icon}" style="color:var(--primary);width:20px;text-align:center"></i>
      <span style="font-size:13px;font-weight:500;min-width:80px">${p.name}</span>`;
    if(p.field==='price'||p.field==='threshold'||p.field==='multiple'||p.field==='pct'){
      h+=`<input type="number" step="0.01" value="${cond.value||''}" onchange="_triggerConds[${i}].value=this.value" style="width:100px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px" placeholder="${p.field==='price'?'100.00':p.field==='pct'?'5':'30'}">`;
      if(p.unit)h+=`<span style="font-size:12px;color:var(--text3)">${p.unit}</span>`;
    } else if(p.field==='period'){
      h+=`<select onchange="_triggerConds[${i}].value=this.value" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px"><option value="5,20">MA5/MA20</option><option value="10,30">MA10/MA30</option><option value="5,60">MA5/MA60</option></select>`;
    } else if(p.field==='band'){
      h+=`<select onchange="_triggerConds[${i}].value=this.value" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px"><option value="upper">突破上轨</option><option value="lower">跌破下轨</option></select>`;
    } else if(p.field==='time'){
      h+=`<input type="time" value="${cond.value||'09:30'}" onchange="_triggerConds[${i}].value=this.value" style="padding:4px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px">`;
    }
    h+=`<span style="font-size:11px;color:var(--text3);flex:1;text-align:right">${p.desc}</span>
      <button class="btn btn-sm btn-ghost" style="color:var(--red)" onclick="removeTriggerCond(${i})"><i class="fas fa-times"></i></button></div>`;
  });
  ct.innerHTML=h;
}

async function submitOrder(){

let _posFilter='all',_posSort='pnl';
async function rPosition(c){
  /* 骨架屏 */
  c.innerHTML=`<div style="padding:16px"><div style="height:24px;width:160px;background:var(--card2);border-radius:8px;margin-bottom:16px"></div><div style="height:80px;background:var(--card2);border-radius:12px;margin-bottom:16px"></div>${'<div style="height:90px;background:var(--card2);border-radius:12px;margin-bottom:10px"></div>'.repeat(4)}</div>`;
  const d=await api('/account/positions?env='+ENV);const pl=d?.data||[];
  _posRender(c,pl);
}
function _posRender(c,pl){
  let totalMv=0,totalPnl=0,totalCost=0;
  pl.forEach(p=>{const mv=p.market_value||(p.volume||0)*(p.price||0);totalMv+=mv;totalPnl+=(p.pnl||0);totalCost+=(p.avg_price||p.cost||0)*(p.volume||0);});
  /* 筛选和排序 */
  let filtered=pl.slice();
  if(_posFilter==='profit')filtered=filtered.filter(p=>(p.pnl||0)>=0);
  else if(_posFilter==='loss')filtered=filtered.filter(p=>(p.pnl||0)<0);
  if(_posSort==='pnl')filtered.sort((a,b)=>Math.abs(b.pnl||0)-Math.abs(a.pnl||0));
  else if(_posSort==='mv')filtered.sort((a,b)=>(b.market_value||(b.volume||0)*(b.price||0))-(a.market_value||(a.volume||0)*(a.price||0)));
  else if(_posSort==='change')filtered.sort((a,b)=>Math.abs(b.change_pct||0)-Math.abs(a.change_pct||0));

  let h=`<div class="content-header"><h1><i class="fas fa-briefcase" style="color:var(--primary)"></i> ${ROLE==='beginner'?'我的股票':'持仓管理'}</h1><span class="badge ${ENV==='sim'?'badge-green':'badge-red'}">${ENV==='sim'?'模拟':'真实'}</span></div>`;

  /* 总览条 */
  h+=`<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">`;
  h+=`<div style="flex:1;min-width:180px;padding:16px;background:var(--card);border-radius:12px;border:1.5px solid var(--border)">`;
  h+=`<div style="font-size:12px;color:var(--text3)"><i class="fas fa-coins"></i> ${ROLE==='beginner'?'股票总价值':'总市值'}</div>`;
  h+=`<div style="font-size:24px;font-weight:800;font-family:var(--font-num);margin-top:4px">¥${fmtNum(totalMv)}</div></div>`;
  h+=`<div style="flex:1;min-width:180px;padding:16px;background:var(--card);border-radius:12px;border:1.5px solid var(--border)">`;
  h+=`<div style="font-size:12px;color:var(--text3)"><i class="fas fa-chart-line"></i> ${ROLE==='beginner'?'总共赚了/亏了':'总盈亏'}</div>`;
  h+=`<div style="font-size:24px;font-weight:800;font-family:var(--font-num);color:${totalPnl>=0?'var(--red)':'var(--green)'};margin-top:4px">${totalPnl>=0?'+':''}¥${fmtNum(totalPnl)}</div>`;
  if(ROLE!=='beginner')h+=`<div style="font-size:11px;color:${totalPnl>=0?'var(--red)':'var(--green)'};margin-top:2px">${totalCost>0?(totalPnl>=0?'+':'')+((totalPnl/totalCost)*100).toFixed(2)+'%':'0.00%'}</div>`;
  h+=`</div>`;
  h+=`<div style="flex:1;min-width:180px;padding:16px;background:var(--card);border-radius:12px;border:1.5px solid var(--border)">`;
  h+=`<div style="font-size:12px;color:var(--text3)"><i class="fas fa-layer-group"></i> ${ROLE==='beginner'?'买了几只':'持仓数量'}</div>`;
  h+=`<div style="font-size:24px;font-weight:800;font-family:var(--font-num);margin-top:4px">${pl.length}<span style="font-size:14px;color:var(--text3);font-weight:400"> ${ROLE==='beginner'?'只股票':'只'}</span></div></div>`;
  /* 资深用户: 持仓占比饼图提示 */
  if(ROLE==='expert'&&pl.length>0){
    h+=`<div style="flex:1;min-width:180px;padding:16px;background:var(--card);border-radius:12px;border:1.5px solid var(--border)">`;
    h+=`<div style="font-size:12px;color:var(--text3)"><i class="fas fa-chart-pie"></i> 最大集中度</div>`;
    const maxPos=pl.reduce((a,b)=>(b.market_value||(b.volume||0)*(b.price||0))>(a.market_value||(a.volume||0)*(a.price||0))?b:a,pl[0]);
    const maxPct=totalMv>0?((maxPos.market_value||(maxPos.volume||0)*(maxPos.price||0))/totalMv*100).toFixed(1):'0';
    h+=`<div style="font-size:24px;font-weight:800;font-family:var(--font-num);margin-top:4px">${maxPct}%</div>`;
    h+=`<div style="font-size:11px;color:var(--text3)">${maxPos.name||maxPos.symbol||'-'}</div></div>`;
  }
  h+=`</div>`;

  if(pl.length===0){
    h+=`<div class="card" style="text-align:center;padding:48px">`;
    h+=`<div style="font-size:48px;opacity:.12;margin-bottom:12px"><i class="fas fa-box-open"></i></div>`;
    h+=`<p style="font-size:16px;font-weight:600;color:var(--text2);margin-bottom:8px">${ROLE==='beginner'?'还没有买股票':'暂无持仓'}</p>`;

    h+=`</div>`;
  } else {
    /* 筛选排序栏 */
    h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">`;
    ['all','profit','loss'].forEach(f=>{
      const label={all:`全部(${pl.length})`,profit:`盈利(${pl.filter(p=>(p.pnl||0)>=0).length})`,loss:`亏损(${pl.filter(p=>(p.pnl||0)<0).length})`}[f];
      h+=`<button class="btn btn-sm ${_posFilter===f?'btn-primary':''}" style="font-size:12px;padding:4px 12px;${_posFilter!==f?'background:var(--card2);color:var(--text2);border:none':''}" onclick="_posFilter='${f}';_posRender(document.getElementById('main-content'),window._posData)">${label}</button>`;

    h+=`<span style="font-size:11px;color:var(--text3)">排序:</span>`;
    ['pnl','mv','change'].forEach(s=>{
      const label={pnl:'盈亏',mv:'市值',change:'涨幅'}[s];
      h+=`<span style="font-size:11px;padding:3px 8px;border-radius:4px;cursor:pointer;${_posSort===s?'background:var(--primary-bg);color:var(--primary);font-weight:600':'color:var(--text3)'}" onclick="_posSort='${s}';_posRender(document.getElementById('main-content'),window._posData)">${label}</span>`;
    });
    h+=`</div></div>`;

    /* 持仓卡片列表 */
    h+=`<div style="display:flex;flex-direction:column;gap:10px">`;
    filtered.forEach(p=>{
      const pnl=p.pnl||0;const chg=p.change_pct||0;const up=pnl>=0;const price=p.price||0;const avgP=p.avg_price||p.cost||0;const vol=p.volume||0;const mv=p.market_value||vol*price;
      h+=`<div class="card" style="padding:16px;transition:transform .15s,box-shadow .15s;cursor:pointer" onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 6px 24px rgba(0,0,0,.1)'" onmouseleave="this.style.transform='';this.style.boxShadow=''">`;
      h+=`<div style="display:flex;align-items:flex-start;gap:12px">`;

      h+=`<div style="width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:${up?'var(--red-bg)':'var(--green-bg)'};color:${up?'var(--red)':'var(--green)'};font-size:16px;font-weight:700;flex-shrink:0">${up?'▲':'▼'}</div>`;
      /* 名称区 */
      h+=`<div style="flex:1;min-width:0">`;
      h+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="font-size:15px;font-weight:700">${p.name||p.symbol||'-'}</span>`;
      if(p.symbol&&p.name)h+=`<span style="font-size:11px;color:var(--text3)">${p.symbol}</span>`;
      h+=`</div>`;
      /* 详情行 */
      h+=`<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text3)">`;
      h+=`<span>${ROLE==='beginner'?'买了':'持仓'} <b style="color:var(--text)">${vol}</b> 股</span>`;
      h+=`<span>${ROLE==='beginner'?'花了':'成本'} <b style="color:var(--text)">¥${avgP.toFixed(2)}</b></span>`;
      h+=`<span>现在 <b style="color:${up?'var(--red)':'var(--green)'}">¥${price.toFixed(2)}</b></span>`;
      if(ROLE!=='beginner')h+=`<span>市值 <b style="color:var(--text)">¥${fmtNum(mv)}</b></span>`;
      h+=`</div></div>`;
      /* 盈亏区 */
      h+=`<div style="text-align:right;flex-shrink:0">`;
      if(ROLE==='beginner'){
        h+=`<div style="font-size:16px;font-weight:800;color:${up?'var(--red)':'var(--green)'};margin-bottom:2px">${up?'赚了':'亏了'} ¥${Math.abs(pnl).toFixed(0)}</div>`;

      } else {
        h+=`<div style="font-size:18px;font-weight:800;font-family:var(--font-num);color:${up?'var(--red)':'var(--green)'};margin-bottom:2px">${up?'+':''}¥${fmtNum(pnl)}</div>`;
        h+=`<div style="font-size:12px;font-family:var(--font-num);color:${up?'var(--red)':'var(--green)'}">${up?'+':''}${chg.toFixed(2)}%${p.hold_days?' | 持有'+p.hold_days+'天':''}</div>`;

      h+=`</div></div>`;
      /* 操作按钮 */

      h+=`</div></div>`;

    h+=`</div>`;

  c.innerHTML=h;
