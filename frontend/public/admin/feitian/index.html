  h+=`<label style="cursor:pointer"><input type="checkbox" ${_syncLogLevelFilter.INFO?'checked':''} onchange="toggleLevel('INFO')"> INFO</label>`;
  h+=`<label style="cursor:pointer"><input type="checkbox" ${_syncLogLevelFilter.WARN?'checked':''} onchange="toggleLevel('WARN')"> WARN</label>`;
  h+=`<label style="cursor:pointer"><input type="checkbox" ${_syncLogLevelFilter.ERROR?'checked':''} onchange="toggleLevel('ERROR')"> ERROR</label>`;
  h+='</span>';
  h+=`<label style="font-size:11px;cursor:pointer"><button class="toggle ${_syncLogVerbose?'on':''}" style="width:32px;height:18px" onclick="event.stopPropagation();_syncLogVerbose=!_syncLogVerbose;_renderSyncLogPanel(window._syncLogEntriesForCopy||[])"></button> 详细</label>`;
  h+='<button class="btn btn-sm btn-ghost" onclick="copySyncLogs()" title="复制日志"><i class="fas fa-copy"></i></button>';
  h+='<button class="btn btn-sm btn-ghost" onclick="copySyncLogsAsJson()" title="复制为 JSON"><i class="fas fa-code"></i> JSON</button>';
  h+='</div><div class="log-body" style="max-height:200px;overflow-y:auto">';
  const msgEsc=(s)=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  filtered.forEach(e=>{
    const cls=(e.level==='ERROR'?'log-error':e.level==='WARN'?'log-warn':'log-info');
    if(_syncLogVerbose){
      const extraKeys=Object.keys(e).filter(k=>k!=='ts'&&k!=='level'&&k!=='msg'&&e[k]!==undefined);
      const extraObj={};extraKeys.forEach(k=>extraObj[k]=e[k]);
      const extraStr=Object.keys(extraObj).length?JSON.stringify(extraObj,null,2):'';
      h+=`<div class="log-line ${cls}"><span style="opacity:.6">[${msgEsc(e.ts||'')}]</span> <b>[${msgEsc(e.level||'INFO')}]</b> ${msgEsc(e.msg)}${extraStr?'<pre style="margin:4px 0 0 0;font-size:11px;opacity:.85;white-space:pre-wrap;word-break:break-all">'+msgEsc(extraStr)+'</pre>':''}</div>`;
    }else h+=`<div class="log-line ${cls}">${msgEsc(e.msg||'')}</div>`;
  });
  if(n===0)h+=`<div class="log-line log-debug" style="text-align:center;padding:12px">暂无日志</div>`;
  h+='</div>';
  panel.innerHTML=h;
  window._syncLogFilteredForCopy=filtered;
  panel.classList.add('open');

async function refreshSyncRunningLogs(){
  const panel=document.getElementById('sync-running-logs-panel');if(!panel)return;
  if(window._syncRunningLogsView==='history'){
    try{
      const resp=await api('/data-sync/logs?limit=200');
      const data=resp?.data||resp||{};
      const entries=Array.isArray(data.log_entries)?data.log_entries:[];
      _renderSyncLogPanel(entries);
      window._syncLogEntriesForCopy=entries;
    }catch(e){
      panel.innerHTML='<div class="log-line log-error" style="padding:12px">加载失败: '+(e?.message||e)+'</div>';
    }
    return;
  }
  const tasks=window._syncTasksList||[];
  const running=tasks.filter(t=>t.status==='running');
  if(running.length>0){
    try{
      let merged=[..._syncLogEntries];
      for(const t of running){
        const resp=await api('/data-sync/tasks/'+t.id+'/logs?page=1&page_size=200');
        const data=resp?.data||resp||{};
        let entries=data.log_entries||[];
        if(entries.length===0&&(data.items||[]).length>0)entries=(data.items||[]).map(r=>{let lv=(r.level||'INFO').toUpperCase();if(lv==='WARNING')lv='WARN';return {ts:r.created_at||'',level:lv,msg:r.message||'',task_id:t.id};});
        entries.forEach(e=>{e.task_id=e.task_id!=null?e.task_id:t.id;});
        merged=merged.concat(entries);
      }
      const seen=new Set();merged=merged.sort((a,b)=>(a.ts||'').localeCompare(b.ts||'')).filter(e=>{const k=_syncDedupKey(e);if(seen.has(k))return false;seen.add(k);return true;}).slice(-_SYNC_LOG_CAP);
      _syncLogEntries=merged;
      window._syncLogEntriesForCopy=_syncLogEntries;
      _renderSyncLogPanel(_syncLogEntries);
    }catch(e){
      _renderSyncLogPanel(_syncLogEntries);
    }
  }else{
    _renderSyncLogPanel(_syncLogEntries);
  }
}
async function refreshSyncTasks(){
  try{
    window._syncTaskSelectedIds=window._syncTaskSelectedIds||new Set();
    window._syncTaskPage=window._syncTaskPage!=null?window._syncTaskPage:1;
    window._syncTaskPageSize=window._syncTaskPageSize!=null?window._syncTaskPageSize:15;
    window._syncTaskTotal=window._syncTaskTotal!=null?window._syncTaskTotal:0;
    const page=Math.max(1,window._syncTaskPage);
    const pageSize=window._syncTaskPageSize;
    let resp=await api('/data-sync/tasks?page='+page+'&page_size='+pageSize,{timeout:20000});
    if(resp==null){
      await new Promise(r=>setTimeout(r,1500));
      resp=await api('/data-sync/tasks?page='+page+'&page_size='+pageSize,{timeout:20000});
    }
    if(resp==null){
      window._syncTaskFailCount=(window._syncTaskFailCount||0)+1;
      if(window._syncTaskFailCount>=3&&typeof toast==='function')toast('获取任务列表失败，请检查网络或稍后重试','error');
      console.error('获取任务列表失败');return;
    }
    window._syncTaskFailCount=0;
    const data=resp?.data||{};
    const tasks=Array.isArray(data.items)?data.items:[];
    const total=typeof data.total==='number'?data.total:0;
    window._syncTasksList=tasks;
    window._syncTaskTotal=total;
    const el=document.getElementById('sync-task-list');if(!el)return;
    if(!tasks.length){el.innerHTML='<div style="padding:20px;text-align:center;color:var(--text3)">暂无同步任务</div>';renderSyncTaskPagination(total,page,pageSize);return;}
    const staleCount=tasks.filter(t=>t.status_name==='运行中'&&t.stale===true).length;
    let staleWarning='';
    if(staleCount>0){
      staleWarning='<div style="background:var(--orange-bg);color:var(--orange);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:13px"><i class="fas fa-exclamation-triangle"></i> 警告：检测到有 '+staleCount+' 个任务长时间没有更新，可能出现任务异常或网络中断。建议：取消后对该分类执行「续传」，或检查 Worker 与 Redis。</div>';
    }
    let h=staleWarning+'<table><thead><tr><th><input type="checkbox" id="sync-task-select-all" onclick="toggleSyncTaskSelectAll(this)"/></th><th>分类</th><th>类型</th><th>状态</th><th>总数</th><th>成功</th><th>失败</th><th>开始时间</th><th>完成时间</th><th>操作</th></tr></thead><tbody>';
    tasks.forEach((t,i)=>{
      const statusColor=t.status==='success'?'var(--green)':t.status==='failed'?'var(--red)':t.status==='running'?'var(--primary)':t.status==='pending'?'var(--orange, #f59e0b)':'var(--text3)';
      const statusDisplay=(t.status_name!=null&&t.status_name!==undefined)?t.status_name:t.status;
      const running=t.status==='running';
      const opCell=`<button class="btn btn-sm btn-ghost" title="停止" ${running?'onclick="event.stopPropagation();cancelSyncTask('+t.id+')"':'disabled style="opacity:0.5;cursor:not-allowed"'}><i class="fas fa-stop"></i></button> <button class="btn btn-sm btn-ghost" title="取消" ${running?'onclick="event.stopPropagation();cancelSyncTask('+t.id+')"':'disabled style="opacity:0.5;cursor:not-allowed"'}><i class="fas fa-ban"></i></button> <button class="btn btn-sm btn-ghost" title="删除" onclick="event.stopPropagation();deleteSyncTask(${t.id})"><i class="fas fa-trash"></i></button>`;
      h+=`<tr style="cursor:pointer" onclick="showSyncTaskDetail(${i})" title="点击查看任务日志"><td onclick="event.stopPropagation()"><input type="checkbox" class="sync-task-cb" data-task-id="${t.id}" data-status="${t.status}" onchange="syncTaskCheckboxChange(this)"/></td><td style="font-weight:600">${t.category_name!=null?t.category_name:t.category}</td><td><span class="badge badge-blue">${t.sync_type_name!=null?t.sync_type_name:t.sync_type}</span></td><td style="color:${statusColor};font-weight:600">${statusDisplay}</td><td>${t.total_count||0}</td><td>${t.success_count||0}</td><td style="color:${t.error_count?'var(--red)':'inherit'}">${t.error_count||0}</td><td style="font-size:11px">${t.started_at||'-'}</td><td style="font-size:11px">${t.finished_at||'-'}</td><td onclick="event.stopPropagation()">${opCell}</td></tr>`;
    });
    h+='</tbody></table>';
    el.innerHTML=h;
    renderSyncTaskPagination(total,page,pageSize);
    window._syncTaskSelectedIds.clear();
    const headerCb=document.getElementById('sync-task-select-all');if(headerCb)headerCb.checked=false;
  }catch(e){
    console.error('refreshSyncTasks',e);
  }
}
function renderSyncTaskPagination(total,page,pageSize){
  const totalPages=Math.max(1,Math.ceil(total/pageSize));
  const pagEl=document.getElementById('sync-task-pagination');if(!pagEl)return;
  const prevDisabled=page<=1;
  const nextDisabled=page>=totalPages;
  let html='<span>每页</span><select id="sync-task-page-size" onchange="syncTaskPageSizeChange(this)" style="margin:0 4px;padding:4px 8px;border-radius:6px;border:1px solid var(--border)">';
  [15,25,50,100].forEach(n=>{html+='<option value="'+n+'"'+(n===pageSize?' selected':'')+'>'+n+'</option>';});
  html+='</select>';
  html+='<span style="margin-left:8px">共 '+total+' 条</span>';
  html+='<button class="btn btn-sm btn-ghost" '+(prevDisabled?'disabled style="opacity:0.5;cursor:not-allowed"':'onclick="syncTaskGoPage('+(page-1)+')"')+'><i class="fas fa-chevron-left"></i> 上一页</button>';
  html+='<button class="btn btn-sm btn-ghost" '+(nextDisabled?'disabled style="opacity:0.5;cursor:not-allowed"':'onclick="syncTaskGoPage('+(page+1)+')"')+'>下一页 <i class="fas fa-chevron-right"></i></button>';
  html+='<span style="margin-left:8px">第 <input type="number" id="sync-task-jump-page" min="1" max="'+totalPages+'" value="'+page+'" style="width:48px;padding:4px;text-align:center;border-radius:6px;border:1px solid var(--border)" /> / '+totalPages+' 页</span>';
  html+='<button class="btn btn-sm btn-outline" onclick="syncTaskJumpToPage()">跳转</button>';
  pagEl.innerHTML=html;
}

function syncTaskJumpToPage(){var inp=document.getElementById('sync-task-jump-page');if(!inp)return;var p=parseInt(inp.value,10);var totalPages=Math.max(1,Math.ceil((window._syncTaskTotal||0)/(window._syncTaskPageSize||15)));p=Math.max(1,Math.min(p,totalPages));window._syncTaskPage=p;refreshSyncTasks();}

    const errMsg=resp.detail||(resp.code!==0&&resp.code!==undefined?(resp.message||resp.detail):null);
    if(errMsg){toast('启动失败: '+errMsg+(resp.data?.error_detail?' ('+resp.data.error_detail+')':''),'error');return;}
    toast(resp.data?.message||`${category} 同步已启动`,'success');

    if(resp.code!==0&&resp.code!==undefined){toast('启动失败: '+(resp.message||resp.detail||'未知错误'),'error');return;}

    _appendSyncLogLines([{ts:new Date().toISOString(),level:'INFO',msg:'已触发全量 '+syncType+' 同步'}]);

      if(m&&m[1])name=m[1].trim();

    const blob=await r.blob();const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
    appendBackupPageLog('下载备份','下载成功: '+name,'success');toast('下载成功','success');
  }catch(e){appendBackupPageLog('下载备份',e.message||'下载失败','failed');toast(e.message||'下载失败','error');}

  appendBackupPageLog('检测各组件备份条件','正在检测…','info',{});

    const redis=d.redis||{};
    const qdrant=d.qdrant||{};

}

async function mkBak(){
  const name=document.getElementById('bn')?.value?.trim();
  if(!name){toast('请填写备份名称','error');return;}
  const content=[];
  if(document.getElementById('bk-mysql')?.checked)content.push('mysql');
  if(document.getElementById('bk-qdrant')?.checked)content.push('qdrant');
  if(document.getElementById('bk-aiconfig')?.checked)content.push('ai_config');
  if(document.getElementById('bk-redis')?.checked)content.push('redis');
  if(document.getElementById('bk-sysconfig')?.checked)content.push('system_config');
  if(document.getElementById('bk-clickhouse')?.checked)content.push('clickhouse');
  if(content.length===0){toast('请至少选择一项备份内容','error');return;}
  const dest=document.getElementById('bk-dest')?.value||'local';
  appendBackupPageLog('创建备份','正在创建全量备份: '+name,'info',{content,dest});
  const res=await api('/backups',{method:'POST',body:JSON.stringify({name,type:'full',content,destination:dest})});
  closeModal('gm');
  if(res&&(res.data||res.code===0)){appendBackupPageLog('创建备份','备份任务已创建: '+name,'success');toast('备份任务已创建','success');}
  else{appendBackupPageLog('创建备份','创建失败','failed',res);toast(res?.detail||res?.message||'创建失败','error');}
  rBackups(document.getElementById('main-content'));
}
function showRestoreConfirm(backupId,contentSummary){
  const hasConfig=(contentSummary||'').indexOf('配置')>=0||(contentSummary||'').indexOf('系统')>=0;
  const body=hasConfig
    ?`<p>恢复此备份将覆盖当前系统中的对应数据，是否继续？</p><div class="form-group"><label>恢复范围</label><select id="restore-scope"><option value="both">数据库与文件</option><option value="db_only">仅数据库</option><option value="file_only">仅配置文件</option></select></div>`
    :`<p>恢复此备份将覆盖当前系统中的对应数据，是否继续？</p>`;
  document.getElementById('gm-body').innerHTML=`<h3><i class="fas fa-undo" style="color:var(--orange)"></i> 恢复备份</h3>${body}<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px"><button class="btn btn-outline" onclick="closeModal('gm')">取消</button><button class="btn btn-primary" onclick="doRestore('${backupId.replace(/'/g,"\\'")}')">确认恢复</button></div>`;

async function doRestore(backupId){
  const scopeEl=document.getElementById('restore-scope');
  const restoreConfig=scopeEl?scopeEl.value:null;
  closeModal('gm');
  appendBackupPageLog('恢复备份','正在恢复备份 '+backupId,'info',{restore_config:restoreConfig});
  const res=await api(`/backups/${backupId}/restore`,{method:'POST',body:restoreConfig?JSON.stringify({restore_config:restoreConfig}):undefined});
  if(res&&(res.data!==undefined||res.code===0)){appendBackupPageLog('恢复备份','恢复完成: '+backupId,'success');toast('恢复完成','success');}
  else{appendBackupPageLog('恢复备份','恢复失败','failed',res);toast(res?.detail||res?.message||'恢复失败','error');}
  rBackups(document.getElementById('main-content'));
}
async function rstBak(id,contentSummary){
  showRestoreConfirm(id,contentSummary);
}

      <tr style="display:none"><td colspan="6" style="background:var(--card2);padding:12px">
        <div style="display:grid;grid-template-columns:100px 1fr;gap:6px;font-size:13px">
          <span style="color:var(--text3);font-weight:500">IP 地址</span><span style="font-family:var(--font-num)">${l.ip_address||'—'}</span>
          <span style="color:var(--text3);font-weight:500">User-Agent</span><span style="font-size:12px;word-break:break-all">${l.user_agent||'—'}</span>
          <span style="color:var(--text3);font-weight:500">请求路径</span><span style="font-family:monospace;font-size:12px">${l.request_path||'—'}</span>
          <span style="color:var(--text3);font-weight:500">响应时间</span><span style="font-family:var(--font-num)">${l.response_ms?l.response_ms+'ms':'—'}</span>
          <span style="color:var(--text3);font-weight:500">完整详情</span><span>${l.detail||'—'}</span>
          ${l.changes?`<span style="color:var(--text3);font-weight:500">变更内容</span><pre style="font-size:12px;background:var(--card);padding:8px;border-radius:6px;overflow-x:auto;margin:0">${typeof l.changes==='object'?JSON.stringify(l.changes,null,2):l.changes}</pre>`:''}
        </div>
      </td></tr>`;
    });
    h+=`</tbody></table>`;
  } else {
    h+=`<div class="empty-state" style="padding:30px"><i class="fas fa-scroll"></i><p>暂无审计日志</p></div>`;
  }
  h+=`</div>`;
  h+=`<div style="margin-top:8px;font-size:11px;color:var(--text3)"><i class="fas fa-info-circle"></i> 点击行可展开查看 IP、UA、变更详情</div>`;
  c.innerHTML=h;
}

async function exportAuditCSV(){const d=await api('/export/audit?limit=500&format=csv');if(d)toast('CSV 导出成功','success');else toast('失败','error');}

/* ===== ALERTS（系统运维告警，非股票预警）===== */
async function rAlerts(c){
  skeleton(c,'table');const d=await api('/alerts?limit=50');const al=d?.data||[];

  let h=getBreadcrumb('alerts');
  h+=`<div class="content-header"><h1><i class="fas fa-bell" style="color:var(--primary);margin-right:8px"></i>系统告警</h1></div>`;

  /* 告警类型说明 */
  const alertTypes=[
    {icon:'fa-server',label:'组件宕机',desc:'Redis/MySQL/Qdrant 不可达',color:'var(--red)'},
    {icon:'fa-exclamation-triangle',label:'API 错误率',desc:'错误率超过阈值',color:'var(--orange)'},
    {icon:'fa-hdd',label:'磁盘空间',desc:'磁盘空间不足警告',color:'var(--orange)'},
    {icon:'fa-key',label:'LLM Key 异常',desc:'余额不足/调用失败',color:'var(--red)'},
    {icon:'fa-user-lock',label:'异常登录',desc:'多次登录失败/异常 IP',color:'var(--orange)'},
    {icon:'fa-microchip',label:'资源超阈值',desc:'CPU/内存使用率过高',color:'var(--orange)'},
  ];
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:20px">`;
  alertTypes.forEach(t=>{
    h+=`<div style="background:var(--card);border-radius:8px;padding:12px;border:1px solid var(--border);display:flex;align-items:center;gap:10px">
      <i class="fas ${t.icon}" style="color:${t.color};font-size:16px"></i>
      <div><div style="font-size:13px;font-weight:600">${t.label}</div><div style="font-size:11px;color:var(--text3)">${t.desc}</div></div>
    </div>`;
  });
  h+=`</div>`;

  /* 告警列表 - 过滤掉用户行情预警 */
  const sysAlerts=al.filter(a=>{
    const title=(a.title||'').toLowerCase();
    /* 过滤掉股票/行情类预警 */
    if(title.includes('突破')||title.includes('股价')||title.includes('涨停')||title.includes('跌停'))return false;
    return true;
  });

  h+=`<div class="card"><div class="section-title"><i class="fas fa-list"></i> 告警记录 <span class="badge badge-blue">${sysAlerts.length}</span></div>`;
  if(sysAlerts.length>0){
    h+=`<table><thead><tr><th>标题</th><th>消息</th><th>级别</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>`;
    sysAlerts.forEach(a=>{
      const lc=a.level==='critical'?'badge-red':a.level==='warning'?'badge-orange':'badge-blue';
      h+=`<tr>
        <td style="font-weight:500">${a.title||''}</td>
        <td style="font-size:13px">${a.message||''}</td>
        <td><span class="badge ${lc}">${a.level||''}</span></td>
        <td><span class="badge ${a.status==='resolved'?'badge-green':'badge-orange'}">${a.status==='resolved'?'已解决':'活跃'}</span></td>
        <td style="font-size:12px;color:var(--text3);white-space:nowrap">${a.created_at||''}</td>
        <td>${a.status!=='resolved'?`<button class="btn btn-sm btn-green" onclick="resolveA('${a.id||a.alert_id}')"><i class="fas fa-check"></i> 解决</button>`:''}</td>
      </tr>`;
    });
    h+=`</tbody></table>`;
  } else {
    h+=`<div class="empty-state" style="padding:30px"><i class="fas fa-check-circle" style="color:var(--green)"></i><p>暂无系统告警，一切正常</p></div>`;
  }
  h+=`</div>`;
  h+=`<div style="margin-top:8px;font-size:11px;color:var(--text3)"><i class="fas fa-info-circle"></i> 此处仅显示系统运维告警。用户的股票行情预警在用户界面管理。</div>`;
  c.innerHTML=h;
}
async function resolveA(id){await api(`/alerts/${id}/resolve`,{method:'PUT'});toast('已解决','success');rAlerts(document.getElementById('main-content'));}
