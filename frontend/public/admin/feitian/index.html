<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>管理控制台 · 飞天</title>
<!-- 使用系统字体，避免 Google Fonts 在国内慢/阻断导致 2.9 分钟加载 -->
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
<style>
:root{--bg:#f1f5f9;--bg2:#e2e8f0;--card:#fff;--card2:#f8fafc;--text:#0f172a;--text2:#475569;--text3:#94a3b8;--primary:#2563eb;--primary-light:#3b82f6;--primary-bg:rgba(37,99,235,.08);--green:#10b981;--green-bg:rgba(16,185,129,.1);--red:#ef4444;--red-bg:rgba(239,68,68,.1);--orange:#f59e0b;--orange-bg:rgba(245,158,11,.1);--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 8px 30px rgba(0,0,0,.12);--radius:12px;--font:'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,sans-serif;--font-num:'PingFang SC','Microsoft YaHei','Outfit',system-ui,sans-serif}
html.dark{--bg:#0f172a;--bg2:#1e293b;--card:#1e293b;--card2:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--primary:#3b82f6;--primary-light:#60a5fa;--primary-bg:rgba(59,130,246,.15);--green:#34d399;--green-bg:rgba(52,211,153,.15);--red:#f87171;--red-bg:rgba(248,113,113,.15);--orange:#fbbf24;--orange-bg:rgba(251,191,36,.15);--border:#334155;--shadow:0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 8px 30px rgba(0,0,0,.4)}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
input,select,textarea,button{font-family:var(--font);font-size:15px}
.page{display:none;animation:fadeIn .4s ease}.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.stagger>*{opacity:0;animation:fadeIn .5s ease forwards}.stagger>*:nth-child(1){animation-delay:.05s}.stagger>*:nth-child(2){animation-delay:.1s}.stagger>*:nth-child(3){animation-delay:.15s}.stagger>*:nth-child(4){animation-delay:.2s}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;border:none;cursor:pointer;font-weight:500;transition:all .2s;font-size:15px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{opacity:.9}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{opacity:.9}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-ghost{background:transparent;color:var(--text2);padding:6px 12px}.btn-ghost:hover{background:var(--primary-bg);color:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s}.card:hover{box-shadow:var(--shadow-lg)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.badge-green{background:var(--green-bg);color:var(--green)}.badge-red{background:var(--red-bg);color:var(--red)}.badge-blue{background:var(--primary-bg);color:var(--primary)}.badge-orange{background:var(--orange-bg);color:var(--orange)}.badge-gray{background:var(--bg2);color:var(--text3)}
.form-group{margin-bottom:16px}.form-group label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:15px;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-bg)}
.toggle{position:relative;width:44px;height:24px;background:var(--bg2);border-radius:12px;cursor:pointer;transition:background .3s;border:none;vertical-align:middle}.toggle.on{background:var(--green)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.toggle.on::after{transform:translateX(20px)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:16px;padding:28px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto;animation:scaleIn .3s ease;text-align:left}.modal h3{font-size:18px;margin-bottom:16px}
.sttpl-gm-overlay{padding:20px}
.sttpl-gm-body{width:min(1120px,92vw);max-width:min(1120px,92vw);min-width:760px;min-height:560px;max-height:90vh;resize:both;overflow:auto;padding:24px 24px 18px}
.sttpl-admin-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.sttpl-admin-title{font-size:22px;font-weight:700;line-height:1.35}
.sttpl-admin-sub{font-size:13px;color:var(--text2);line-height:1.75;margin-top:6px}
.sttpl-admin-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:16px;align-items:start}
.sttpl-admin-main,.sttpl-admin-side{display:flex;flex-direction:column;gap:14px}
.sttpl-admin-section{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px}
.sttpl-admin-section .section-title-mini{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--text2);margin-bottom:12px;text-transform:uppercase}
.sttpl-admin-section.primary .section-title-mini{color:var(--primary)}
.sttpl-admin-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid var(--border);position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),var(--card) 18%)}
@media(max-width:960px){.sttpl-gm-overlay{padding:12px}.sttpl-gm-body{width:100%;max-width:100%;min-width:0;min-height:auto;max-height:92vh;resize:none;padding:18px 16px 16px}.sttpl-admin-grid{grid-template-columns:1fr}.sttpl-admin-title{font-size:18px}}
table{width:100%;border-collapse:collapse}th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:14px}
th{font-weight:500;color:var(--text2);background:var(--card2)}tr:hover{background:var(--primary-bg)}
.slider-wrap{display:flex;align-items:center;gap:12px}.slider-wrap input[type=range]{flex:1;accent-color:var(--primary);height:6px}.slider-wrap .val{font-family:var(--font-num);font-weight:600;min-width:50px;text-align:right;color:var(--primary)}
.tab-bar{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px}.tab-bar .tab{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--text2);transition:all .2s;border:none;background:transparent}.tab-bar .tab.active{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.indicator-card{text-align:center;padding:20px;border-radius:var(--radius);background:var(--card2);border:1px solid var(--border)}.indicator-card .val{font-family:var(--font-num);font-size:28px;font-weight:700;margin:8px 0 4px}.indicator-card .label{font-size:13px;color:var(--text2)}
.page.active.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);padding:20px}
.login-box{background:var(--card);border-radius:20px;padding:40px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}.login-box h2{text-align:center;margin-bottom:6px;font-size:22px}
.app-layout{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--card);border-right:1px solid var(--border);padding:16px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .3s}
.sidebar .logo{padding:12px 20px 20px;font-size:18px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px}.sidebar .logo i{font-size:22px}
.sidebar-nav{flex:1;overflow-y:auto}
.sidebar-nav a{display:flex;align-items:center;gap:12px;padding:12px 20px;color:var(--text2);font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;border-left:3px solid transparent;text-decoration:none}
.sidebar-nav a:hover{background:var(--primary-bg);color:var(--primary)}.sidebar-nav a.active{color:var(--primary);background:var(--primary-bg);border-left-color:var(--primary)}
.sidebar-nav a i{width:20px;text-align:center}
.sidebar-group{padding:4px 20px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:16px}
.sidebar-subgroup{padding:6px 20px 4px;font-size:11px;font-weight:600;color:var(--text3);margin-top:8px}
.sidebar-subgroup:first-of-type{margin-top:4px}
.sidebar-nav a.sidebar-sub{padding-left:36px;font-size:13px}
/* 配置中心：侧栏内唯一父级区块，其下为二级分组→链接，三层缩进 */
.sidebar-config-wrap{margin-top:4px}
.sidebar-config-title{padding:8px 20px 6px;font-size:12px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:8px}
.sidebar-config-title i:first-child{width:20px;text-align:center}
.sidebar-config-body .sidebar-subgroup{padding-left:36px;font-size:11px;text-transform:none;margin-top:10px}
.sidebar-config-body .sidebar-subgroup:first-child{margin-top:4px}
.sidebar-config-body a.sidebar-sub{padding-left:52px;font-size:13px}
.main-area{flex:1;margin-left:260px}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}.topbar-right{display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.content{padding:24px}.content-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}.content-header h1{font-size:22px;font-weight:700}
.hamburger{display:none;background:none;border:none;font-size:22px;color:var(--text);cursor:pointer;padding:4px}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:45}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.section-title{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}.section-title i{color:var(--primary)}
.admin-stat-card{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border);text-align:center}
.admin-stat-card .icon-wrap{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:20px}
.admin-stat-card .num{font-family:var(--font-num);font-size:24px;font-weight:700;margin-bottom:4px}
.admin-stat-card .label{font-size:13px;color:var(--text2)}
.toast{position:fixed;top:24px;right:24px;z-index:9999;padding:14px 24px;border-radius:10px;font-size:14px;font-weight:500;animation:fadeIn .3s;max-width:400px;box-shadow:var(--shadow-lg)}
.toast-success{background:var(--green);color:#fff}.toast-error{background:var(--red);color:#fff}.toast-info{background:var(--primary);color:#fff}.toast-warning{background:var(--orange);color:#fff}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}.empty-state i{font-size:48px;margin-bottom:16px;opacity:.5}
/* Permission matrix */
.perm-matrix{width:100%;border-collapse:collapse;font-size:13px}
.perm-matrix th,.perm-matrix td{padding:8px 10px;text-align:center;border:1px solid var(--border)}
.perm-matrix th{background:var(--card2);font-weight:600}
.perm-matrix td:first-child,.perm-matrix th:first-child{text-align:left;min-width:180px}
.perm-matrix .perm-yes{color:var(--green);font-weight:700}.perm-matrix .perm-no{color:var(--red);font-weight:700}.perm-matrix .perm-limited{color:var(--orange);font-weight:700}
.tag{display:inline-block;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;background:var(--bg2);color:var(--text2);user-select:none}
.tag:hover{background:var(--primary-bg);color:var(--primary)}
.tag.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}
/* Stepper */
.stepper{display:flex;gap:0;margin-bottom:24px;position:relative}
.stepper::before{content:'';position:absolute;top:16px;left:24px;right:24px;height:2px;background:var(--bg2);z-index:0}
.step-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;cursor:pointer}
.step-num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--bg2);color:var(--text3);border:2px solid var(--bg2);transition:all .3s}
.step-item.active .step-num{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 2px 8px rgba(37,99,235,.3)}
.step-item.done .step-num{background:var(--green);color:#fff;border-color:var(--green)}
.step-label{font-size:11px;color:var(--text3);font-weight:500;white-space:nowrap;transition:color .3s}
.step-item.active .step-label{color:var(--primary);font-weight:600}
.step-item.done .step-label{color:var(--green)}
.step-body{display:none;animation:fadeIn .3s ease}.step-body.active{display:block}
.step-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.model-list{max-height:220px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;margin-top:8px}
.model-item{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;transition:background .2s;font-size:13px;border-bottom:1px solid var(--border)}
.model-item:last-child{border-bottom:none}
.model-item:hover{background:var(--primary-bg)}
.model-item.selected{background:var(--primary-bg);color:var(--primary);font-weight:600}
.model-item .model-id{flex:1}.model-item .model-owner{color:var(--text3);font-size:11px}
/* Test Log Panel */
.test-log-panel{background:var(--card2);border:1px solid var(--border);border-radius:8px;margin-top:12px;font-size:12px;overflow:hidden}
.test-log-panel .log-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);cursor:pointer;user-select:none;font-family:var(--font);font-weight:500}
.test-log-panel .log-body{padding:0;max-height:0;overflow:hidden;transition:max-height .3s ease}
.test-log-panel.open .log-body{max-height:400px;overflow-y:auto;padding:8px 12px}
.log-line{padding:3px 0;border-bottom:1px solid var(--border);white-space:pre-wrap;word-break:break-all;font-family:'Courier New',Consolas,monospace;font-size:11px;line-height:1.5}
.log-line:last-child{border-bottom:none}
.log-info{color:var(--primary)}.log-warn{color:var(--orange)}.log-error{color:var(--red)}.log-debug{color:var(--text3)}.log-success{color:var(--green)}
/* Skeleton Loading */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 37%,var(--bg2) 63%);background-size:800px 100%;animation:shimmer 1.5s infinite;border-radius:6px}
.sk-card{background:var(--card);border-radius:var(--radius);padding:20px;border:1px solid var(--border)}
.sk-line{height:14px;margin-bottom:10px}
.sk-line.w60{width:60%}.sk-line.w40{width:40%}.sk-line.w80{width:80%}.sk-line.w30{width:30%}
.sk-circle{border-radius:50%}
.sk-block{height:120px;margin-bottom:12px}
@media(max-width:768px){.sidebar{transform:translateX(-100%);width:240px}.sidebar.open{transform:translateX(0)}.sidebar-overlay.open{display:block}.main-area{margin-left:0}.hamburger{display:block}.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.topbar{padding:0 16px}.content{padding:16px}.modal{padding:20px;width:95%}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" class="page active login-page">
<div class="login-box">
<div style="text-align:center;margin-bottom:16px"><span style="font-size:42px">⚙️</span></div>
<h2>飞天管理控制台</h2>
<p style="text-align:center;color:var(--text3);margin-bottom:24px;font-size:14px">AI 助手配置 · 系统监控 · 权限管理</p>
<div class="form-group"><label>手机号</label><input type="tel" placeholder="管理员手机号" id="l-phone"></div>
<div class="form-group"><label>密码</label><input type="password" placeholder="密码" id="l-pwd"></div>
<button class="btn btn-primary" style="width:100%;justify-content:center;padding:14px" onclick="doLogin()">登 录</button>
<div style="text-align:center;margin-top:20px"><a href="/" style="color:var(--text3);font-size:13px;text-decoration:none">← 用户入口</a></div>
</div>
</div>

<!-- MAIN -->
<div id="main-app" class="page">
<div class="app-layout">
<div class="sidebar" id="sidebar">
<div class="logo"><i class="fas fa-cogs"></i> 飞天控制台</div>
<nav class="sidebar-nav" id="sidebar-nav">
<div class="sidebar-group">总览</div>
<a class="active" data-page="overview"><i class="fas fa-tachometer-alt"></i> 系统总览</a>
<div class="sidebar-group">权限管理</div>
<a data-page="permissions"><i class="fas fa-user-shield"></i> 角色权限</a>
<a data-page="users"><i class="fas fa-users"></i> 用户管理</a>
<div class="sidebar-group">AI 配置</div>
<a data-page="ai-model"><i class="fas fa-plug"></i> 模型接入</a>
<a data-page="agent-dashboard"><i class="fas fa-robot"></i> Agent 管理</a>
<a data-page="ai-knowledge"><i class="fas fa-book"></i> 知识库</a>
<a data-page="ai-audit"><i class="fas fa-clipboard-list"></i> 配置审计</a>
<a data-page="ai-backup"><i class="fas fa-cloud-download-alt"></i> 配置备份</a>

  <div class="sidebar-config-title"><i class="fas fa-sliders-h"></i><span>配置中心</span></div>
  <div class="sidebar-config-body" id="sidebar-config-body">
    <a class="sidebar-sub" data-page="config-center" data-section="market"><i class="fas fa-chart-line"></i> 行情数据配置</a>
    <a class="sidebar-sub" data-page="config-center" data-section="gateway"><i class="fas fa-exchange-alt"></i> 交易网关</a>
    <a class="sidebar-sub" data-page="config-center" data-section="system"><i class="fas fa-cog"></i> 系统配置</a>
  </div>
</div>
<a data-page="strategy-templates"><i class="fas fa-copy"></i> 策略模板</a>
<a data-page="backups"><i class="fas fa-database"></i> 数据备份</a>
<a data-page="logs"><i class="fas fa-scroll"></i> 审计日志</a>
<a data-page="alerts"><i class="fas fa-bell"></i> 系统告警</a>
</nav>
<div style="padding:12px 20px;border-top:1px solid var(--border)">
<button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;color:var(--red)" onclick="doLogout()"><i class="fas fa-sign-out-alt"></i> 退出</button>
</div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
<div class="main-area">
<div class="topbar">
<div class="topbar-left"><button class="hamburger" onclick="openSidebar()"><i class="fas fa-bars"></i></button><span style="font-weight:600"><i class="fas fa-shield-alt" style="color:var(--orange);margin-right:6px"></i>管理控制台</span></div>
<div class="topbar-right"><button class="btn btn-ghost btn-sm" onclick="toggleDark()" id="theme-btn"><i class="fas fa-moon"></i></button><div class="avatar">管</div></div>
</div>
<div class="content" id="main-content"></div>
</div>
</div>
</div>

<div class="modal-overlay" id="gm"><div class="modal" id="gm-body"></div></div>

<script>
const API='';
let TK=localStorage.getItem('atk')||'';
let U=JSON.parse(localStorage.getItem('au')||'null');
let CUR='overview';

/* 测试账号预填：?test=admin（仅开发/测试用） */
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('test')==='admin'){
    const lp=document.getElementById('l-phone'),lpw=document.getElementById('l-pwd');
    if(lp&&lpw){lp.value='13800000000';lpw.value='Test@Admin000';}
  }

/* API */
async function api(p,o={}){
  const h={'Content-Type':'application/json',...(o.headers||{})};if(TK)h['Authorization']='Bearer '+TK;
  const to=o.timeout!==undefined?o.timeout:8000;const ac=new AbortController();const tid=setTimeout(()=>ac.abort(),to);
  try{
    const r=await fetch(API+p,{...o,headers:h,signal:ac.signal});
    clearTimeout(tid);
    const d=await r.json();
    if(!r.ok&&r.status===401){
      doLogout();return null;
    }
    return d;
  }catch(e){
    clearTimeout(tid);
    if(e.name==='AbortError')console.warn('API timeout:',p);else console.error(e);
    return null;
  }
}

let _testLogs=[];let _testLogVerbose=false;
let _testLogLevelFilter={INFO:true,WARN:true,ERROR:true};
function _beijingTimeStr(){const d=new Date();const p=(n,c)=>String(n).padStart(c,'0');const h=(d.getUTCHours()+8)%24,m=d.getUTCMinutes(),s=d.getUTCSeconds(),ms=d.getUTCMilliseconds();return p(h,2)+':'+p(m,2)+':'+p(s,2)+'.'+p(ms,3);}
function appendTestLog(level,msg,data){const ts=_beijingTimeStr();_testLogs.push({ts,level,msg,data:data||null});}
function clearTestLogs(){_testLogs=[];}
function _testLogLevel(l){const lev=l.level||'INFO';return lev==='ERROR'||lev==='WARN'?lev:'INFO';}
function renderTestLogPanel(containerId,title){
  const el=document.getElementById(containerId);if(!el)return;
  const byLevel=_testLogs.filter(l=>_testLogLevelFilter[_testLogLevel(l)]!==false);

  const logTitle=title||(containerId==='market-test-log'?'行情数据源日志':'测试日志');
  const toggleTestLevel=(lev)=>{_testLogLevelFilter[lev]=!_testLogLevelFilter[lev];renderTestLogPanel(containerId,logTitle);};
  let h=`<div class="test-log-panel${logs.length>0?' open':''}" id="tlp-${containerId}">
    <div class="log-header" onclick="this.parentElement.classList.toggle('open')">

          <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_testLogLevelFilter.WARN?'checked':''} onchange="toggleTestLevel('WARN')"> WARN</label>
          <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_testLogLevelFilter.ERROR?'checked':''} onchange="toggleTestLevel('ERROR')"> ERROR</label>
        </span>
        <label style="font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer" onclick="event.stopPropagation()">
          <button class="toggle ${_testLogVerbose?'on':''}" style="width:32px;height:18px" onclick="event.stopPropagation();_testLogVerbose=!_testLogVerbose;renderTestLogPanel('${containerId}','${logTitle}')"></button>
          详细
        </label>
        <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();_copyTestLogs()" title="复制日志"><i class="fas fa-copy"></i></button>

      </span>
    </div>
    <div class="log-body">`;
  logs.forEach(l=>{
    const cls=l.level==='ERROR'?'log-error':l.level==='WARN'?'log-warn':l.level==='DEBUG'?'log-debug':l.level==='SUCCESS'?'log-success':'log-info';
    h+=`<div class="log-line ${cls}"><span style="opacity:.6">[${_escHtml(l.ts)}]</span> <b>[${_escHtml(l.level)}]</b> ${_escHtml(l.msg)}`;
    if(_testLogVerbose){const extra={};Object.keys(l).forEach(k=>{if(k!=='ts'&&k!=='level'&&k!=='msg')extra[k]=l[k];});if(Object.keys(extra).length){const extraStr=JSON.stringify(extra,null,2);h+=`<pre style="margin:4px 0 0 0;font-size:11px;opacity:.85;white-space:pre-wrap;word-break:break-all">${_escHtml(extraStr)}</pre>`;}}

function _escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function _escAttr(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function _copyBackupLog(){

/* ===== SWR (Stale-While-Revalidate) Cache ===== */
const _apiCache={};
const _API_CACHE_TTL=30000; /* 30s - show cached data immediately, refresh in background */

function apiCacheGet(path){
  const entry=_apiCache[path];
  if(entry&&(Date.now()-entry.ts)<_API_CACHE_TTL) return entry.data;
  return null;
}
function apiCacheSet(path,data){
  _apiCache[path]={data,ts:Date.now()};
}

  ({overview:rOverview,permissions:rPerms,users:rUsers,'ai-model':rAiModel,'ai-knowledge':rAiKnowledge,'ai-config':rAiCfg,'ai-audit':rAiAudit,'ai-backup':rAiBak,'agent-dashboard':rAgentDash,'config-center':rCfgCenter,'strategy-templates':rStrategyTemplates,backups:rBackups,logs:rLogs,alerts:rAlerts}[CUR]||rOverview)(c);

async function rOverview(c,_silent){

  const cachedAl=apiCacheGet('/alerts');
  const hasCache=!!(cachedH&&cachedOps&&cachedComp&&cachedMet);

  if(!_silent&&!hasCache) skeleton(c,'overview');

  /* If we have cached data and not silent, render from cache immediately then refresh */
  let hRes,opsRes,compRes,metRes,timeSourcesRes,alertsRes;

    hRes=cachedH;opsRes=cachedOps;compRes=cachedComp;metRes=cachedMet;
    timeSourcesRes=cachedTS||null;alertsRes=cachedAl||null;
  } else {
    [hRes,opsRes,compRes,metRes,timeSourcesRes,alertsRes]=await Promise.all([
      api('/system/health'),api('/ops/status'),api('/ops/components'),api('/ops/metrics-summary'),
      api('/ops/time-sources'),api('/alerts?limit=5')
    ]);
    if(hRes) apiCacheSet('/system/health',hRes);
    if(opsRes) apiCacheSet('/ops/status',opsRes);
    if(compRes) apiCacheSet('/ops/components',compRes);
    if(metRes) apiCacheSet('/ops/metrics-summary',metRes);
    if(timeSourcesRes) apiCacheSet('/ops/time-sources',timeSourcesRes);

  }

  const httpM=met.http||{};const ordM=met.orders||{};const dataM=met.data||{};
  const sysInfo=od.system||{};const proc=od.process||{};
  const dbPool=od.db_pool||{};const redisI=od.redis_info||{};

    /* Prometheus 资源趋势 */
    s+=`<div class="card"><div class="section-title"><i class="fas fa-chart-area"></i> 资源趋势</div>`;
    const cpu=res.cpu_percent||0,mem=res.memory_percent||0,disk=res.disk_percent||0;

  }

  /* 10 秒静默刷新 */
  _overviewTimer=setInterval(()=>{if(CUR==='overview')rOverview(c,true);else clearInterval(_overviewTimer);},30000);
}

let permOverrides = JSON.parse(localStorage.getItem('permOverrides')||'{}');

function getPermVal(row,col){
  const key=row[1]+'|'+col;
  if(permOverrides[key]!==undefined)return permOverrides[key];
  return row[col==='beginner'?3:col==='advanced'?4:col==='expert'?5:6];
}

function rPerms(c){
  const modules=[...new Set(PERM_MATRIX.map(r=>r[0]))];
  let curMod=window._permMod||modules[0];
  window._permMod=curMod;
  const filtered=PERM_MATRIX.filter(r=>r[0]===curMod);

  let h=getBreadcrumb('permissions');
  h+=`<div class="content-header"><h1><i class="fas fa-user-shield" style="color:var(--primary)"></i> 角色权限管理</h1>
  <div style="display:flex;gap:8px"><button class="btn btn-outline btn-sm" onclick="resetPerms()"><i class="fas fa-undo"></i> 重置</button><button class="btn btn-primary btn-sm" onclick="savePerms()"><i class="fas fa-save"></i> 保存修改</button></div></div>`;

  // 角色说明卡片
  h+=`<div class="grid-4 stagger" style="margin-bottom:24px">
  <div class="card" style="border-left:4px solid var(--green);padding:16px"><div style="font-weight:700;color:var(--green)">新手散户</div><div style="font-size:12px;color:var(--text3);margin-top:4px">经验≤1年 · 策略≤5</div></div>
  <div class="card" style="border-left:4px solid var(--primary);padding:16px"><div style="font-weight:700;color:var(--primary)">进阶散户</div><div style="font-size:12px;color:var(--text3);margin-top:4px">经验1-3年 · 策略5-20</div></div>
  <div class="card" style="border-left:4px solid var(--orange);padding:16px"><div style="font-weight:700;color:var(--orange)">资深散户</div><div style="font-size:12px;color:var(--text3);margin-top:4px">经验≥3年 · 策略≥20</div></div>
  <div class="card" style="border-left:4px solid var(--text3);padding:16px"><div style="font-weight:700;color:var(--text3)">管理员</div><div style="font-size:12px;color:var(--text3);margin-top:4px">系统运维人员</div></div>
  </div>`;

  // 模块 Tab
  h+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">`;
  modules.forEach(m=>{h+=`<span class="tag ${m===curMod?'active':''}" onclick="window._permMod='${m}';rPerms(document.getElementById('main-content'))">${m}</span>`;});
  h+=`</div>`;

  // 权限矩阵表
  h+=`<div class="card" style="overflow-x:auto"><table class="perm-matrix"><thead><tr><th>API 端点</th><th>功能</th><th style="color:var(--green)">新手散户</th><th style="color:var(--primary)">进阶散户</th><th style="color:var(--orange)">资深散户</th><th style="color:var(--text3)">管理员</th></tr></thead><tbody>`;
  filtered.forEach((r,ri)=>{
    h+=`<tr><td style="font-family:monospace;font-size:12px">${r[1]}</td><td>${r[2]}</td>`;
    ['beginner','advanced','expert','admin'].forEach(role=>{
      const v=getPermVal(r,role);
      const cls=v==='✅'?'perm-yes':v==='❌'?'perm-no':'perm-limited';
      h+=`<td class="${cls}" style="cursor:pointer" onclick="cyclePerm('${r[1]}','${role}',this)">${v}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>`;

  // 图例
  h+=`<div style="display:flex;gap:20px;margin-top:16px;font-size:13px;color:var(--text2)"><span><span style="color:var(--green);font-weight:700">✅</span> 完全可用</span><span><span style="color:var(--orange);font-weight:700">⚠️</span> 有限制</span><span><span style="color:var(--red);font-weight:700">❌</span> 不可用</span><span style="margin-left:auto;color:var(--text3)">点击单元格切换权限</span></div>`;
  c.innerHTML=h;
}

function cyclePerm(apiPath,role,el){
  const key=apiPath+'|'+role;
  const states=['✅','⚠️','❌'];
  const cur=el.textContent.trim();
  const next=states[(states.indexOf(cur)+1)%3];
  permOverrides[key]=next;
  el.textContent=next;
  el.className=next==='✅'?'perm-yes':next==='❌'?'perm-no':'perm-limited';
}

function savePerms(){localStorage.setItem('permOverrides',JSON.stringify(permOverrides));toast('权限修改已保存','success');}
function resetPerms(){permOverrides={};localStorage.removeItem('permOverrides');toast('已重置为默认','success');rPerms(document.getElementById('main-content'));}

let _usersData=[];let _usersFilter='all';
async function rUsers(c){
  skeleton(c,'table');
  const d=await api('/admin/users?limit=100');
  const rawItems=(d?.data?.items)||d?.data||d||[];
  _usersData=Array.isArray(rawItems)?rawItems.map(u=>({
    id:u.user_id||u.id,
    phone:u.phone||'',
    nickname:u.nickname||u.phone||'用户',
    role:(u.roles&&u.roles[0])||u.level||'beginner',
    status:u.status||'active',
    created_at:(u.created_at||'').substring(0,10),
    last_active:'',
    strategy_count:u.strategy_count||0,
    ai_calls_used:u.ai_calls_used??0,
    ai_calls_limit:u.ai_calls_limit??0,
    ai_calls_limit_override:u.ai_calls_limit_override,
  })):[];
  if(_usersData.length===0){
    /* 后端暂无数据时显示空状态 */
  }

  const roleNames={beginner:'新手散户',advanced:'进阶散户',expert:'资深散户',admin:'管理员'};
  const roleColors={beginner:'var(--green)',advanced:'var(--primary)',expert:'var(--orange)',admin:'var(--text3)'};
  const roleBadges={beginner:'badge-green',advanced:'badge-blue',expert:'badge-orange',admin:'badge-gray'};
  const filtered=_usersFilter==='all'?_usersData:_usersData.filter(u=>u.role===_usersFilter||(_usersFilter==='banned'&&u.status==='banned'));

  let h=getBreadcrumb('users');
  h+=`<div class="content-header"><h1><i class="fas fa-users" style="color:var(--primary);margin-right:8px"></i>用户管理</h1>
    <div style="display:flex;gap:8px"><span class="badge badge-blue">${_usersData.length} 用户</span>
    <button class="btn btn-primary btn-sm" onclick="showCreateUser()"><i class="fas fa-plus"></i> 添加用户</button></div></div>`;

  /* 统计卡片 */
  const stats={beginner:0,advanced:0,expert:0,banned:0};
  _usersData.forEach(u=>{if(u.status==='banned')stats.banned++;else if(stats[u.role]!==undefined)stats[u.role]++;});
  h+=`<div class="grid-4 stagger" style="margin-bottom:20px">
    <div class="admin-stat-card" style="cursor:pointer;${_usersFilter==='beginner'?'border:2px solid var(--green)':''}" onclick="_usersFilter=_usersFilter==='beginner'?'all':'beginner';rUsers(document.getElementById('main-content'))"><div class="icon-wrap" style="background:var(--green-bg);color:var(--green)"><i class="fas fa-seedling"></i></div><div class="num">${stats.beginner}</div><div class="label">新手散户</div></div>
    <div class="admin-stat-card" style="cursor:pointer;${_usersFilter==='advanced'?'border:2px solid var(--primary)':''}" onclick="_usersFilter=_usersFilter==='advanced'?'all':'advanced';rUsers(document.getElementById('main-content'))"><div class="icon-wrap" style="background:var(--primary-bg);color:var(--primary)"><i class="fas fa-user-graduate"></i></div><div class="num">${stats.advanced}</div><div class="label">进阶散户</div></div>
    <div class="admin-stat-card" style="cursor:pointer;${_usersFilter==='expert'?'border:2px solid var(--orange)':''}" onclick="_usersFilter=_usersFilter==='expert'?'all':'expert';rUsers(document.getElementById('main-content'))"><div class="icon-wrap" style="background:var(--orange-bg);color:var(--orange)"><i class="fas fa-user-tie"></i></div><div class="num">${stats.expert}</div><div class="label">资深散户</div></div>
    <div class="admin-stat-card" style="cursor:pointer;${_usersFilter==='banned'?'border:2px solid var(--red)':''}" onclick="_usersFilter=_usersFilter==='banned'?'all':'banned';rUsers(document.getElementById('main-content'))"><div class="icon-wrap" style="background:var(--red-bg);color:var(--red)"><i class="fas fa-ban"></i></div><div class="num">${stats.banned}</div><div class="label">已封禁</div></div>
  </div>`;

  /* 用户列表 */
  h+=`<div class="card"><div class="section-title"><i class="fas fa-list"></i> 用户列表 ${_usersFilter!=='all'?`<span class="badge badge-blue" style="margin-left:8px">筛选: ${roleNames[_usersFilter]||'已封禁'} <span style="cursor:pointer;margin-left:4px" onclick="_usersFilter='all';rUsers(document.getElementById('main-content'))">×</span></span>`:''}</div>`;
  if(filtered.length>0){
    h+=`<div style="overflow-x:auto"><table><thead><tr><th>手机号</th><th>昵称</th><th>等级</th><th>状态</th><th>策略数</th><th>AI 调用次数</th><th>注册时间</th><th>最近活跃</th><th>操作</th></tr></thead><tbody>`;
    filtered.forEach(u=>{
      const rn=roleNames[u.role]||u.role;const rc=roleColors[u.role]||'var(--text2)';const rb=roleBadges[u.role]||'badge-gray';
      const banned=u.status==='banned';
      h+=`<tr style="${banned?'opacity:.6':''}">
        <td style="font-family:var(--font-num)">${u.phone||'—'}</td>
        <td style="font-weight:500">${u.nickname||'—'}</td>
        <td><span class="badge ${rb}">${rn}</span></td>
        <td><span class="badge ${banned?'badge-red':'badge-green'}">${banned?'已封禁':'正常'}</span></td>
        <td style="font-family:var(--font-num)">${u.strategy_count??0}</td>
        <td style="font-family:var(--font-num)">${(u.ai_calls_used??0)+'/'+(u.ai_calls_limit??0)}</td>
        <td style="font-size:13px;color:var(--text3)">${u.created_at||'—'}</td>
        <td style="font-size:13px;color:var(--text3)">${u.last_active||'—'}</td>
        <td style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn btn-sm btn-ghost" onclick="showEditUser('${String(u.id).replace(/'/g,"\\'")}','${String(u.nickname||'').replace(/'/g,"\\'")}',${u.ai_calls_limit_override!=null?u.ai_calls_limit_override:'null'})" title="编辑"><i class="fas fa-edit"></i></button>
          <button class="btn btn-sm btn-ghost" onclick="showUserRole('${String(u.id).replace(/'/g,"\\'")}','${String(u.role).replace(/'/g,"\\'")}')" title="调整等级"><i class="fas fa-level-up-alt"></i></button>
          <button class="btn btn-sm btn-ghost" onclick="showResetPassword('${String(u.id).replace(/'/g,"\\'")}')" title="重置密码"><i class="fas fa-key"></i></button>
          <button class="btn btn-sm btn-ghost" style="color:${banned?'var(--green)':'var(--red)'}" onclick="toggleUserBan('${String(u.id).replace(/'/g,"\\'")}',${banned})" title="${banned?'解封':'封禁'}"><i class="fas fa-${banned?'unlock':'ban'}"></i></button>
          <button class="btn btn-sm btn-ghost" style="color:var(--red)" onclick="softDeleteUser('${String(u.id).replace(/'/g,"\\'")}')" title="删除"><i class="fas fa-trash"></i></button>
        </td></tr>`;
    });
    h+=`</tbody></table></div>`;
  } else {
    h+=`<div class="empty-state" style="padding:30px"><i class="fas fa-users"></i><p>暂无用户数据</p></div>`;
  }
  h+=`</div>`;
  c.innerHTML=h;
}

function showUserRole(uid,curRole){
  const roles=[{id:'beginner',name:'新手散户'},{id:'advanced',name:'进阶散户'},{id:'expert',name:'资深散户'},{id:'admin',name:'管理员'}];
  let opts='';roles.forEach(r=>{opts+=`<option value="${r.id}" ${r.id===curRole?'selected':''}>${r.name}</option>`;});
  document.getElementById('gm-body').innerHTML=`<h3>调整用户等级</h3>
    <div class="form-group"><label>用户 ID</label><input value="${uid}" disabled></div>
    <div class="form-group"><label>新等级</label><select id="ur-role">${opts}</select></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-outline" onclick="closeModal('gm')">取消</button>
      <button class="btn btn-primary" onclick="saveUserRole('${String(uid).replace(/'/g,"\\'")}')"><i class="fas fa-save"></i> 保存</button></div>`;
  openModal('gm');
}
async function saveUserRole(uid){
  const role=document.getElementById('ur-role').value;
  await api(`/admin/users/${uid}/role`,{method:'PUT',body:JSON.stringify({role})});
  closeModal('gm');toast('等级已更新','success');rUsers(document.getElementById('main-content'));
}
async function toggleUserBan(uid,isBanned){
  if(!confirm(isBanned?'确认解封该用户？':'确认封禁该用户？'))return;
  await api(`/admin/users/${uid}/${isBanned?'unban':'ban'}`,{method:'PUT'});
  toast(isBanned?'已解封':'已封禁','success');rUsers(document.getElementById('main-content'));
}
function showCreateUser(){
  document.getElementById('gm-body').innerHTML=`<h3>添加用户</h3>
    <div class="form-group"><label>手机号</label><input id="cu-phone" placeholder="11位手机号" maxlength="32"></div>
    <div class="form-group"><label>密码</label><input type="password" id="cu-password" placeholder="6-64位，含字母和数字"></div>
    <div class="form-group"><label>昵称</label><input id="cu-nickname" placeholder="可选"></div>
    <div class="form-group"><label>等级</label><select id="cu-role"><option value="beginner">新手散户</option><option value="advanced">进阶散户</option><option value="expert">资深散户</option><option value="admin">管理员</option></select></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-outline" onclick="closeModal('gm')">取消</button>
      <button class="btn btn-primary" onclick="saveCreateUser()"><i class="fas fa-save"></i> 创建</button></div>`;
  openModal('gm');
}
async function saveCreateUser(){
  const phone=document.getElementById('cu-phone').value.trim();
  const password=document.getElementById('cu-password').value;
  const nickname=document.getElementById('cu-nickname').value.trim()||null;
  const role=document.getElementById('cu-role').value;
  if(!phone||!password){toast('手机号和密码必填','error');return;}
  await api('/admin/users',{method:'POST',body:JSON.stringify({phone,password,nickname,role})});
  closeModal('gm');toast('用户已创建','success');rUsers(document.getElementById('main-content'));
}
function showEditUser(uid,nickname,aiLimitOverride){
  const ov=aiLimitOverride!=null&&aiLimitOverride!=='null'?String(aiLimitOverride):'';
  document.getElementById('gm-body').innerHTML=`<h3>编辑用户</h3>
    <div class="form-group"><label>用户 ID</label><input value="${(uid||'').replace(/"/g,'&quot;')}" disabled></div>
    <div class="form-group"><label>昵称</label><input id="eu-nickname" value="${(nickname||'').replace(/"/g,'&quot;')}" placeholder="可选"></div>
    <div class="form-group"><label>手机号</label><input id="eu-phone" placeholder="留空则不修改，输入新手机号以更换"></div>
    <div class="form-group"><label>AI 限额（每日）</label><input type="number" id="eu-ai-limit" value="${ov}" placeholder="留空=按角色，输入数字=覆盖" min="0" max="999"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-outline" onclick="closeModal('gm')">取消</button>
      <button class="btn btn-primary" onclick="saveEditUser('${String(uid).replace(/'/g,"\\'")}')"><i class="fas fa-save"></i> 保存</button></div>`;
  openModal('gm');
}
async function saveEditUser(uid){
  const nickname=document.getElementById('eu-nickname').value.trim()||null;
  const phone=document.getElementById('eu-phone').value.trim()||null;
  const aiRaw=document.getElementById('eu-ai-limit').value.trim();
  const body={};
  if(nickname!==null)body.nickname=nickname;
  if(phone!==null)body.phone=phone;
  body.ai_calls_limit=aiRaw===''?-1:Math.max(0,parseInt(aiRaw,10)||0);
  await api(`/admin/users/${uid}`,{method:'PUT',body:JSON.stringify(body)});
  closeModal('gm');toast('已保存','success');rUsers(document.getElementById('main-content'));
}
function showResetPassword(uid){
  document.getElementById('gm-body').innerHTML=`<h3>重置密码</h3>
    <div class="form-group"><label>用户 ID</label><input value="${(uid||'').replace(/"/g,'&quot;')}" disabled></div>
    <div class="form-group"><label>新密码</label><input type="password" id="rp-password" placeholder="6-64位，含字母和数字"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px">
      <button class="btn btn-outline" onclick="closeModal('gm')">取消</button>
      <button class="btn btn-primary" onclick="saveResetPassword('${String(uid).replace(/'/g,"\\'")}')"><i class="fas fa-key"></i> 重置</button></div>`;
  openModal('gm');
}
async function saveResetPassword(uid){
  const new_password=document.getElementById('rp-password').value;
  if(!new_password||new_password.length<6){toast('密码至少6位','error');return;}
  await api(`/admin/users/${uid}/reset-password`,{method:'PUT',body:JSON.stringify({new_password})});
  closeModal('gm');toast('密码已重置','success');rUsers(document.getElementById('main-content'));
}
async function softDeleteUser(uid){
  if(!confirm('确认删除该用户？删除后用户将无法登录。'))return;
  await api(`/admin/users/${uid}/soft-delete`,{method:'PUT'});
  toast('已删除','success');rUsers(document.getElementById('main-content'));
}

  openai:{name:'OpenAI',endpoint:'https://api.openai.com/v1',models:['gpt-4o','gpt-4o-mini','o1','o1-mini','o3-mini','gpt-4-turbo'],cat:'国际'},

const ROUTE_STRATEGIES=[
  {id:'primary_backup',name:'主备切换',desc:'主 Key 失败自动切换到备 Key',icon:'fa-shield-alt'},
  {id:'round_robin',name:'轮询分担',desc:'请求均匀分配到所有 Key',icon:'fa-sync-alt'},
  {id:'weighted',name:'权重分配',desc:'按配置的权重比例分配请求',icon:'fa-balance-scale'},
  {id:'by_model',name:'按模型路由',desc:'不同模型使用不同 Key',icon:'fa-project-diagram'},
];
let _aiCfgCache={};let _editKeyIdx=-1;let _aiModelTab='keys'; /* keys | params | usage */

async function loadAiCfgs(){
  const d=await api('/ai-config/');const cfgs=d?.data||d||[];
  _aiCfgCache={};
  if(Array.isArray(cfgs))cfgs.forEach(c=>{_aiCfgCache[c.key]=c.value;});
}
function cfgVal(key,fallback){
  const v=_aiCfgCache[key];
  if(v===undefined||v===null)return fallback;
  if(typeof v==='object'&&v!==null)return v;
  return v;
}
async function saveCfg(key,value,desc){
  return await api('/ai-config/',{method:'POST',body:JSON.stringify({key,value:typeof value==='object'?value:{v:value},description:desc||''})});
}

async function rAiModel(c){
  skeleton(c,'generic');await loadAiCfgs();
  const keys=cfgVal('llm_keys',{keys:[],strategy:'primary_backup',default_model:''})||{keys:[],strategy:'primary_backup',default_model:''};
  const kList=keys.keys||[];const strategy=keys.strategy||'primary_backup';const defModel=keys.default_model||'';
  const limits=cfgVal('ai_usage_limits',{beginner:10,advanced:30,expert:100})||{beginner:10,advanced:30,expert:100};
  const hasActive=kList.some(k=>k.enabled!==false);
  const pp={...DEFAULT_LLM_PARAMS,...(cfgVal('llm_params',DEFAULT_LLM_PARAMS)||{})};
  const usage=cfgVal('key_usage',{})||{};

  let h=getBreadcrumb('ai-model');
  h+=`<div class="content-header"><h1><i class="fas fa-plug" style="color:var(--primary)"></i> 模型接入</h1>
    <div style="display:flex;gap:8px"><span class="badge ${hasActive?'badge-green':'badge-red'}">${hasActive?'<i class="fas fa-check-circle"></i> '+kList.filter(k=>k.enabled!==false).length+' 个 Key 可用':'<i class="fas fa-exclamation-circle"></i> 未配置'}</span>
    <button class="btn btn-primary btn-sm" onclick="showAddKey()"><i class="fas fa-plus"></i> 添加 Key</button></div></div>`;

  /* Tab 切换 */
  h+=`<div class="tab-bar" style="margin-bottom:20px">
    <div class="tab ${_aiModelTab==='keys'?'active':''}" onclick="_aiModelTab='keys';rAiModel(document.getElementById('main-content'))"><i class="fas fa-key" style="margin-right:4px"></i>供应商 & Key</div>
    <div class="tab ${_aiModelTab==='params'?'active':''}" onclick="_aiModelTab='params';rAiModel(document.getElementById('main-content'))"><i class="fas fa-sliders-h" style="margin-right:4px"></i>推理参数</div>
    <div class="tab ${_aiModelTab==='usage'?'active':''}" onclick="_aiModelTab='usage';rAiModel(document.getElementById('main-content'))"><i class="fas fa-chart-area" style="margin-right:4px"></i>用量统计</div>
  </div>`;

  /* ===== Tab: 供应商 & Key ===== */
  if(_aiModelTab==='keys'){
    /* API Keys 表格 */
    h+=`<div class="card" style="margin-bottom:16px"><div class="section-title"><i class="fas fa-key"></i> API Key 列表</div>`;
    if(kList.length>0){
      h+=`<table><thead><tr><th>标签</th><th>供应商</th><th>模型</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody>`;
      kList.forEach((k,i)=>{
        const pInfo=LLM_PROVIDERS[k.provider]||{name:k.provider};
        const en=k.enabled!==false;const role=k.role==='backup'?'备':'主';
        const u=usage[k.label||'key_'+i]||{calls:0,tokens:0,cost:0};
        h+=`<tr style="${!en?'opacity:.5':''}">
          <td style="font-weight:600">${k.label||'Key '+(i+1)}</td>
          <td><span class="badge badge-blue">${pInfo.name}</span></td>
          <td style="font-size:13px;font-family:var(--font-num)">${k.model||defModel||'--'}</td>
          <td><span class="badge ${k.role==='backup'?'badge-orange':'badge-green'}">${role}</span> ${k.weight?'<span style="font-size:11px;color:var(--text3)">权重'+k.weight+'</span>':''}</td>
          <td><button class="toggle ${en?'on':''}" onclick="toggleKey(${i})"></button></td>
          <td style="display:flex;gap:4px">
            <button class="btn btn-sm btn-ghost" onclick="testKeyConn(${i})" title="测试"><i class="fas fa-bolt"></i></button>
            <button class="btn btn-sm btn-ghost" onclick="showEditKey(${i})" title="编辑"><i class="fas fa-edit"></i></button>
            <button class="btn btn-sm btn-ghost" style="color:var(--red)" onclick="removeKey(${i})" title="删除"><i class="fas fa-trash"></i></button>
          </td></tr>`;
      });
      h+=`</tbody></table>`;
    } else {
      h+=`<div class="empty-state" style="padding:30px"><i class="fas fa-key"></i><p>尚未添加 API Key，点击右上角"添加 Key"开始配置</p></div>`;
    }
    h+=`</div>`;

    /* 路由策略 + 限额 */
    h+=`<div class="grid-2">`;
    h+=`<div class="card"><div class="section-title"><i class="fas fa-route"></i> 路由策略</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
    ROUTE_STRATEGIES.forEach(rs=>{
      h+=`<div style="padding:12px;border:2px solid ${rs.id===strategy?'var(--primary)':'var(--border)'};border-radius:8px;cursor:pointer;transition:all .2s${rs.id===strategy?';background:var(--primary-bg)':''}" onclick="setRouteStrategy('${rs.id}')">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="fas ${rs.icon}" style="color:${rs.id===strategy?'var(--primary)':'var(--text3)'}"></i> <b style="font-size:13px">${rs.name}</b></div>
        <div style="font-size:11px;color:var(--text3)">${rs.desc}</div></div>`;
    });
    h+=`</div>
      <div class="form-group" style="margin-top:12px"><label>默认模型</label><input id="def-model" value="${defModel}" placeholder="gpt-4o-mini"></div>
      <button class="btn btn-primary btn-sm" onclick="saveRouteStrategy()"><i class="fas fa-save"></i> 保存策略</button>
    </div>`;
    h+=`<div>

function _bindOverrideSlider(sliderId,valId,div){
  const s=document.getElementById(sliderId);const v=document.getElementById(valId);
  if(!s||!v)return;
  s.addEventListener('input',()=>{v.textContent=s.value?(parseInt(s.value)/div).toFixed(2):'默认';});
}

function _goKeyStep(n){
  /* validate before leaving step 0 */
  if(n>0&&_keyStep===0){
    const ak=document.getElementById('kk').value.trim();
    const ep=document.getElementById('ke').value.trim();
    if(!ak){toast('请输入 API Key','error');return;}
    if(!ep){toast('请输入端点地址','error');return;}
  }
  _keyStep=n;
  const steps=document.querySelectorAll('#key-stepper .step-item');
  steps.forEach((s,i)=>{s.classList.remove('active','done');if(i<n)s.classList.add('done');if(i===n)s.classList.add('active');});
  for(let i=0;i<4;i++){const body=document.getElementById('ks-'+i);if(body)body.classList.toggle('active',i===n);}
  if(n===3)_updateRoutePreview();
}

function _updateRoutePreview(){
  const el=document.getElementById('ks-route-preview');if(!el)return;
  const keys=cfgVal('llm_keys',{keys:[],strategy:'primary_backup'})||{keys:[],strategy:'primary_backup'};
  const strategy=keys.strategy||'primary_backup';
  const sInfo=ROUTE_STRATEGIES.find(s=>s.id===strategy)||ROUTE_STRATEGIES[0];
  const kList=keys.keys||[];
  const curRole=document.getElementById('kr')?.value||'primary';
  let html=`<div style="margin-bottom:8px"><i class="fas ${sInfo.icon}" style="color:var(--primary);margin-right:6px"></i><strong>${sInfo.name}</strong>: ${sInfo.desc}</div>`;
  html+=`<div style="font-size:12px;color:var(--text3)">当前 Key 角色: <strong>${curRole==='backup'?'备 Key':'主 Key'}</strong> · 已有 ${kList.length} 个 Key 配置</div>`;
  el.innerHTML=html;
}

function _clearParamOverrides(){
  ['ko-temp','ko-topp','ko-freq','ko-pres'].forEach(id=>{const s=document.getElementById(id);if(s)s.value='';});
  ['ko-temp-v','ko-topp-v','ko-freq-v','ko-pres-v'].forEach(id=>{const v=document.getElementById(id);if(v)v.textContent='默认';});
  ['ko-maxtk','ko-tout'].forEach(id=>{const inp=document.getElementById(id);if(inp)inp.value='';});
  toast('已清空参数覆盖','success');
}

function onKeyProviderChange(){
  const p=document.getElementById('kp').value;const info=LLM_PROVIDERS[p]||{};
  document.getElementById('ke').value=info.endpoint||'';
  const sel=document.getElementById('km');if(!sel)return;
  sel.innerHTML='';
  (info.models||[]).forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
  const co=document.createElement('option');co.value='_custom';co.textContent='自定义...';sel.appendChild(co);
  const kmc=document.getElementById('km-c');if(kmc)kmc.style.display='none';
  /* reset remote models */
  _fetchedModels=[];
  const rList=document.getElementById('km-remote-list');if(rList){rList.style.display='none';rList.innerHTML='';}
}

/* Fetch models from remote endpoint (provider-aware) */
async function fetchRemoteModels(){
  const ep=document.getElementById('ke').value.trim();
  const ak=document.getElementById('kk').value.trim();
  const prov=document.getElementById('kp').value;
  const statusEl=document.getElementById('km-fetch-status');
  const btn=document.getElementById('km-fetch-btn');
  if(!ep||!ak){toast('请先填写端点和 API Key','error');return;}
  btn.disabled=true;statusEl.textContent='正在获取...';
  try{
    const resp=await api('/ai-config/fetch-models',{method:'POST',body:JSON.stringify({provider:prov,endpoint:ep,api_key:ak})});
    const body=resp?.data||resp||{};
    const source=body.source||'remote';
    const models=body.models||[];

    if(source==='static'||models.length===0){
      /* C类/D类供应商: 后端不支持远程获取，使用前端预置列表 */
      const info=LLM_PROVIDERS[prov]||{};
      if(info.models&&info.models.length){
        _fetchedModels=info.models.map(m=>({id:m,owned_by:info.name||''}));
        statusEl.textContent=source==='static'?'该供应商不支持动态获取，显示预设列表':'未获取到模型，已加载预置列表';
      }else{
        _fetchedModels=[];
        statusEl.textContent='未获取到模型，请使用下方手动输入';
      }
      _renderRemoteModels();return;
    }
    _fetchedModels=models;
    statusEl.textContent=`远程获取到 ${models.length} 个模型`;
    _renderRemoteModels();
  }catch(e){
    statusEl.textContent='获取失败: '+(e.message||'网络错误');
    _fetchedModels=[];
    /* fallback: show preset models from LLM_PROVIDERS */
    const info=LLM_PROVIDERS[prov]||{};
    if(info.models&&info.models.length){
      _fetchedModels=info.models.map(m=>({id:m,owned_by:info.name||''}));
      statusEl.textContent+=' · 已加载预置模型列表';
      _renderRemoteModels();
    }
  }finally{btn.disabled=false;}
}

function _renderRemoteModels(){
  const container=document.getElementById('km-remote-list');
  if(!container)return;
  const keyword=(document.getElementById('km-search')?.value||'').toLowerCase();
  const filtered=_fetchedModels.filter(m=>{
    const id=(m.id||'').toLowerCase();const owner=(m.owned_by||'').toLowerCase();
    return !keyword||id.includes(keyword)||owner.includes(keyword);
  });
  if(filtered.length===0){container.style.display='none';return;}
  container.style.display='block';
  const curModel=document.getElementById('km')?.value||'';
  container.innerHTML=filtered.map(m=>`<div class="model-item ${m.id===curModel?'selected':''}" onclick="_selectRemoteModel('${m.id.replace(/'/g,"\\'")}')"><span class="model-id">${m.id}</span><span class="model-owner">${m.owned_by||''}</span></div>`).join('');
}

function _selectRemoteModel(modelId){
  /* set the select dropdown */
  const sel=document.getElementById('km');
  if(sel){
    /* add option if not present */
    let found=false;for(const o of sel.options){if(o.value===modelId){found=true;break;}}
    if(!found){const o=document.createElement('option');o.value=modelId;o.textContent=modelId;sel.insertBefore(o,sel.lastElementChild);}
    sel.value=modelId;
    const kmc=document.getElementById('km-c');if(kmc)kmc.style.display='none';
  }
  _renderRemoteModels();
  toast(`已选择模型: ${modelId}`,'success');
}

function _filterModelList(){_renderRemoteModels();}

async function saveKey(){
  const label=document.getElementById('kl').value.trim()||'Key';
  const provider=document.getElementById('kp').value;
  const api_key=document.getElementById('kk').value.trim();
  const api_key_backup=document.getElementById('kk2')?.value.trim()||'';

  const keys=cfgVal('llm_keys',{keys:[],strategy:'primary_backup',default_model:''});
  const kList=[...(keys.keys||[])];
  const entry={label,provider,api_key,api_key_backup,endpoint,model,role,weight,enabled:true};
  if(Object.keys(po).length>0)entry.params_override=po;
  if(_editKeyIdx>=0)kList[_editKeyIdx]=entry;else kList.push(entry);
  const saveResult=await saveCfg('llm_keys',{...keys,keys:kList},'LLM Keys');
  if(!saveResult||saveResult.detail){

  }

  const primary=kList.find(k=>k.role!=='backup'&&k.enabled!==false);
  if(primary){
    await saveCfg('llm_provider',{v:primary.provider},'LLM 服务商');
    await saveCfg('llm_api_key',{v:primary.api_key},'LLM API Key');
    await saveCfg('llm_endpoint',{v:primary.endpoint},'LLM 端点');

  document.getElementById('gm-body').style.maxWidth='';
  closeModal('gm');toast('Key 已保存','success');rAiModel(document.getElementById('main-content'));

async function testKeyConn(i){
  clearTestLogs();
  const r=document.getElementById('key-test-result');
  r.innerHTML='<div style="padding:12px;text-align:center"><i class="fas fa-spinner fa-spin" style="color:var(--primary)"></i> 测试中...</div>';
  const keys=cfgVal('llm_keys',{keys:[]}).keys||[];const k=keys[i];
  if(!k){r.innerHTML='';return;}
  const keyName=k.label||'Key '+(i+1);
  appendTestLog('INFO',`开始测试: ${keyName}`);
  appendTestLog('DEBUG','供应商: '+(LLM_PROVIDERS[k.provider]||{}).name||k.provider);
  appendTestLog('DEBUG','端点: '+k.endpoint);
  appendTestLog('DEBUG','API Key: '+_maskKey(k.api_key));
  appendTestLog('INFO','POST /ai-config/test-connection {key_index: '+i+', verbose: true}');
  const t0=Date.now();
  try{
    /* 测试 LLM 会请求外部接口，后端最多等约 15s，前端给 25s 避免误报“后端不可达” */
    const d=await api('/ai-config/test-connection',{method:'POST',body:JSON.stringify({key_index:i,verbose:true}),timeout:25000});
    const ms=Date.now()-t0;
    appendTestLog('DEBUG','HTTP 响应耗时: '+ms+'ms');
    if(!d){
      appendTestLog('ERROR','后端服务不可达，请检查后端是否运行');
      r.innerHTML=`<div style="padding:14px;background:var(--red-bg);border-radius:8px;border-left:3px solid var(--red)"><i class="fas fa-times-circle" style="color:var(--red)"></i> <b>${keyName} 测试失败</b><br><span style="font-size:13px;color:var(--text2)">后端服务不可达，请检查后端是否运行</span></div>`;
      appendTestLog('INFO',`测试完成 | 总耗时: ${ms}ms`);renderTestLogPanel('key-test-log');return;
    }
    if(d.data?.verbose_log){d.data.verbose_log.forEach(vl=>appendTestLog('DEBUG',vl.msg,vl.data));}
    if(d.code===0&&d.data?.success){
      appendTestLog('SUCCESS',`连接成功 | 延迟: ${d.data.latency_ms||ms}ms | 模型: ${d.data.model||'--'}`);
      r.innerHTML=`<div style="padding:14px;background:var(--green-bg);border-radius:8px;border-left:3px solid var(--green)"><i class="fas fa-check-circle" style="color:var(--green)"></i> <b>${keyName} 连接成功</b><br><span style="font-size:13px;color:var(--text2)">响应: ${d.data.latency_ms||ms}ms | 模型: ${d.data.model||'--'}</span></div>`;
    } else {
      const err=d?.data?.error||d?.message||d?.detail||'请检查配置';
      const tid=d?.data?.tenant_id;
      appendTestLog('ERROR',`连接失败: ${err}`);
      if(tid)appendTestLog('DEBUG','当前租户: '+tid);
      if(d?.data)appendTestLog('DEBUG','响应详情',d.data);
      r.innerHTML=`<div style="padding:14px;background:var(--red-bg);border-radius:8px;border-left:3px solid var(--red)"><i class="fas fa-times-circle" style="color:var(--red)"></i> <b>${keyName} 连接失败</b><br><span style="font-size:13px;color:var(--text2)">${err}</span>${tid?'<br><span style="font-size:12px;opacity:.8">租户: '+tid+'</span>':''}</div>`;
    }
  }catch(e){
    appendTestLog('ERROR','请求异常: '+e.message);
    r.innerHTML=`<div style="padding:14px;background:var(--red-bg);border-radius:8px;border-left:3px solid var(--red)"><i class="fas fa-times-circle" style="color:var(--red)"></i> <b>${keyName} 请求异常</b><br><span style="font-size:13px;color:var(--text2)">${e.message}</span></div>`;
  }
  appendTestLog('INFO',`测试完成 | 总耗时: ${Date.now()-t0}ms`);
  renderTestLogPanel('key-test-log');
}

  const agentStates=cfgVal('agent_states',{})||{};

  let h=getBreadcrumb('agent-dashboard');
  h+=`<div class="content-header"><h1><i class="fas fa-robot" style="color:var(--primary)"></i> Agent 管理</h1>
    <button class="btn btn-outline btn-sm" onclick="refreshAgentDash()"><i class="fas fa-sync"></i> 刷新</button></div>`;

  /* Summary stats 顶部 */
  const runningCnt=AGENTS_DEF.filter(a=>(agentStates[a.id]||{status:'running'}).status!=='stopped').length;
  h+=`<div class="grid-3 stagger" style="margin-bottom:20px">
    <div class="admin-stat-card"><div class="icon-wrap" style="background:var(--green-bg);color:var(--green)"><i class="fas fa-play-circle"></i></div><div class="num">${runningCnt}/${AGENTS_DEF.length}</div><div class="label">运行中</div></div>
    <div class="admin-stat-card"><div class="icon-wrap" style="background:var(--primary-bg);color:var(--primary)"><i class="fas fa-phone-volume"></i></div><div class="num">${Object.values(agentStates).reduce((s,a)=>s+(a.calls||0),0)}</div><div class="label">总调用</div></div>
    <div class="admin-stat-card"><div class="icon-wrap" style="background:var(--orange-bg);color:var(--orange)"><i class="fas fa-user-friends"></i></div><div class="num">${AGENTS_DEF.filter(a=>a.facing==='散户').length}</div><div class="label">面向散户</div></div>
  </div>`;

  /* Agent 卡片（含提示词配置入口） */
  h+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;margin-bottom:20px">`;
  AGENTS_DEF.forEach(agent=>{
    const st=agentStates[agent.id]||{status:'running',accuracy:0,latency:0,calls:0};
    const running=st.status!=='stopped';
    const statusColor=running?'var(--green)':'var(--red)';
    /* 查找该 Agent 的提示词配置 */
    const promptKey=`prompt_${agent.id}_beginner`;
    const hasPrompt=!!cfgVal(promptKey,null);
    h+=`<div class="card" style="border-left:3px solid ${statusColor}">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div style="width:40px;height:40px;border-radius:10px;background:var(--primary-bg);display:flex;align-items:center;justify-content:center"><i class="fas ${agent.icon}" style="color:var(--primary);font-size:18px"></i></div>
        <div style="flex:1"><div style="font-weight:600;font-size:14px">${agent.name}</div><div style="font-size:11px;color:var(--text3)">${agent.desc} · <span class="badge ${agent.facing==='散户'?'badge-blue':'badge-gray'}" style="font-size:10px">${agent.facing}</span></div></div>
        <button class="toggle ${running?'on':''}" onclick="toggleAgent('${agent.id}')"></button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px;margin-bottom:10px">
        <div style="padding:8px;background:var(--card2);border-radius:6px;text-align:center"><div style="color:var(--text3)">准确率</div><div style="font-size:16px;font-weight:700;color:var(--primary);font-family:var(--font-num)">${st.accuracy||'--'}%</div></div>
        <div style="padding:8px;background:var(--card2);border-radius:6px;text-align:center"><div style="color:var(--text3)">延迟</div><div style="font-size:16px;font-weight:700;color:var(--orange);font-family:var(--font-num)">${st.latency||'--'}ms</div></div>
        <div style="padding:8px;background:var(--card2);border-radius:6px;text-align:center"><div style="color:var(--text3)">调用</div><div style="font-size:16px;font-weight:700;font-family:var(--font-num)">${st.calls||0}</div></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" onclick="showAgentPromptEditor('${agent.id}')"><i class="fas fa-pen-fancy"></i> 提示词</button>
        <button class="btn btn-sm btn-outline" onclick="showAgentLogs('${agent.id}')"><i class="fas fa-list"></i> 日志</button>
        ${hasPrompt?'<span class="badge badge-green" style="font-size:10px;align-self:center"><i class="fas fa-check"></i> 已配置提示词</span>':'<span class="badge badge-gray" style="font-size:10px;align-self:center">未配置提示词</span>'}
      </div>
    </div>`;
  });
  h+=`</div>`;

  c.innerHTML=h;
}

async function toggleAgent(id){
  const agentStates=cfgVal('agent_states',{})||{};
  const st=agentStates[id]||{status:'running'};
  st.status=st.status==='stopped'?'running':'stopped';
  agentStates[id]=st;
  await saveCfg('agent_states',agentStates,'Agent 状态');
  rAgentDash(document.getElementById('main-content'));
}
function refreshAgentDash(){rAgentDash(document.getElementById('main-content'));}

/* Agent 提示词编辑器（弹窗内编辑，融合原 rAiPrompts） */
let _agentPromptRole='beginner';
function showAgentPromptEditor(agentId){
  const agent=AGENTS_DEF.find(a=>a.id===agentId);
  const roleNames={beginner:'新手散户',advanced:'进阶散户',expert:'资深散户'};
  const pKey=`prompt_${agentId}_${_agentPromptRole}`;
  const cur=cfgVal(pKey,{system_prompt:'',version:1})||{system_prompt:'',version:1};
  const sp=cur.system_prompt||'';const ver=cur.version||1;

  /* 预设模板 */
  const tpls={strategy_parse:'你是一个专业的量化策略分析师。用户会用自然语言描述交易想法，你需要将其解析为结构化的策略配置。\n\n要求：\n1. 提取策略名称\n2. 识别买入/卖出条件\n3. 提取技术指标和参数\n4. 给出风控建议（止盈止损）\n5. 输出JSON格式的策略配置\n\n注意：你的分析仅为工具性辅助，不构成任何投资建议。',
    replay_analysis:'你是一个交易复盘分析专家。根据用户的交易记录，分析盈亏根因，给出改进建议。',
    data_validate:'你是一个行情数据校验专家。对比多源数据，标注异常值并给出可信度评分。',
    alert_reason:'你是一个系统告警分析专家。分析告警原因，给出解决方案和预防建议。'};

  let roleTabs='';['beginner','advanced','expert'].forEach(r=>{
    roleTabs+=`<span class="badge ${r===_agentPromptRole?'badge-blue':'badge-gray'}" style="cursor:pointer;padding:6px 14px" onclick="_agentPromptRole='${r}';showAgentPromptEditor('${agentId}')">${roleNames[r]}</span>`;
  });

  document.getElementById('gm-body').innerHTML=`<h3><i class="fas ${agent?.icon||'fa-robot'}" style="color:var(--primary);margin-right:6px"></i>${agent?.name||agentId} 提示词配置</h3>
    <div style="display:flex;gap:6px;margin-bottom:12px">${roleTabs}</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:8px">配置键: ${pKey} · 版本: v${ver}</div>
    <textarea id="apt-editor" rows="10" style="width:100%;padding:14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;background:var(--card2);color:var(--text);font-family:monospace;line-height:1.6;resize:vertical">${sp}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
      ${tpls[agentId]?`<button class="btn btn-sm btn-outline" onclick="document.getElementById('apt-editor').value=\`${tpls[agentId].replace(/`/g,'\\`')}\`"><i class="fas fa-paste"></i> 应用模板</button>`:''}
      <div style="flex:1"></div>
      <button class="btn btn-outline" onclick="closeModal('gm')">取消</button>
      <button class="btn btn-primary" onclick="saveAgentPrompt('${agentId}','${pKey}',${ver})"><i class="fas fa-save"></i> 保存</button>
    </div>`;
  openModal('gm');
}
async function saveAgentPrompt(agentId,key,curVer){
  const sp=document.getElementById('apt-editor').value;
  await saveCfg(key,{system_prompt:sp,version:curVer+1},'提示词-'+key);
  toast('提示词已保存 (v'+(curVer+1)+')','success');
  closeModal('gm');rAgentDash(document.getElementById('main-content'));
}

async function dlAiBak(){try{const h={};if(TK)h['Authorization']='Bearer '+TK;const r=await fetch(API+'/ai-config/backup/download',{headers:h});const b=await r.blob();const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='ai-config.json';a.click();toast('下载成功','success');}catch(e){toast('失败','error');}}
async function rstAiBak(){const f=document.getElementById('rf').files[0];if(!f){toast('请选择文件','error');return;}const fd=new FormData();fd.append('file',f);const d=await apiForm('/ai-config/backup/restore',fd);if(d)toast('恢复成功','success');else toast('失败','error');}

let _warmupPageLogs=[];let _warmupLogVerbose=false;
let _warmupLogLevelFilter={INFO:true,WARN:true,ERROR:true};
function _renderWarmupLogPanel(entries){
  const logPanel=document.getElementById('warmup-log-panel');if(!logPanel)return;
  const filtered=entries.filter(e=>_warmupLogLevelFilter[e.level||'INFO']!==false);
  const n=filtered.length;
  const toggleLevel=(l)=>{_warmupLogLevelFilter[l]=!_warmupLogLevelFilter[l];_renderWarmupLogPanel(window._warmupLogEntriesForCopy||[]);};
  let h=`<div class="log-header" onclick="this.parentElement.classList.toggle('open')">
    <span><i class="fas fa-terminal" style="margin-right:6px"></i>预热日志 (${n})</span>
    <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;display:flex;align-items:center;gap:6px" onclick="event.stopPropagation()">
        <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_warmupLogLevelFilter.INFO?'checked':''} onchange="toggleLevel('INFO')"> INFO</label>
        <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_warmupLogLevelFilter.WARN?'checked':''} onchange="toggleLevel('WARN')"> WARN</label>
        <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_warmupLogLevelFilter.ERROR?'checked':''} onchange="toggleLevel('ERROR')"> ERROR</label>
      </span>
      <label style="font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer" onclick="event.stopPropagation()">
        <button class="toggle ${_warmupLogVerbose?'on':''}" style="width:32px;height:18px" onclick="event.stopPropagation();_warmupLogVerbose=!_warmupLogVerbose;_renderWarmupLogPanel(window._warmupLogEntriesForCopy||[])"></button>
        详细
      </label>
      <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();copyWarmupLogs()" title="复制日志"><i class="fas fa-copy"></i></button>
      <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();copyWarmupLogsAsJson()" title="复制为 JSON"><i class="fas fa-code"></i> JSON</button>
      <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text3);transition:transform .3s"></i>
    </span>
  </div>
  <div class="log-body">`;
  const msgEsc=(s)=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  filtered.forEach(e=>{
    const cls=(e.level==='ERROR'?'log-error':e.level==='WARN'?'log-warn':e.level==='SUCCESS'?'log-success':'log-info');
    if(_warmupLogVerbose){
      const extraKeys=Object.keys(e).filter(k=>k!=='ts'&&k!=='level'&&k!=='msg'&&e[k]!==undefined);
      const extraObj={};extraKeys.forEach(k=>extraObj[k]=e[k]);
      const extraStr=Object.keys(extraObj).length?JSON.stringify(extraObj,null,2):'';
      h+=`<div class="log-line ${cls}"><span style="opacity:.6">[${msgEsc(e.ts||'')}]</span> <b>[${msgEsc(e.level||'INFO')}]</b> ${msgEsc(e.msg)}${extraStr?'<pre style="margin:4px 0 0 0;font-size:11px;opacity:.85;white-space:pre-wrap;word-break:break-all">'+msgEsc(extraStr)+'</pre>':''}</div>`;
    }else h+=`<div class="log-line ${cls}">${msgEsc(e.msg||'')}</div>`;
  });
  if(n===0)h+=`<div class="log-line log-debug" style="text-align:center;padding:12px">暂无日志</div>`;
  h+=`</div>`;
  logPanel.innerHTML=h;
  window._warmupLogFilteredForCopy=filtered;
  if(n>0)logPanel.classList.add('open');
}

  if(d&&d.code===0&&d.data){
    const r=d.data;if(r.is_running){_updateWarmupStatusArea(r);entries=(r.log_entries||[]).concat(_warmupPageLogs).map(e=>({...e,tsMs:_tsMs(e)})).sort((a,b)=>(a.tsMs||0)-(b.tsMs||0));window._warmupLogEntriesForCopy=entries;_renderWarmupLogPanel(entries);return;}

const WARMUP_STALE_HOURS=4;
function _formatAgo(ts){
  if(!ts)return '';
  const t=typeof ts==='string'?new Date(ts).getTime():ts;
  if(isNaN(t))return '';
  const diff=Date.now()-t;
  if(diff<60000)return '刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前';
  return Math.floor(diff/86400000)+'天前';
}

function _pollWarmupStatus(onDone){
  const _tsMs=(e)=>{if(e.tsMs)return e.tsMs;if(e.ts)return new Date(e.ts).getTime();return 0;};
  const poll=async ()=>{
    const d=await api('/ops/market-warmup/status');
    const r=d?.data;
    if(!r||!r.is_running){
      const res=r?.results||{};const err=res.error;const hasError=!!err||Object.values(res).some(v=>v&&typeof v==='object'&&v.ok===false);
      onDone(hasError,err);
      return;
    }
    _updateWarmupStatusArea(r);
    const entries=(r.log_entries||[]).concat(_warmupPageLogs).map(e=>({...e,tsMs:_tsMs(e)})).sort((a,b)=>(a.tsMs||0)-(b.tsMs||0));
    window._warmupLogEntriesForCopy=entries;
    _renderWarmupLogPanel(entries);
    setTimeout(poll,2000);
  };
  poll();
}

/* ---- 网络代理（代理池）---- */
let _proxyTestResults=[];
let _proxyPageSize=20;
let _proxyCurrentPage=1;
let _proxyLogEntries=[];let _proxyLogVerbose=false;
let _proxyLogLevelFilter={INFO:true,WARN:true,ERROR:true};
const _PROXY_LOG_CAP=500;
function _proxyLogLinesToEntries(lines){
  if(!Array.isArray(lines))return [];
  return lines.map(line=>{
    if(line&&typeof line==='object'&&('level' in line)&&('msg' in line))return {ts:line.ts||new Date().toISOString(),level:line.level||'INFO',msg:line.msg,...line};
    const msg=typeof line==='string'?line:String(line);
    const ts=new Date().toISOString();
    let level='INFO';
    if(/^\[ERROR\]/i.test(msg)||/\[error\]/i.test(msg)||/\bfailed\b/i.test(msg)&&/error|redis|write|exception/i.test(msg))level='ERROR';
    else if(/^\[WARN\]/i.test(msg)||/^\[warn\]/i.test(msg)||/\[warn\]/i.test(msg)||/\bskip\b/i.test(msg))level='WARN';
    return {ts,level,msg};
  });
}
function _renderProxyLogPanel(entries){
  const logPanel=document.getElementById('proxy-log-panel');if(!logPanel)return;
  const filtered=entries.filter(e=>_proxyLogLevelFilter[e.level||'INFO']!==false);
  const n=filtered.length;
  const toggleLevel=(l)=>{_proxyLogLevelFilter[l]=!_proxyLogLevelFilter[l];_renderProxyLogPanel(window._proxyLogEntriesForCopy||[]);};
  let h=`<div class="log-header" onclick="this.parentElement.classList.toggle('open')">
    <span><i class="fas fa-terminal" style="margin-right:6px"></i>网络代理日志 (${n})</span>
    <span style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:11px;display:flex;align-items:center;gap:6px" onclick="event.stopPropagation()">
        <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_proxyLogLevelFilter.INFO?'checked':''} onchange="toggleLevel('INFO')"> INFO</label>
        <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_proxyLogLevelFilter.WARN?'checked':''} onchange="toggleLevel('WARN')"> WARN</label>
        <label style="cursor:pointer;display:flex;align-items:center;gap:2px"><input type="checkbox" ${_proxyLogLevelFilter.ERROR?'checked':''} onchange="toggleLevel('ERROR')"> ERROR</label>
      </span>
      <label style="font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer" onclick="event.stopPropagation()">
        <button class="toggle ${_proxyLogVerbose?'on':''}" style="width:32px;height:18px" onclick="event.stopPropagation();_proxyLogVerbose=!_proxyLogVerbose;_renderProxyLogPanel(window._proxyLogEntriesForCopy||[])"></button>
        详细
      </label>
      <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();copyProxyLogs()" title="复制日志"><i class="fas fa-copy"></i></button>
      <button class="btn btn-sm btn-ghost" onclick="event.stopPropagation();copyProxyLogsAsJson()" title="复制为 JSON"><i class="fas fa-code"></i> JSON</button>
      <i class="fas fa-chevron-down" style="font-size:10px;color:var(--text3);transition:transform .3s"></i>
    </span>
  </div>
  <div class="log-body">`;
  const msgEsc=(s)=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  filtered.forEach(e=>{
    const cls=(e.level==='ERROR'?'log-error':e.level==='WARN'?'log-warn':'log-info');
    if(_proxyLogVerbose){
      const extraKeys=Object.keys(e).filter(k=>k!=='ts'&&k!=='level'&&k!=='msg'&&e[k]!==undefined);
      const extraObj={};extraKeys.forEach(k=>extraObj[k]=e[k]);
      const extraStr=Object.keys(extraObj).length?JSON.stringify(extraObj,null,2):'';
      h+=`<div class="log-line ${cls}"><span style="opacity:.6">[${msgEsc(e.ts||'')}]</span> <b>[${msgEsc(e.level||'INFO')}]</b> ${msgEsc(e.msg)}${extraStr?'<pre style="margin:4px 0 0 0;font-size:11px;opacity:.85;white-space:pre-wrap;word-break:break-all">'+msgEsc(extraStr)+'</pre>':''}</div>`;
    }else h+=`<div class="log-line ${cls}">${msgEsc(e.msg||'')}</div>`;
  });
  if(n===0)h+=`<div class="log-line log-debug" style="text-align:center;padding:12px">暂无日志</div>`;
  h+=`</div>`;
  logPanel.innerHTML=h;
  window._proxyLogFilteredForCopy=filtered;
  if(n>0)logPanel.classList.add('open');
}
function _appendProxyLogLines(lines){
  const entries=_proxyLogLinesToEntries(lines);
  if(!entries.length)return;
  _proxyLogEntries=(_proxyLogEntries.concat(entries)).slice(-_PROXY_LOG_CAP);
  window._proxyLogEntriesForCopy=_proxyLogEntries;
  _renderProxyLogPanel(_proxyLogEntries);
}
function copyProxyLogs(){
  const entries=window._proxyLogEntriesForCopy||[];
  const text=entries.map(e=>'['+(e.ts||'')+'] '+(e.level||'')+': '+(e.msg||'')).join('\n');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>toast('已复制','success')).catch(()=>toast('复制失败','error'));
  else toast('复制需要 HTTPS','error');
}
function copyProxyLogsAsJson(){

      const useProxy=!!(apiCat&&apiCat.use_proxy);
      h+=_renderSyncCard(cat,synced,lastDate,curInterval,useProxy);
    }

    if(scheduleEl&&data.schedule_enabled!==undefined){scheduleEl.classList.toggle('on',!!data.schedule_enabled);}

    const retryEl=document.getElementById('sync-ak-retry-count');
    if(retryEl&&data.sync_ak_retry_count!=null){retryEl.value=Math.max(0,Math.min(10,data.sync_ak_retry_count));}

  }catch(e){

async function saveSyncIntervals(){
  const sels=document.querySelectorAll('.sync-interval-sel');
  if(!sels.length){toast('没有可保存的频率配置','warning');return;}
  const intervals={};
  sels.forEach(sel=>{intervals[sel.dataset.cat]=parseInt(sel.value);});
  const use_proxy={};
  document.querySelectorAll('.sync-use-proxy-toggle').forEach(t=>{use_proxy[t.dataset.cat]=t.classList.contains('on');});
  const scheduleEl=document.getElementById('sync-schedule-toggle');
  const schedule_enabled=scheduleEl?scheduleEl.classList.contains('on'):undefined;
  const wcEl=document.getElementById('sync-worker-concurrency');
  let worker_concurrency;if(wcEl){const v=parseInt(wcEl.value,10);if(v>=1&&v<=8)worker_concurrency=v;}
  const retryEl=document.getElementById('sync-ak-retry-count');
  const timeoutEl=document.getElementById('sync-ak-timeout-seconds');
  const replaceEl=document.getElementById('sync-proxy-replace-after');
  let sync_ak_config;
  if(retryEl||timeoutEl||replaceEl){
    sync_ak_config={};
    if(retryEl){const v=parseInt(retryEl.value,10);if(v>=0&&v<=10)sync_ak_config.retry_count=v;}
    if(timeoutEl){const v=parseInt(timeoutEl.value,10);if(v>=1&&v<=300)sync_ak_config.timeout_seconds=v;}
    if(replaceEl){const v=parseInt(replaceEl.value,10);if(v>=1&&v<=10)sync_ak_config.replace_after_failures=v;}
    if(Object.keys(sync_ak_config).length===0)sync_ak_config=undefined;
  }
  try{
    const payload={intervals,use_proxy};if(schedule_enabled!==undefined)payload.schedule_enabled=schedule_enabled;if(worker_concurrency!==undefined)payload.worker_concurrency=worker_concurrency;if(sync_ak_config)payload.sync_ak_config=sync_ak_config;
    const resp=await api('/data-sync/set-interval',{method:'POST',body:JSON.stringify(payload)});
    if(resp&&(resp.code===0||resp.data)){toast('频率与代理配置已保存','success');_appendSyncLogLines([{ts:new Date().toISOString(),level:'INFO',msg:'频率与代理配置已保存'}]);if(typeof refreshSyncStatus==='function')refreshSyncStatus();}
    else{toast('保存失败: '+(resp?.message||'未知错误'),'error');}
  }catch(e){toast('保存配置失败: '+e.message,'error');}
}

/* ---- 数据拉取日志（仿代理：条数/级别/详细/复制，实时+历史）---- */
let _syncLogEntries=[];let _syncLogVerbose=false;
let _syncLogLevelFilter={INFO:true,WARN:true,ERROR:true};
const _SYNC_LOG_CAP=500;
window._syncRunningLogsView='realtime';
function _syncLogLinesToEntries(lines){
  if(!Array.isArray(lines))return [];
  return lines.map(line=>{
    if(line&&typeof line==='object'&&('level' in line)&&('msg' in line))return {ts:line.ts||new Date().toISOString(),level:line.level||'INFO',msg:line.msg,task_id:line.task_id,category:line.category,...line};
    const msg=typeof line==='string'?line:String(line);
    return {ts:new Date().toISOString(),level:'INFO',msg:msg};
  });
}
function _syncDedupKey(e){const t=e.task_id!=null?String(e.task_id):'';const ts=e.ts||'';const m=String(e.msg||'').slice(0,50);return t+'\0'+ts+'\0'+m;}
function _appendSyncLogLines(linesOrEntries){
  const entries=_syncLogLinesToEntries(linesOrEntries);
  if(!entries.length)return;
  let merged=_syncLogEntries.concat(entries).sort((a,b)=>(a.ts||'').localeCompare(b.ts||''));
  const seen=new Set();merged=merged.filter(e=>{const k=_syncDedupKey(e);if(seen.has(k))return false;seen.add(k);return true;}).slice(-_SYNC_LOG_CAP);
  _syncLogEntries=merged;
  window._syncLogEntriesForCopy=_syncLogEntries;
  _renderSyncLogPanel(_syncLogEntries);
}
function _renderSyncLogPanel(entries){
  const panel=document.getElementById('sync-running-logs-panel');if(!panel)return;
  const filtered=entries.filter(e=>_syncLogLevelFilter[e.level||'INFO']!==false);
  const n=filtered.length;
  const toggleLevel=(l)=>{_syncLogLevelFilter[l]=!_syncLogLevelFilter[l];_renderSyncLogPanel(window._syncLogEntriesForCopy||[]);};
